<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POCKET DIARY - คลังเก็บของ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fbfbfb;
            color: #1a1a1a;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            overscroll-behavior-y: auto;
            touch-action: pan-y;
        }
        .royal-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .royal-btn {
            background: #111111;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .royal-btn:hover {
            background: #2d2d2d;
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex flex-col justify-between select-none pb-8">

    <!-- Header -->
    <div class="relative z-20 p-4 max-w-lg mx-auto w-full flex flex-col gap-3">
        <div class="flex items-center justify-between">
            <button onclick="window.location.href='home.html'" class="royal-card px-4 py-2 rounded-2xl text-xs font-semibold flex items-center gap-2 cursor-pointer shadow-sm">
                <span>←</span> กลับหน้าหลัก
            </button>
            <h1 class="font-bold text-base text-neutral-900 flex items-center gap-2">
                <span>🎒</span> คลังเก็บของ (Inventory)
            </h1>
            <div class="w-20"></div>
        </div>

        <!-- หมวดหมู่ Inventory (1. Background, 2. Item) -->
        <div class="flex gap-2 bg-neutral-100 p-1.5 rounded-2xl">
            <button onclick="switchInventoryTab('background')" id="tab-background" class="flex-1 py-2 rounded-xl text-xs font-bold transition-all royal-btn">ภาพพื้นหลัง (Background)</button>
            <button onclick="switchInventoryTab('item')" id="tab-item" class="flex-1 py-2 rounded-xl text-xs font-bold transition-all text-neutral-600">ไอเท็มอื่นๆ (Item)</button>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="relative z-10 flex-1 max-w-lg mx-auto w-full p-4">
        
        <!-- หมวด Background -->
        <div id="section-background" class="grid grid-cols-2 gap-3">
            <!-- รายการ Background จะถูกเรนเดอร์ที่นี่ -->
        </div>

        <!-- หมวด Item -->
        <div id="section-item" class="space-y-3 hidden">
            <!-- รายการ Item จะถูกเรนเดอร์ที่นี่ -->
        </div>

    </div>

    <!-- Popup สำหรับใช้งานหรือจัดการไอเท็ม -->
    <div id="item-action-popup" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden" style="background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);">
        <div class="royal-card w-full max-w-xs rounded-3xl p-6 relative flex flex-col items-center shadow-2xl text-center space-y-4">
            <div id="popup-item-img-container" class="w-20 h-20 rounded-2xl overflow-hidden bg-neutral-100 border border-neutral-200 shadow-inner">
                <img id="popup-item-img" src="" class="w-full h-full object-cover">
            </div>
            <div>
                <h3 id="popup-item-name" class="font-bold text-sm text-neutral-900">ชื่อไอเท็ม</h3>
                <p id="popup-item-property" class="text-xs text-neutral-500 mt-1">คุณสมบัติไอเท็ม</p>
            </div>
            <div class="w-full space-y-2 pt-2">
                <button id="popup-action-btn" onclick="executeItemAction()" class="w-full py-2.5 rounded-xl text-xs font-bold royal-btn cursor-pointer shadow-md">ใช้งาน</button>
                <button onclick="closeItemPopup()" class="w-full py-2 rounded-xl text-xs font-bold bg-neutral-100 text-neutral-700 hover:bg-neutral-200 cursor-pointer">ปิด</button>
            </div>
        </div>
    </div>

    <!-- Popup แจ้งเตือนทั่วไป -->
    <div id="alert-popup" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden" style="background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);">
        <div class="royal-card w-full max-w-xs rounded-3xl p-6 relative flex flex-col items-center shadow-2xl text-center space-y-3">
            <div id="alert-icon" class="text-3xl mb-1">✨</div>
            <h3 id="alert-title" class="font-bold text-sm text-neutral-900">แจ้งเตือน</h3>
            <p id="alert-message" class="text-xs text-neutral-600">ข้อความแจ้งเตือน</p>
            <button onclick="closeAlertPopup()" class="w-full py-2 rounded-xl text-xs font-bold royal-btn cursor-pointer mt-2">ตกลง</button>
        </div>
    </div>

    <!-- Supabase & Config Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        let currentUserId = null;
        let activeTab = 'background';
        let userBackgrounds = [];
        let userItems = [];
        let selectedItem = null;

        async function initInventory() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            currentUserId = session.user.id;
            await loadInventoryData();
        }

        async function loadInventoryData() {
            // โหลด Backgrounds
            const { data: bgData } = await supabase
                .from('user_backgrounds')
                .select('*')
                .eq('user_id', currentUserId);
            userBackgrounds = bgData || [];

            // โหลด Items
            const { data: itemData } = await supabase
                .from('user_items')
                .select('*')
                .eq('user_id', currentUserId);
            userItems = itemData || [];

            renderBackgrounds();
            renderItems();
        }

        function switchInventoryTab(tabKey) {
            activeTab = tabKey;
            const btnBg = document.getElementById('tab-background');
            const btnItem = document.getElementById('tab-item');
            const secBg = document.getElementById('section-background');
            const secItem = document.getElementById('section-item');

            if (tabKey === 'background') {
                btnBg.className = 'flex-1 py-2 rounded-xl text-xs font-bold transition-all royal-btn';
                btnItem.className = 'flex-1 py-2 rounded-xl text-xs font-bold transition-all text-neutral-600';
                secBg.classList.remove('hidden');
                secItem.classList.add('hidden');
            } else {
                btnItem.className = 'flex-1 py-2 rounded-xl text-xs font-bold transition-all royal-btn';
                btnBg.className = 'flex-1 py-2 rounded-xl text-xs font-bold transition-all text-neutral-600';
                secItem.classList.remove('hidden');
                secBg.classList.add('hidden');
            }
        }

        function renderBackgrounds() {
            const grid = document.getElementById('section-background');
            grid.innerHTML = '';

            if (userBackgrounds.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-center text-xs text-neutral-400 py-10">ยังไม่มีพื้นหลังในคลังเก็บของ สามารถซื้อได้จากร้านค้าหรือสุ่มกาชา</div>';
                return;
            }

            userBackgrounds.forEach(bg => {
                const div = document.createElement('div');
                div.className = 'royal-card p-3 rounded-2xl flex flex-col items-center space-y-2 cursor-pointer shadow-md hover:shadow-lg transition-all';
                div.innerHTML = `
                    <div class="w-full aspect-[16/9] rounded-xl overflow-hidden bg-neutral-100 border border-neutral-200">
                        <img src="${bg.image_url}" class="w-full h-full object-cover">
                    </div>
                    <div class="w-full flex items-center justify-between">
                        <span class="font-bold text-xs text-neutral-900 truncate">${bg.name || 'พื้นหลัง'}</span>
                        <button onclick="equipBackground('${bg.image_url}')" class="px-3 py-1 bg-neutral-900 text-white rounded-xl text-[10px] font-bold shadow-sm">ใช้งาน</button>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        async function equipBackground(imgUrl) {
            // บันทึกพื้นหลังที่เลือกใช้งานไปยังตารางผู้ใช้ (สำหรับหน้า Home)
            const { error } = await supabase
                .from('users')
                .update({ active_background: imgUrl })
                .eq('id', currentUserId);

            if (error) {
                showAlert('เกิดข้อผิดพลาด', error.message, '❌');
            } else {
                showAlert('สวมใส่สำเร็จ', 'เปลี่ยนภาพพื้นหลังหน้าหลักเรียบร้อยแล้ว', '🖼️');
            }
        }

        function renderItems() {
            const list = document.getElementById('section-item');
            list.innerHTML = '';

            if (userItems.length === 0) {
                list.innerHTML = '<div class="text-center text-xs text-neutral-400 py-10">ยังไม่มีไอเท็มในคลังเก็บของ</div>';
                return;
            }

            userItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'royal-card p-4 rounded-2xl flex items-center justify-between shadow-sm cursor-pointer hover:shadow-md transition-all';
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-xl overflow-hidden bg-neutral-100 border border-neutral-200 shrink-0">
                            <img src="${item.image_url}" class="w-full h-full object-cover">
                        </div>
                        <div>
                            <div class="font-bold text-xs text-neutral-900">${item.name}</div>
                            <div class="text-[10px] text-neutral-500 mt-0.5">${item.property || 'ไอเท็มทั่วไป'}</div>
                        </div>
                    </div>
                    <button onclick='openItemActionPopup(${JSON.stringify(item)})' class="px-3 py-1.5 bg-neutral-900 text-white rounded-xl text-[10px] font-bold shadow-sm">จัดการ</button>
                `;
                list.appendChild(div);
            });
        }

        function openItemActionPopup(item) {
            selectedItem = item;
            document.getElementById('popup-item-img').src = item.image_url;
            document.getElementById('popup-item-name').innerText = item.name;
            document.getElementById('popup-item-property').innerText = item.property || 'ไม่มีคุณสมบัติระบุ';

            const actionBtn = document.getElementById('popup-action-btn');
            if (item.type === 'ของทั่วไป') {
                actionBtn.innerText = 'ขายไอเท็ม (รับ 50 เหรียญ)';
            } else if (item.type === 'เพิ่มความสัมพันธ์') {
                actionBtn.innerText = 'ใช้เพิ่มความสัมพันธ์กับเพื่อน';
            } else {
                actionBtn.innerText = 'ใช้งานไอเท็ม';
            }

            document.getElementById('item-action-popup').classList.remove('hidden');
        }

        function closeItemPopup() {
            document.getElementById('item-action-popup').classList.add('hidden');
            selectedItem = null;
        }

        async function executeItemAction() {
            if (!selectedItem) return;

            if (selectedItem.type === 'ของทั่วไป') {
                // ขายไอเท็มได้ 50 เหรียญเข้าธนาคาร
                const { data: acc } = await supabase.from('users').select('coins').eq('id', currentUserId).single();
                const newCoins = (acc.coins || 0) + 50;
                await supabase.from('users').update({ coins: newCoins }).eq('id', currentUserId);

                // ลบไอเท็มออกจาก Inventory
                await supabase.from('user_items').delete().eq('id', selectedItem.id);

                showAlert('ขายไอเท็มสำเร็จ', 'ได้รับ 50 เหรียญเข้าธนาคารเรียบร้อยแล้ว', '🪙');
                closeItemPopup();
                loadInventoryData();
            } else {
                showAlert('แจ้งเตือน', 'ไอเท็มชิ้นนี้สามารถใช้งานผ่านระบบเพื่อนหรือกิจกรรมที่เกี่ยวข้อง', '✨');
                closeItemPopup();
            }
        }

        function showAlert(title, message, icon = '✨') {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            document.getElementById('alert-icon').innerText = icon;
            document.getElementById('alert-popup').classList.remove('hidden');
        }

        function closeAlertPopup() {
            document.getElementById('alert-popup').classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', initInventory);
    </script>
</body>
</html>
