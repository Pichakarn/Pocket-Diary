<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POCKET DIARY - คลังเก็บของ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fbfbfb;
            color: #1a1a1a;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            overscroll-behavior-y: auto;
        }
        .royal-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .royal-btn {
            background: #111111;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .royal-btn:hover {
            background: #2d2d2d;
            transform: translateY(-1px);
        }
        .tab-active {
            background: #111111 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex flex-col justify-between select-none">

    <!-- Top Navigation Bar & Category Tabs -->
    <div class="relative z-20 p-4 max-w-lg mx-auto w-full flex flex-col gap-3">
        <div class="flex items-center justify-between">
            <button onclick="window.location.href='home.html'" class="royal-card px-4 py-2 rounded-2xl text-xs font-semibold flex items-center gap-2 cursor-pointer shadow-sm">
                <span>←</span> กลับหน้าหลัก
            </button>
            <h1 class="font-bold text-base text-neutral-900 flex items-center gap-2">
                <span>🎒</span> คลังเก็บของ
            </h1>
            <div class="w-20"></div>
        </div>

        <!-- หมวดหมู่ Inventory: Background และ Item -->
        <div class="grid grid-cols-2 gap-2">
            <button onclick="switchTab('background')" id="btn-background" class="tab-active py-2.5 rounded-2xl text-xs font-semibold royal-card transition-all cursor-pointer text-center shadow-sm">
                🖼️ พื้นหลัง (Background)
            </button>
            <button onclick="switchTab('item')" id="btn-item" class="py-2.5 rounded-2xl text-xs font-semibold royal-card transition-all cursor-pointer text-center shadow-sm">
                📦 ไอเท็มทั่วไป (Item)
            </button>
        </div>
    </div>

    <!-- Main Content Grid -->
    <div class="relative z-10 flex-1 max-w-lg mx-auto w-full p-4 overflow-y-auto">
        <div id="inventory-grid" class="grid grid-cols-2 gap-4 pb-6">
            <!-- รายการในคลังจะแสดงที่นี่ -->
            <div class="col-span-2 text-center py-12 text-neutral-400 text-sm">กำลังโหลดคลังเก็บของ...</div>
        </div>
    </div>

    <!-- Supabase & Config Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        let currentUserId = null;
        let currentTab = 'background'; // 'background' หรือ 'item'

        async function initInventory() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            currentUserId = session.user.id;
            loadInventoryData();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('button[id^="btn-"]').forEach(btn => btn.classList.remove('tab-active'));
            document.getElementById(`btn-${tab}`).classList.add('tab-active');
            loadInventoryData();
        }

        async function loadInventoryData() {
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = '<div class="col-span-2 text-center py-12 text-neutral-400 text-sm">กำลังโหลด...</div>';

            try {
                if (currentTab === 'background') {
                    // ดึงข้อมูลพื้นหลังของผู้เล่นจากตาราง user_backgrounds
                    const { data, error } = await supabase
                        .from('user_backgrounds')
                        .select('*')
                        .eq('user_id', currentUserId);

                    if (error) throw error;
                    renderBackgrounds(data || []);
                } else {
                    // ดึงข้อมูลไอเท็มของผู้เล่นจากตาราง user_items
                    const { data, error } = await supabase
                        .from('user_items')
                        .select('*')
                        .eq('user_id', currentUserId);

                    if (error) throw error;
                    renderItems(data || []);
                }
            } catch (err) {
                console.error('Error loading inventory:', err.message);
                grid.innerHTML = '<div class="col-span-2 text-center py-12 text-red-400 text-sm">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>';
            }
        }

        function renderBackgrounds(backgrounds) {
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = '';

            if (backgrounds.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-center py-12 text-neutral-400 text-sm">ยังไม่มีพื้นหลังในคลัง (สามารถหาซื้อได้จากร้านค้า)</div>';
                return;
            }

            backgrounds.forEach(bg => {
                const card = document.createElement('div');
                card.className = 'royal-card rounded-2xl p-3 flex flex-col items-center shadow-sm';
                card.innerHTML = `
                    <div class="w-full h-32 rounded-xl bg-cover bg-center mb-3 border border-neutral-100" style="background-image: url('${bg.image_url}')"></div>
                    <span class="font-bold text-xs text-neutral-900 mb-2 truncate w-full text-center">${bg.name || 'พื้นหลัง'}</span>
                    <button onclick="equipBackground('${bg.image_url}')" class="w-full py-2 rounded-xl text-[11px] font-semibold royal-btn cursor-pointer">
                        สวมใส่
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function renderItems(items) {
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-center py-12 text-neutral-400 text-sm">ยังไม่มีไอเท็มในคลัง</div>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'royal-card rounded-2xl p-4 flex flex-col items-center justify-between shadow-sm';
                card.innerHTML = `
                    <img src="${item.image_url || 'https://res.cloudinary.com/demo/image/upload/v1312461200/sample.jpg'}" alt="${item.name}" class="h-20 w-auto object-contain mb-2">
                    <div class="text-center w-full mb-3">
                        <span class="font-bold text-xs text-neutral-900 block">${item.name}</span>
                        <span class="text-[10px] text-neutral-500">จำนวน: ${item.quantity || 1}</span>
                    </div>
                    <button onclick="useItem('${item.id}', '${item.type}')" class="w-full py-2 rounded-xl text-[11px] font-semibold royal-card border border-neutral-300 hover:bg-neutral-100 cursor-pointer">
                        ใช้งาน / เปิดใช้
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        // ฟังก์ชันสวมใส่พื้นหลังหน้าล็อบบี้
        async function equipBackground(imageUrl) {
            try {
                const { error } = await supabase
                    .from('users')
                    .update({ equipped_background: imageUrl })
                    .eq('id', currentUserId);

                if (error) throw error;
                showPopup('สำเร็จ', 'เปลี่ยนภาพพื้นหลังหน้าล็อบบี้เรียบร้อยแล้ว!', '🖼️');
            } catch (err) {
                showPopup('เกิดข้อผิดพลาด', err.message, '❌');
            }
        }

        // ฟังก์ชันใช้งานไอเท็ม
        function useItem(itemId, itemType) {
            showPopup('ใช้งานไอเท็ม', `กดใช้งานไอเท็มเรียบร้อยแล้ว (คุณสมบัติประเภท: ${itemType || 'ทั่วไป'})`, '📦');
        }

        window.addEventListener('DOMContentLoaded', initInventory);
    </script>
</body>
</html>
