<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POCKET DIARY - คลังเก็บของ</title>
  
  <!-- Google Font: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-pearl: #FDFBFB;
      --bg-pearl-gradient: linear-gradient(135deg, #FFFFFF 0%, #EFECE6 100%);
      --royal-black: #111111;
      --royal-gold: #D4AF37;
      --accent-gray: #555555;
      --border-color: rgba(17, 17, 17, 0.15);
      --shadow-luxury: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--bg-pearl-gradient);
      color: var(--royal-black);
      position: relative;
    }

    /* Top HUD */
    .top-hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(253, 251, 251, 0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
    }

    .back-btn, .currency-box {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      text-decoration: none;
      color: var(--royal-black);
      cursor: pointer;
    }

    .currency-container {
      display: flex;
      gap: 8px;
    }

    .currency-box img {
      width: 18px; height: 18px; object-fit: contain;
    }

    /* Main Container */
    .inventory-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 80px 20px 30px 20px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Tab Switcher */
    .inv-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .inv-tab-btn {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: #FFF;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--accent-gray);
      transition: all 0.2s;
    }

    .inv-tab-btn.active {
      background: var(--royal-black);
      color: #FFF;
      border-color: var(--royal-black);
      box-shadow: var(--shadow-luxury);
    }

    /* Grid แสดงผลแบบจิ๋ว (Mini Cards) */
    .inv-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    .inv-card {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 8px;
      text-align: center;
      box-shadow: var(--shadow-luxury);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s;
    }

    .inv-card:active {
      transform: scale(0.96);
    }

    /* โปสเตอร์แบล็คกราวน์จิ๋ว (แนวนอน) */
    .inv-card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 6px;
      background: #F4F3F0;
    }

    /* ไอเทมจิ๋ว (1:1 สี่เหลี่ยมจัตุรัส) */
    .inv-card.item-type img {
      aspect-ratio: 1 / 1;
      object-fit: contain;
      padding: 4px;
    }

    .inv-item-name {
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .equipped-badge {
      position: absolute;
      top: 6px; right: 6px;
      background: var(--royal-gold);
      color: #111;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* สถานะเมื่อไม่มีข้อมูล */
    .empty-state {
      grid-column: span 3;
      text-align: center;
      padding: 40px 20px;
      color: var(--accent-gray);
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 16px;
      border: 1px dashed var(--border-color);
    }

    /* Popup ขยายใหญ่เมื่อคลิกดูรายละเอียด */
    .popup-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }

    .popup-overlay.show { opacity: 1; pointer-events: auto; }

    .popup-card {
      background: #FFF; width: 85%; max-width: 340px;
      border-radius: 20px; padding: 20px; text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      position: relative;
      transform: scale(0.9);
      transition: transform 0.3s;
    }

    .popup-overlay.show .popup-card {
      transform: scale(1);
    }

    .popup-close {
      position: absolute;
      top: 15px; right: 15px;
      background: none; border: none;
      font-size: 1.1rem; cursor: pointer;
      color: var(--accent-gray);
    }

    .popup-img-container {
      width: 100%;
      margin-bottom: 12px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background: #F4F3F0;
    }

    .popup-img-container img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    .popup-img-container.bg-preview {
      aspect-ratio: 16 / 9;
    }

    .popup-img-container.item-preview {
      aspect-ratio: 1 / 1;
      object-fit: contain;
      padding: 10px;
    }

    .popup-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .popup-desc {
      color: var(--accent-gray);
      margin-bottom: 15px;
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .popup-btn {
      width: 100%;
      padding: 10px;
      background: var(--royal-black);
      color: #FFF;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .popup-btn.equipped {
      background: var(--royal-gold);
      color: #111;
    }
  </style>
</head>
<body>

  <!-- Top HUD -->
  <header class="top-hud">
    <a href="home.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> หน้าหลัก
    </a>
    <div class="currency-container">
      <div class="currency-box">
        <i class="fa-solid fa-coins" style="color: var(--royal-gold);"></i>
        <span id="userCoins">0</span>
      </div>
      <div class="currency-box">
        <i class="fa-solid fa-cookie-bite" style="color: #c68b59;"></i>
        <span id="userCookies">0</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="inventory-container">
    <div class="section-title">
      <i class="fa-solid fa-suitcase"></i> คลังเก็บของ (Inventory)
    </div>

    <!-- Tab Switcher -->
    <div class="inv-tabs">
      <button class="inv-tab-btn active" id="tabBgBtn" onclick="switchTab('background')">พื้นหลัง (Background)</button>
      <button class="inv-tab-btn" id="tabItemBtn" onclick="switchTab('item')">ไอเท็มอื่นๆ (Item)</button>
    </div>
    
    <div class="inv-grid" id="inventoryGrid">
      <div class="empty-state">กำลังโหลดข้อมูล...</div>
    </div>
  </main>

  <!-- Popup รายละเอียดเมื่อคลิกการ์ดจิ๋ว -->
  <div class="popup-overlay" id="detailPopup">
    <div class="popup-card">
      <button class="popup-close" onclick="closePopup()"><i class="fa-solid fa-xmark"></i></button>
      <div class="popup-img-container" id="popupImgContainer">
        <img id="popupImg" src="" alt="Item Preview">
      </div>
      <h3 class="popup-title" id="popupTitle">ชื่อไอเท็ม</h3>
      <p class="popup-desc" id="popupDesc">รายละเอียดคุณสมบัติไอเท็ม...</p>
      <button id="popupActionBtn" class="popup-btn" onclick="executePopupAction()">ปุ่มดำเนินการ</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://ooozqddxvxeykwubumli.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xwsBeo4TJfLSwnQUiV2uSw_7GwLZd85';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentTab = 'background';
    let userInventoryItems = [];
    let selectedItem = null;

    window.switchTab = function(tab) {
      currentTab = tab;
      document.getElementById('tabBgBtn').classList.toggle('active', tab === 'background');
      document.getElementById('tabItemBtn').classList.toggle('active', tab === 'item');
      renderInventoryGrid();
    }

    async function initInventory() {
      const savedUser = sessionStorage.getItem('pocket_diary_user');
      if (!savedUser) {
        window.location.href = 'index.html';
        return;
      }
      
      const localUser = JSON.parse(savedUser);

      try {
        const { data: freshUser, error } = await supabase
          .from('users')
          .select('*')
          .eq('id', localUser.id)
          .single();

        if (error) throw error;
        currentUser = freshUser || localUser;
        sessionStorage.setItem('pocket_diary_user', JSON.stringify(currentUser));
      } catch (err) {
        currentUser = localUser;
      }

      updateCurrencyDisplay();
      await fetchInventoryData();

      supabase
        .channel('public:users_inventory')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'users', filter: `id=eq.${currentUser.id}` }, payload => {
          currentUser = payload.new;
          sessionStorage.setItem('pocket_diary_user', JSON.stringify(currentUser));
          updateCurrencyDisplay();
          renderInventoryGrid();
        })
        .subscribe();
    }

    function updateCurrencyDisplay() {
      document.getElementById('userCoins').textContent = (currentUser.coins || 0).toLocaleString();
      document.getElementById('userCookies').textContent = (currentUser.cookies || 0).toLocaleString();
    }

    async function fetchInventoryData() {
      const grid = document.getElementById('inventoryGrid');
      grid.innerHTML = '<div class="empty-state">กำลังโหลดข้อมูลคลัง...</div>';

      try {
        const { data: items, error } = await supabase
          .from('user_inventory')
          .select('*')
          .eq('user_id', currentUser.id);

        if (error) throw error;
        userInventoryItems = items || [];
        renderInventoryGrid();
      } catch (err) {
        console.error('Error fetching inventory:', err);
        grid.innerHTML = '<div class="empty-state">เกิดข้อผิดพลาดในการโหลดคลังเก็บของ</div>';
      }
    }

    function renderInventoryGrid() {
      const grid = document.getElementById('inventoryGrid');
      const filteredItems = userInventoryItems.filter(i => i.type === currentTab);

      if (filteredItems.length === 0) {
        grid.innerHTML = `<div class="empty-state">ไม่มี${currentTab === 'background' ? 'ภาพพื้นหลัง' : 'ไอเท็ม'}ในคลัง<br>สามารถหาซื้อได้จากร้านค้าหรือสุ่มกาชา</div>`;
        return;
      }

      grid.innerHTML = '';
      filteredItems.forEach(item => {
        const card = document.createElement('div');
        card.className = `inv-card ${currentTab === 'item' ? 'item-type' : ''}`;
        
        let badgeHTML = '';
        if (currentTab === 'background' && currentUser.equipped_background === item.image_url) {
          badgeHTML = `<div class="equipped-badge">ใช้งาน</div>`;
        }

        card.innerHTML = `
          ${badgeHTML}
          <img src="${item.image_url || 'https://via.placeholder.com/150'}" alt="${item.name || 'ไอเท็ม'}">
          <div class="inv-item-name">${item.name || 'ไอเท็มพิเศษ'}</div>
        `;

        card.onclick = () => openItemDetail(item);
        grid.appendChild(card);
      });
    }

    window.openItemDetail = function(item) {
      selectedItem = item;
      const popup = document.getElementById('detailPopup');
      const imgContainer = document.getElementById('popupImgContainer');
      const img = document.getElementById('popupImg');
      const title = document.getElementById('popupTitle');
      const desc = document.getElementById('popupDesc');
      const actionBtn = document.getElementById('popupActionBtn');

      img.src = item.image_url || 'https://via.placeholder.com/150';
      title.textContent = item.name || 'ไอเท็มพิเศษ';
      
      if (currentTab === 'background') {
        imgContainer.className = 'popup-img-container bg-preview';
        const isEquipped = currentUser.equipped_background === item.image_url;
        desc.textContent = 'ภาพพื้นหลังสำหรับแสดงผลหน้าหลัก (Lobby Background) ปรับบรรยากาศหน้าจอให้สวยงามตามสไตล์คุณ';
        actionBtn.className = `popup-btn ${isEquipped ? 'equipped' : ''}`;
        actionBtn.innerHTML = isEquipped ? '<i class="fa-solid fa-check"></i> กำลังใช้งานอยู่' : '<i class="fa-solid fa-image"></i> สวมใส่พื้นหลังนี้';
      } else {
        imgContainer.className = 'popup-img-container item-preview';
        desc.textContent = item.description || item.property || 'ไอเท็มพิเศษสำหรับใช้งานภายในเกม';
        actionBtn.className = 'popup-btn';
        
        // กำหนดปุ่มและเส้นทางนำทางตามประเภทของไอเท็ม (เช่น ตั๋วสุ่มกาชา, ไอเท็มเร่งเวลา, หรือไอเท็มนำทางเฉพาะ)
        if (item.sub_type === 'gacha_ticket' || (item.name && item.name.includes('ตั๋ว'))) {
          actionBtn.innerHTML = '<i class="fa-solid fa-ticket"></i> ไปที่หน้าสุ่มกาชา';
        } else if (item.sub_type === 'gift' || (item.name && item.name.includes('ของขวัญ'))) {
          actionBtn.innerHTML = '<i class="fa-solid fa-gift"></i> ไปมอบให้ตัวละคร (Diary)';
        } else {
          actionBtn.innerHTML = '<i class="fa-solid fa-bolt"></i> ใช้งานไอเท็มนี้';
        }
      }

      popup.classList.add('show');
    }

    window.closePopup = function() {
      document.getElementById('detailPopup').classList.remove('show');
    }

    window.executePopupAction = async function() {
      if (!selectedItem) return;

      if (currentTab === 'background') {
        try {
          const { error } = await supabase
            .from('users')
            .update({ equipped_background: selectedItem.image_url })
            .eq('id', currentUser.id);

          if (error) throw error;

          currentUser.equipped_background = selectedItem.image_url;
          sessionStorage.setItem('pocket_diary_user', JSON.stringify(currentUser));
          renderInventoryGrid();
          closePopup();
        } catch (err) {
          console.error('Error equipping background:', err);
        }
      } else {
        // ระบบนำทางตามประเภทไอเท็ม
        if (selectedItem.sub_type === 'gacha_ticket' || (selectedItem.name && selectedItem.name.includes('ตั๋ว'))) {
          window.location.href = 'gacha.html';
        } else if (selectedItem.sub_type === 'gift' || (selectedItem.name && selectedItem.name.includes('ของขวัญ'))) {
          window.location.href = 'diary.html';
        } else {
          alert(`คุณได้ใช้งาน "${selectedItem.name}" เรียบร้อยแล้ว!`);
          closePopup();
        }
      }
    }

    window.addEventListener('DOMContentLoaded', initInventory);
  </script>
</body>
</html>
