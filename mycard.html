<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POCKET DIARY - การ์ดสะสมของฉัน</title>
  
  <!-- Google Font: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-pearl: #FDFBFB;
      --bg-pearl-gradient: linear-gradient(135deg, #FFFFFF 0%, #EFECE6 100%);
      --royal-black: #111111;
      --royal-gold: #D4AF37;
      --accent-gray: #555555;
      --border-color: rgba(17, 17, 17, 0.15);
      --shadow-luxury: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--bg-pearl-gradient);
      color: var(--royal-black);
    }

    /* Top Navigation / HUD */
    .top-hud {
      position: fixed;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      color: var(--royal-black);
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-decoration: none;
      transition: background 0.2s;
    }

    .back-btn:hover {
      background: #f0efe9;
    }

    /* Main Container */
    .mycard-container {
      max-width: 800px;
      margin: 90px auto 40px auto;
      padding: 0 20px;
    }

    .page-title {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .page-title i {
      color: var(--royal-gold);
    }

    /* Profile / Summary Card */
    .profile-card {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 30px;
      box-shadow: var(--shadow-luxury);
      margin-bottom: 25px;
      text-align: center;
    }

    .profile-avatar-wrap {
      width: 100px;
      height: 100px;
      margin: 0 auto 15px auto;
      border-radius: 50%;
      overflow: hidden;
      background: #F4F3F0;
      border: 2px solid var(--royal-gold);
    }

    .profile-avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-name {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .profile-email {
      font-size: 0.9rem;
      color: var(--accent-gray);
      margin-bottom: 20px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-box {
      background: #FAFAFA;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }

    .stat-box h3 {
      font-size: 0.9rem;
      color: var(--accent-gray);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .stat-box .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--royal-black);
    }

    /* Rarity Breakdown Card */
    .rarity-card {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 25px;
      box-shadow: var(--shadow-luxury);
    }

    .rarity-card h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rarity-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .rarity-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FAFAFA;
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      font-weight: 600;
    }

    .rarity-badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #fff;
    }

    .badge-ssr { background: #ff4757; }
    .badge-sr { background: #ffa502; }
    .badge-s { background: #9b59b6; }
    .badge-a { background: #3498db; }
    .badge-b { background: #95a5a6; }

    /* Alert Popup */
    .alert-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
      display: flex; justify-content: center; align-items: center;
      z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .alert-overlay.show { opacity: 1; pointer-events: auto; }
    .alert-card {
      background: #FFF; width: 85%; max-width: 320px;
      border-radius: 20px; padding: 25px; text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }
    .btn-alert {
      width: 100%;
      padding: 12px;
      background: var(--royal-black);
      color: #FFF;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <header class="top-hud">
    <a href="home.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> หน้าหลัก
    </a>
  </header>

  <main class="mycard-container">
    <h1 class="page-title"><i class="fa-solid fa-id-card"></i> การ์ดสะสมของฉัน</h1>
    
    <!-- ข้อมูลโปรไฟล์ผู้ใช้ -->
    <div class="profile-card">
      <div class="profile-avatar-wrap">
        <img id="userAvatar" src="https://via.placeholder.com/150" alt="Avatar">
      </div>
      <div class="profile-name" id="userName">กำลังโหลด...</div>
      <div class="profile-email" id="userEmail">-</div>
    </div>

    <!-- กล่องแสดงสถิติภาพรวม -->
    <div class="stats-grid">
      <div class="stat-box">
        <h3>จำนวนตัวละครที่มี</h3>
        <div class="stat-value" id="totalCharacters">0</div>
      </div>
      <div class="stat-box">
        <h3>จำนวนสกินทั้งหมด</h3>
        <div class="stat-value" id="totalSkins">0</div>
      </div>
    </div>

    <!-- รายละเอียดจำนวนสกินแต่ละระดับ -->
    <div class="rarity-card">
      <h3><i class="fa-solid fa-layer-group" style="color: var(--royal-gold);"></i> สกินแยกตามระดับ</h3>
      <div class="rarity-list">
        <div class="rarity-item">
          <span class="rarity-badge badge-ssr">SSR</span>
          <span id="count-ssr">0</span>
        </div>
        <div class="rarity-item">
          <span class="rarity-badge badge-sr">SR</span>
          <span id="count-sr">0</span>
        </div>
        <div class="rarity-item">
          <span class="rarity-badge badge-s">S</span>
          <span id="count-s">0</span>
        </div>
        <div class="rarity-item">
          <span class="rarity-badge badge-a">A</span>
          <span id="count-a">0</span>
        </div>
        <div class="rarity-item">
          <span class="rarity-badge badge-b">B</span>
          <span id="count-b">0</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Alert Popup -->
  <div class="alert-overlay" id="alertOverlay">
    <div class="alert-card">
      <h3 id="alertTitle" style="margin-bottom: 8px;">แจ้งเตือน</h3>
      <p id="alertDesc" style="color: var(--accent-gray); margin-bottom: 10px; font-size: 0.9rem;"></p>
      <button onclick="closeAlert()" class="btn-alert">ตกลง</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://ooozqddxvxeykwubumli.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xwsBeo4TJfLSwnQUiV2uSw_7GwLZd85';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    window.showAlert = function(title, desc) {
      document.getElementById('alertTitle').textContent = title;
      document.getElementById('alertDesc').textContent = desc;
      document.getElementById('alertOverlay').classList.add('show');
    }

    window.closeAlert = function() {
      document.getElementById('alertOverlay').classList.remove('show');
    }

    async function initMyCard() {
      const savedUser = sessionStorage.getItem('pocket_diary_user');
      if (!savedUser) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = JSON.parse(savedUser);

      // แสดงข้อมูลพื้นฐานของผู้ใช้
      document.getElementById('userName').textContent = currentUser.username || currentUser.name || 'ผู้ใช้งาน';
      document.getElementById('userEmail').textContent = currentUser.email || '';
      
      if (currentUser.active_skin_full_image) {
        document.getElementById('userAvatar').src = currentUser.active_skin_full_image;
      }

      // ดึงและคำนวณสถิติตัวละครและสกินจากฐานข้อมูล
      await loadCollectionStats();
    }

    async function loadCollectionStats() {
      try {
        // ดึงข้อมูลสกินทั้งหมดที่ผู้ใช้คนนี้มี พร้อม JOIN กับตาราง character_skins
        const { data: userSkinsData, error } = await supabase
          .from('user_skins')
          .select(`
            skin_id,
            character_skins (
              id,
              character_id,
              rarity
            )
          `)
          .eq('user_id', currentUser.id);

        if (error) throw error;

        const skins = userSkinsData || [];

        // 1. คำนวณจำนวนสกินทั้งหมดที่ครอบครอง
        const totalSkins = skins.length;

        // 2. คำนวณจำนวนตัวละครที่ไม่ซ้ำกัน (Unique Characters)
        const uniqueCharacters = new Set(
          skins.map(item => item.character_skins?.character_id).filter(Boolean)
        );
        const totalCharacters = uniqueCharacters.size;

        // 3. คำนวณจำนวนสกินแยกตามระดับ (SSR, SR, S, A, B)
        const rarityCounts = { SSR: 0, SR: 0, S: 0, A: 0, B: 0 };
        skins.forEach(item => {
          const rarity = item.character_skins?.rarity;
          if (rarity && rarityCounts[rarity] !== undefined) {
            rarityCounts[rarity]++;
          }
        });

        // 4. นำค่าไปแสดงผลลงใน HTML
        document.getElementById('totalCharacters').textContent = totalCharacters;
        document.getElementById('totalSkins').textContent = totalSkins;

        Object.keys(rarityCounts).forEach(rarity => {
          const el = document.getElementById(`count-${rarity.toLowerCase()}`);
          if (el) {
            el.textContent = rarityCounts[rarity];
          }
        });

      } catch (err) {
        console.error('ไม่สามารถโหลดสถิติตัวละครได้:', err);
        showAlert('เกิดข้อผิดพลาด', 'ไม่สามารถโหลดข้อมูลสถิติตัวละครได้ กรุณาลองใหม่อีกครั้ง');
      }
    }

    window.addEventListener('DOMContentLoaded', initMyCard);
  </script>
</body>
</html>
