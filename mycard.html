<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POCKET DIARY - นามบัตร</title>
  
  <!-- Google Font: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-pearl: #FDFBFB;
      --bg-pearl-gradient: linear-gradient(135deg, #FFFFFF 0%, #EFECE6 100%);
      --royal-black: #111111;
      --royal-gold: #D4AF37;
      --accent-gray: #555555;
      --border-color: rgba(17, 17, 17, 0.15);
      --shadow-luxury: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--bg-pearl-gradient);
      color: var(--royal-black);
    }

    /* Top Navigation / HUD */
    .top-hud {
      position: fixed;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      z-index: 100;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      color: var(--royal-black);
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-decoration: none;
      transition: background 0.2s;
    }

    .back-btn:hover {
      background: #f0efe9;
    }

    /* Main Container */
    .mycard-container {
      max-width: 800px;
      margin: 80px auto 40px auto;
      padding: 0 20px;
    }

    .page-title {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .page-title i {
      color: var(--royal-gold);
    }

    /* Profile / Summary Card */
    .profile-card {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 25px;
      box-shadow: var(--shadow-luxury);
      margin-bottom: 20px;
      text-align: center;
    }

    .profile-avatar-wrap {
      width: 90px;
      height: 90px;
      margin: 0 auto 12px auto;
      border-radius: 50%;
      overflow: hidden;
      background: #F4F3F0;
      border: 2px solid var(--royal-gold);
      position: relative;
      cursor: pointer;
    }

    .profile-avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-avatar-wrap::after {
      content: '\f030';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 0;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .profile-avatar-wrap:hover::after {
      opacity: 1;
    }

    /* จัดเรียง ชื่อ และ Username */
    .profile-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--royal-black);
      margin-bottom: 2px;
    }

    .profile-username {
      font-size: 0.9rem;
      color: var(--accent-gray);
      font-weight: 400;
      margin-bottom: 5px;
    }

    /* Stats Grid (ลดขนาดกรอบลงให้กะทัดรัดขึ้น) */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: #FAFAFA;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
    }

    .stat-box h3 {
      font-size: 0.8rem;
      color: var(--accent-gray);
      margin-bottom: 4px;
      font-weight: 500;
    }

    .stat-box .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--royal-black);
    }

    /* Rarity Breakdown Card */
    .rarity-card {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow-luxury);
    }

    .rarity-card h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rarity-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rarity-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FAFAFA;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .rarity-badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #fff;
    }

    .badge-ssr { background: #ff4757; }
    .badge-sr { background: #ffa502; }
    .badge-s { background: #9b59b6; }
    .badge-a { background: #3498db; }
    .badge-b { background: #95a5a6; }

    /* Alert Popup */
    .alert-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
      display: flex; justify-content: center; align-items: center;
      z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .alert-overlay.show { opacity: 1; pointer-events: auto; }
    .alert-card {
      background: #FFF; width: 85%; max-width: 320px;
      border-radius: 20px; padding: 25px; text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }
    .btn-alert {
      width: 100%;
      padding: 12px;
      background: var(--royal-black);
      color: #FFF;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <header class="top-hud">
    <a href="home.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> ย้อนกลับ
    </a>
  </header>

  <main class="mycard-container">
    <h1 class="page-title"><i class="fa-solid fa-id-card"></i> นามบัตร</h1>
    
    <!-- ข้อมูลโปรไฟล์ผู้ใช้ -->
    <div class="profile-card">
      <div class="profile-avatar-wrap" id="avatarUploadWrap" title="คลิกเพื่อเปลี่ยนรูปโปรไฟล์">
        <img id="userAvatar" src="https://via.placeholder.com/150" alt="Avatar">
      </div>
      <!-- ซ่อน input สำหรับเลือกรูปจากแกลเลอรี -->
      <input type="file" id="fileInput" accept="image/*" style="display: none;">

      <!-- ชื่ออยู่บรรทัดบน / Username อยู่บรรทัดล่าง -->
      <div class="profile-name" id="userName">กำลังโหลด...</div>
      <div class="profile-username" id="userUsername">-</div>
    </div>

    <!-- กล่องแสดงสถิติภาพรวม (ขนาดกะทัดรัดขึ้น) -->
    <div class="stats-grid">
      <div class="stat-box">
        <h3>จำนวนตัวละครที่มี</h3>
        <div class="stat-value" id="totalCharacters">0</div>
      </div>
      <div class="stat-box">
        <h3>จำนวนสกินทั้งหมด</h3>
        <div class="stat-value" id="totalSkins">0</div>
      </div>
    </div>

    <!-- รายละเอียดจำนวนสกินแต่ละระดับ -->
    <div class="rarity-card">
      <h3><i class="fa-solid fa-layer-group" style="color: var(--royal-gold);"></i> สกินแยกตามระดับ</h3>
      <div class="rarity-list">
        <div class="rarity-item">
          <span class="rarity-badge badge-ssr">SSR</span>
          <span id="count-ssr">0</span>
        </div>
        <div class="rarity-item">
          <span class="rarity-badge badge-sr">SR</span>
          <span id="count-sr">0</span>
        </div>
        <div class="rarity-item">
          <span class="rarity-badge badge-s">S</span>
          <span id="count-s">0</span>
        </div>
        <div class="rarity-item">
          <span class="rarity-badge badge-a">A</span>
          <span id="count-a">0</span>
        </div>
        <div class="rarity-item">
          <span class="rarity-badge badge-b">B</span>
          <span id="count-b">0</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Alert Popup -->
  <div class="alert-overlay" id="alertOverlay">
    <div class="alert-card">
      <h3 id="alertTitle" style="margin-bottom: 8px;">แจ้งเตือน</h3>
      <p id="alertDesc" style="color: var(--accent-gray); margin-bottom: 10px; font-size: 0.9rem;"></p>
      <button onclick="closeAlert()" class="btn-alert">ตกลง</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://ooozqddxvxeykwubumli.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xwsBeo4TJfLSwnQUiV2uSw_7GwLZd85';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ค่า Cloudinary ของคุณ (ปรับเปลี่ยนได้ตามที่ใช้งานจริง)
    const CLOUDINARY_UPLOAD_PRESET = 'pocket_diary_preset'; // ใส่ Preset ของคุณ
    const CLOUDINARY_CLOUD_NAME = 'd...'; // ใส่ Cloud Name ของคุณ

    let currentUser = null;

    window.showAlert = function(title, desc) {
      document.getElementById('alertTitle').textContent = title;
      document.getElementById('alertDesc').textContent = desc;
      document.getElementById('alertOverlay').classList.add('show');
    }

    window.closeAlert = function() {
      document.getElementById('alertOverlay').classList.remove('show');
    }

    async function initMyCard() {
      const savedUser = sessionStorage.getItem('pocket_diary_user');
      if (!savedUser) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = JSON.parse(savedUser);

      // แสดงชื่อ (Name) ไว้บรรทัดบน / Username ไว้บรรทัดล่าง
      document.getElementById('userName').textContent = currentUser.name || currentUser.username || 'ผู้ใช้งาน';
      document.getElementById('userUsername').textContent = `@${currentUser.username || 'username'}`;
      
      if (currentUser.active_skin_full_image) {
        document.getElementById('userAvatar').src = currentUser.active_skin_full_image;
      }

      // ผูกอีเวนต์คลิกเปลี่ยนรูปโปรไฟล์ผ่านแกลเลอรี
      setupAvatarUpload();

      // โหลดสถิติตัวละครและสกิน
      await loadCollectionStatsSafe();
    }

    // ฟังก์ชันอัปโหลดรูปภาพผ่าน Cloudinary และบันทึกลง Supabase แบบถาวร
    function setupAvatarUpload() {
      const wrap = document.getElementById('avatarUploadWrap');
      const fileInput = document.getElementById('fileInput');

      wrap.onclick = () => fileInput.click();

      fileInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        showAlert('กำลังอัปโหลด', 'กรุณารอสักครู่ กำลังอัปโหลดรูปภาพโปรไฟล์...');

        try {
          const formData = new FormData();
          formData.append('file', file);
          formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

          const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
            method: 'POST',
            body: formData
          });

          const data = await res.json();
          if (!data.secure_url) throw new Error('อัปโหลดไป Cloudinary ไม่สำเร็จ');

          const newImageUrl = data.secure_url;

          // อัปเดตลงตาราง users ในฐานข้อมูล Supabase เพื่อให้ข้อมูลคงอยู่ถาวรและคนอื่นมองเห็น
          const { error: updateErr } = await supabase
            .from('users')
            .update({ active_skin_full_image: newImageUrl })
            .eq('id', currentUser.id);

          if (updateErr) throw updateErr;

          // อัปเดตค่าใน SessionStorage
          currentUser.active_skin_full_image = newImageUrl;
          sessionStorage.setItem('pocket_diary_user', JSON.stringify(currentUser));

          // แสดงผลบนหน้าจอทันที
          document.getElementById('userAvatar').src = newImageUrl;
          showAlert('สำเร็จ', 'อัปเดตและบันทึกรูปโปรไฟล์เรียบร้อยแล้ว!');

        } catch (err) {
          console.error(err);
          showAlert('เกิดข้อผิดพลาด', 'ไม่สามารถอัปโหลดรูปภาพได้ กรุณาลองใหม่อีกครั้ง');
        }
      };
    }

    // ดึงข้อมูลสถิติตัวละครและสกิน
    async function loadCollectionStatsSafe() {
      try {
        const { data: userSkins, error: userSkinsErr } = await supabase
          .from('user_skins')
          .select('skin_id')
          .eq('user_id', currentUser.id);

        if (userSkinsErr) throw userSkinsErr;
        if (!userSkins || userSkins.length === 0) return;

        const skinIds = userSkins.map(item => item.skin_id);

        const { data: skinDetails, error: skinDetailsErr } = await supabase
          .from('character_skins')
          .select('id, character_id, rarity')
          .in('id', skinIds);

        if (skinDetailsErr) throw skinDetailsErr;

        const skins = skinDetails || [];
        const totalSkins = skins.length;

        const uniqueCharacters = new Set(
          skins.map(item => item.character_id).filter(Boolean)
        );
        const totalCharacters = uniqueCharacters.size;

        const rarityCounts = { SSR: 0, SR: 0, S: 0, A: 0, B: 0 };
        skins.forEach(item => {
          const rarity = item.rarity;
          if (rarity && rarityCounts[rarity] !== undefined) {
            rarityCounts[rarity]++;
          }
        });

        document.getElementById('totalCharacters').textContent = totalCharacters;
        document.getElementById('totalSkins').textContent = totalSkins;

        Object.keys(rarityCounts).forEach(rarity => {
          const el = document.getElementById(`count-${rarity.toLowerCase()}`);
          if (el) {
            el.textContent = rarityCounts[rarity];
          }
        });

      } catch (err) {
        console.error('ไม่สามารถโหลดสถิติตัวละครได้:', err);
      }
    }

    window.addEventListener('DOMContentLoaded', initMyCard);
  </script>
</body>
</html>
