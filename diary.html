<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POCKET DIARY - ไดอารี่ตัวละคร</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fbfbfb;
            color: #1a1a1a;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            overscroll-behavior-y: auto;
            touch-action: pan-y;
        }
        .royal-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .royal-btn {
            background: #111111;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .royal-btn:hover {
            background: #2d2d2d;
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex flex-col justify-between select-none pb-8">

    <!-- Header -->
    <div class="relative z-20 p-4 max-w-lg mx-auto w-full flex flex-col gap-3">
        <div class="flex items-center justify-between">
            <button onclick="window.location.href='home.html'" class="royal-card px-4 py-2 rounded-2xl text-xs font-semibold flex items-center gap-2 cursor-pointer shadow-sm">
                <span>←</span> กลับหน้าหลัก
            </button>
            <h1 class="font-bold text-base text-neutral-900 flex items-center gap-2">
                <span>📖</span> ไดอารี่ตัวละคร
            </h1>
            <div class="w-20"></div>
        </div>

        <!-- ช่องค้นหาและตัวกรองระดับแรงค์ (B, A, S, SR, SSR) -->
        <div class="flex gap-2">
            <input type="text" id="search-input" placeholder="ค้นหาชื่อตัวละคร..." oninput="filterCharacters()" class="flex-1 bg-white border border-neutral-200 rounded-2xl px-4 py-2.5 text-xs font-bold text-neutral-900 focus:outline-none focus:border-neutral-900 shadow-sm">
            <select id="rank-filter" onchange="filterCharacters()" class="bg-white border border-neutral-200 rounded-2xl px-3 py-2.5 text-xs font-bold text-neutral-900 focus:outline-none focus:border-neutral-900 shadow-sm">
                <option value="ALL">ทุกระดับ</option>
                <option value="B">B</option>
                <option value="A">A</option>
                <option value="S">S</option>
                <option value="SR">SR</option>
                <option value="SSR">SSR</option>
            </select>
        </div>
    </div>

    <!-- Main Content Grid -->
    <div class="relative z-10 flex-1 max-w-lg mx-auto w-full p-4">
        <div id="character-grid" class="grid grid-cols-2 gap-3">
            <!-- รายการตัวละครในไดอารี่จะถูกเรนเดอร์ที่นี่ -->
        </div>
    </div>

    <!-- Popup รายละเอียดตัวละคร (แสดงข้อมูล, สกิน, และเรื่องราว) -->
    <div id="character-detail-popup" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden" style="background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);">
        <div class="royal-card w-full max-w-md rounded-3xl p-6 relative flex flex-col shadow-2xl max-h-[85vh] overflow-y-auto space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-neutral-100">
                <div class="flex items-center gap-2">
                    <span id="popup-char-rank" class="px-2.5 py-0.5 bg-neutral-900 text-white rounded-full text-[10px] font-bold">SSR</span>
                    <h3 id="popup-char-name" class="font-bold text-sm text-neutral-900">ชื่อตัวละคร</h3>
                </div>
                <button onclick="closeCharacterPopup()" class="text-xs font-bold text-neutral-400 hover:text-neutral-900">✕ ปิด</button>
            </div>

            <!-- รูปภาพเต็มตัวละคร -->
            <div class="w-full aspect-[3/4] bg-neutral-100 rounded-2xl overflow-hidden border border-neutral-200 shadow-inner relative">
                <img id="popup-char-img" src="" class="w-full h-full object-cover">
            </div>

            <!-- รายละเอียด / เรื่องราว / บันทึกความทรงจำ -->
            <div class="space-y-2">
                <h4 class="font-bold text-xs text-neutral-900">📝 บันทึกเรื่องราว (Diary Note)</h4>
                <div id="popup-char-story" class="bg-neutral-50 p-3 rounded-2xl border border-neutral-200 text-xs text-neutral-600 leading-relaxed min-h-[80px]">
                    ยังไม่มีบันทึกเรื่องราวสำหรับตัวละครนี้...
                </div>
            </div>

            <!-- แถบเลือกสกินอื่นๆ ของตัวละครนี้ (ถ้ามีหลายสกิน) -->
            <div class="space-y-2">
                <h4 class="font-bold text-xs text-neutral-900">✨ สกินทั้งหมดที่ปลดล็อกแล้ว</h4>
                <div id="popup-character-skins-row" class="flex gap-2 overflow-x-auto pb-1">
                    <!-- รายการสกินอื่นๆ จะแสดงตรงนี้ -->
                </div>
            </div>
        </div>
    </div>

    <!-- Popup แจ้งเตือนทั่วไป -->
    <div id="alert-popup" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden" style="background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);">
        <div class="royal-card w-full max-w-xs rounded-3xl p-6 relative flex flex-col items-center shadow-2xl text-center space-y-3">
            <div id="alert-icon" class="text-3xl mb-1">✨</div>
            <h3 id="alert-title" class="font-bold text-sm text-neutral-900">แจ้งเตือน</h3>
            <p id="alert-message" class="text-xs text-neutral-600">ข้อความแจ้งเตือน</p>
            <button onclick="closeAlertPopup()" class="w-full py-2 rounded-xl text-xs font-bold royal-btn cursor-pointer mt-2">ตกลง</button>
        </div>
    </div>

    <!-- Supabase & Config Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        let currentUserId = null;
        let allUserCharacters = [];

        async function initDiary() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            currentUserId = session.user.id;
            await loadUserCharacters();
        }

        async function loadUserCharacters() {
            const { data: chars, error } = await supabase
                .from('user_characters')
                .select('*')
                .eq('user_id', currentUserId);

            if (chars) {
                allUserCharacters = chars;
                renderCharacterGrid(chars);
            }
        }

        function renderCharacterGrid(characters) {
            const grid = document.getElementById('character-grid');
            grid.innerHTML = '';

            if (characters.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-center text-xs text-neutral-400 py-12">ยังไม่มีตัวละครในไดอารี่ สามารถสุ่มรับได้จากตู้กาชา</div>';
                return;
            }

            // จัดกลุ่มตัวละครที่ไม่ซ้ำชื่อ (หรือแสดงทุกสกินที่สะสมมา)
            characters.forEach(char => {
                const div = document.createElement('div');
                div.className = 'royal-card p-3 rounded-2xl flex flex-col items-center space-y-2 cursor-pointer shadow-md hover:shadow-lg transition-all';
                div.onclick = () => openCharacterDetail(char);
                div.innerHTML = `
                    <div class="w-full aspect-[3/4] bg-neutral-100 rounded-xl overflow-hidden border border-neutral-200 relative">
                        <img src="${char.image_url || char.full_image_url}" class="w-full h-full object-cover">
                        <span class="absolute top-2 right-2 bg-black/70 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">${char.skin_rank || 'B'}</span>
                    </div>
                    <div class="w-full text-center">
                        <div class="font-bold text-xs text-neutral-900 truncate">${char.character_name}</div>
                        <div class="text-[10px] text-neutral-500 mt-0.5">แรงค์ ${char.skin_rank || 'B'}</div>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function filterCharacters() {
            const keyword = document.getElementById('search-input').value.toLowerCase();
            const selectedRank = document.getElementById('rank-filter').value;

            const filtered = allUserCharacters.filter(char => {
                const matchName = char.character_name.toLowerCase().includes(keyword);
                const matchRank = selectedRank === 'ALL' || (char.skin_rank || 'B').toUpperCase() === selectedRank;
                return matchName && matchRank;
            });

            renderCharacterGrid(filtered);
        }

        function openCharacterDetail(char) {
            document.getElementById('popup-char-name').innerText = char.character_name;
            document.getElementById('popup-char-rank').innerText = char.skin_rank || 'B';
            document.getElementById('popup-char-img').src = char.full_image_url || char.image_url;
            document.getElementById('popup-char-story').innerText = char.story || 'ยังไม่มีบันทึกเรื่องราวพิเศษสำหรับสกินนี้...';

            // ค้นหาสกินอื่นๆ ของตัวละครชื่อเดียวกันที่ผู้ใช้มี
            const sameCharSkins = allUserCharacters.filter(c => c.character_name === char.character_name);
            const skinsRow = document.getElementById('popup-character-skins-row');
            skinsRow.innerHTML = '';

            sameCharSkins.forEach(s => {
                const thumb = document.createElement('div');
                thumb.className = `w-14 h-14 rounded-xl overflow-hidden border-2 cursor-pointer shrink-0 ${s.id === char.id ? 'border-neutral-900' : 'border-neutral-200'}`;
                thumb.innerHTML = `<img src="${s.image_url || s.full_image_url}" class="w-full h-full object-cover">`;
                thumb.onclick = () => openCharacterDetail(s);
                skinsRow.appendChild(thumb);
            });

            document.getElementById('character-detail-popup').classList.remove('hidden');
        }

        function closeCharacterPopup() {
            document.getElementById('character-detail-popup').classList.add('hidden');
        }

        function showAlert(title, message, icon = '✨') {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            document.getElementById('alert-icon').innerText = icon;
            document.getElementById('alert-popup').classList.remove('hidden');
        }

        function closeAlertPopup() {
            document.getElementById('alert-popup').classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', initDiary);
    </script>
</body>
</html>
