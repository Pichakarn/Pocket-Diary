<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POCKET DIARY - ไดอารี่</title>
  
  <!-- Google Font: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-pearl: #FDFBFB;
      --bg-pearl-gradient: linear-gradient(135deg, #FFFFFF 0%, #EFECE6 100%);
      --royal-black: #111111;
      --royal-gold: #D4AF37;
      --accent-gray: #555555;
      --border-color: rgba(17, 17, 17, 0.15);
      --shadow-luxury: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--bg-pearl-gradient);
      color: var(--royal-black);
    }

    /* Top Navigation / HUD */
    .top-hud {
      position: fixed;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      color: var(--royal-black);
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-decoration: none;
      transition: background 0.2s;
    }

    .back-btn:hover {
      background: #f0efe9;
    }

    /* Main Container */
    .diary-container {
      max-width: 1200px;
      margin: 80px auto 40px auto;
      padding: 0 20px;
    }

    .page-title {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .page-title i {
      color: var(--royal-gold);
    }

    /* Character Grid */
    .character-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
    }

    .char-card {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 15px;
      text-align: center;
      box-shadow: var(--shadow-luxury);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .char-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    }

    .char-img-wrap {
      width: 100%;
      height: 180px;
      border-radius: 14px;
      overflow: hidden;
      background: #F4F3F0;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .char-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: filter 0.3s ease;
    }

    /* ถ้าไม่มีตัวละคร ให้เป็นสีขาวดำ */
    .char-card.locked .char-img-wrap img {
      filter: grayscale(100%) brightness(80%);
      opacity: 0.6;
    }

    .char-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--royal-black);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .char-card.locked .char-name {
      color: var(--accent-gray);
    }

    /* Book Popup Overlay (ขนาดเท่ากันทุกตัวละคร) */
    .popup-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .popup-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* ตัวหนังสือสมุด (Book Modal) ขนาดฟิกตายตัวมาตรฐาน */
    .book-modal {
      width: 90vw;
      max-width: 850px;
      height: 80vh;
      max-height: 550px;
      background: #FDFBFB;
      border: 2px solid var(--royal-black);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      display: flex;
      position: relative;
      overflow: hidden;
      transform: scale(0.95);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .popup-overlay.show .book-modal {
      transform: scale(1);
    }

    .close-book-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      background: var(--royal-black);
      color: #FFF;
      border: none;
      width: 36px; height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      z-index: 10;
      transition: background 0.2s;
    }
    .close-book-btn:hover {
      background: var(--royal-gold);
    }

    /* หน้าหนังสือซ้าย-ขวา */
    .book-page-left, .book-page-right {
      flex: 1;
      padding: 35px 30px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .book-page-left {
      border-right: 1.5px dashed var(--border-color);
      background: #FFFFFF;
      align-items: center;
      justify-content: flex-start;
    }

    .book-page-right {
      background: #FAFAFA;
    }

    /* หน้าซ้าย: รูปตัวละคร/สกิน และลิสต์สกินย่อยเรียงตามระดับ B -> SSR */
    .current-skin-display {
      width: 100%;
      height: 260px;
      border-radius: 16px;
      overflow: hidden;
      background: #F4F3F0;
      border: 1px solid var(--border-color);
      cursor: pointer;
      position: relative;
      margin-bottom: 20px;
    }

    .current-skin-display img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .skin-selector-list {
      width: 100%;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .skin-thumb {
      min-width: 55px;
      height: 55px;
      border-radius: 10px;
      border: 2px solid var(--border-color);
      overflow: hidden;
      cursor: pointer;
      background: #FFF;
      transition: all 0.2s;
    }

    .skin-thumb.active {
      border-color: var(--royal-gold);
      transform: scale(1.05);
    }

    .skin-thumb img {
      width: 100%; height: 100%; object-fit: cover;
    }

    /* หน้าขวา: ข้อมูลตัวละคร & แท็บการ์ด */
    .char-info-header {
      margin-bottom: 20px;
    }

    .char-info-header h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--royal-black);
    }

    .char-info-header p {
      font-size: 0.9rem;
      color: var(--accent-gray);
      margin-top: 4px;
    }

    .info-cards-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .info-card-item {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      padding: 14px 18px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .info-card-item:hover {
      border-color: var(--royal-black);
      background: #FFF;
      transform: translateX(3px);
    }

    .info-card-item.locked-action {
      opacity: 0.5;
      cursor: not-allowed;
      background: #F4F3F0;
    }

    /* Sub-Popup สำหรับดูสกินแบบเต็มตัว หรือดูเนื้อเรื่อง/ภูมิหลัง/ความสัมพันธ์ */
    .sub-popup-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1050;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .sub-popup-overlay.show {
      opacity: 1; pointer-events: auto;
    }
    .sub-popup-card {
      background: #FFFFFF;
      width: 85%; max-width: 400px;
      max-height: 80vh;
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .sub-popup-body {
      overflow-y: auto;
      max-height: 60vh;
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--accent-gray);
      line-height: 1.6;
    }

    .full-skin-img {
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      border-radius: 12px;
      background: #F4F3F0;
      margin-bottom: 15px;
    }

    .btn-equip {
      width: 100%;
      padding: 12px;
      background: var(--royal-black);
      color: #FFF;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-equip:hover {
      background: var(--royal-gold);
    }

    /* General Popup แจ้งเตือน */
    .alert-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
      display: flex; justify-content: center; align-items: center;
      z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .alert-overlay.show { opacity: 1; pointer-events: auto; }
    .alert-card {
      background: #FFF; width: 85%; max-width: 320px;
      border-radius: 20px; padding: 25px; text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <header class="top-hud">
    <a href="home.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> หน้าหลัก
    </a>
  </header>

  <main class="diary-container">
    <h1 class="page-title"><i class="fa-solid fa-book"></i> ไดอารี่ตัวละคร</h1>
    <div class="character-grid" id="characterGrid">
      <!-- ตัวละครจะถูกโหลดผ่าน JS แบบ Realtime -->
    </div>
  </main>

  <!-- สมุดข้อมูลตัวละคร (Book Modal) -->
  <div class="popup-overlay" id="bookPopup">
    <div class="book-modal">
      <button class="close-book-btn" onclick="closeBook()"><i class="fa-solid fa-xmark"></i></button>
      
      <!-- หน้าซ้าย: รูปสกิน และเลือกสกิน -->
      <div class="book-page-left">
        <div class="current-skin-display" id="currentSkinDisplay" onclick="openFullSkinModal()">
          <img id="bookCharImg" src="" alt="Character Skin">
        </div>
        <div class="skin-selector-list" id="skinSelectorList">
          <!-- รายการสกินย่อย -->
        </div>
      </div>

      <!-- หน้าขวา: ข้อมูล และการ์ดเนื้อเรื่อง/ภูมิหลัง/ความสัมพันธ์ -->
      <div class="book-page-right">
        <div class="info-cards-container" id="infoCardsContainer">
          <!-- แท็บข้อมูล -->
        </div>
      </div>
    </div>
  </div>

  <!-- Sub Popup สำหรับดูสกินเต็มตัว & สวมใส่ -->
  <div class="sub-popup-overlay" id="fullSkinModal">
    <div class="sub-popup-card">
      <h3 id="fullSkinTitle" style="margin-bottom: 10px; font-size: 1.1rem;">ดูสกินตัวละคร</h3>
      <img id="fullSkinImg" src="" alt="Full Skin" class="full-skin-img">
      <button class="btn-equip" id="equipBtn" onclick="equipCurrentSkin()">สวมใส่สกินนี้</button>
      <button onclick="closeFullSkinModal()" style="background: transparent; border: none; margin-top: 10px; color: var(--accent-gray); cursor: pointer; font-size: 0.85rem;">ปิด</button>
    </div>
  </div>

  <!-- Sub Popup สำหรับแสดงเนื้อเรื่อง / ภูมิหลัง / ความสัมพันธ์ -->
  <div class="sub-popup-overlay" id="contentModal">
    <div class="sub-popup-card">
      <h3 id="contentTitle" style="margin-bottom: 10px; font-size: 1.1rem;">หัวข้อ</h3>
      <div class="sub-popup-body" id="contentText">เนื้อหา...</div>
      <button onclick="closeContentModal()" class="btn-equip" style="margin-top: 15px;">ปิด</button>
    </div>
  </div>

  <!-- Alert Popup -->
  <div class="alert-overlay" id="alertOverlay">
    <div class="alert-card">
      <h3 id="alertTitle" style="margin-bottom: 8px;">แจ้งเตือน</h3>
      <p id="alertDesc" style="color: var(--accent-gray); margin-bottom: 20px; font-size: 0.9rem;"></p>
      <button onclick="closeAlert()" class="btn-equip">ตกลง</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://ooozqddxvxeykwubumli.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xwsBeo4TJfLSwnQUiV2uSw_7GwLZd85';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let allCharacters = [];
    let userInventorySkins = []; // รายการสกิน/ตัวละครที่ผู้ใช้ครอบครอง
    let selectedCharacterData = null;
    let selectedSkinData = null;

    const rankOrder = { 'B': 1, 'A': 2, 'S': 3, 'SR': 4, 'SSR': 5 };

    window.showAlert = function(title, desc) {
      document.getElementById('alertTitle').textContent = title;
      document.getElementById('alertDesc').textContent = desc;
      document.getElementById('alertOverlay').classList.add('show');
    }

    window.closeAlert = function() {
      document.getElementById('alertOverlay').classList.remove('show');
    }

    async function initDiary() {
      const savedUser = sessionStorage.getItem('pocket_diary_user');
      if (!savedUser) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = JSON.parse(savedUser);

      await fetchCharactersAndUserSkins();
    }

    async function fetchCharactersAndUserSkins() {
      try {
        // ดึงข้อมูลตัวละครทั้งหมดจาก Admin/Database
        const { data: chars, error: charErr } = await supabase.from('characters').select('*');
        if (charErr) throw charErr;
        allCharacters = chars || [];

        // ดึงข้อมูลสกิน/ตัวละครที่ผู้ใช้มี (จากตู้กาชา ร้านค้า หรือสกินเริ่มต้น)
        // สมมติเก็บไว้ในตาราง user_skins หรือเช็คจากสิทธิ์ที่ครอบครอง
        const { data: userSkins, error: skinErr } = await supabase
          .from('user_skins')
          .select('skin_id')
          .eq('user_id', currentUser.id);

        if (!skinErr && userSkins) {
          userInventorySkins = userSkins.map(s => s.skin_id);
        }

        renderCharacterGrid();
      } catch (err) {
        console.warn('โหลดข้อมูลตัวละครไม่สำเร็จ:', err);
        // Fallback ข้อมูลตัวอย่างหากยังไม่ได้สร้างตารางใน Supabase
        allCharacters = [];
        renderCharacterGrid();
      }
    }

    function renderCharacterGrid() {
      const grid = document.getElementById('characterGrid');
      grid.innerHTML = '';

      if (allCharacters.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--accent-gray); padding: 40px;">ยังไม่มีตัวละครในระบบ (สามารถเพิ่มได้ผ่านแอป Admin)</p>`;
        return;
      }

      allCharacters.forEach(char => {
        // เช็คว่าผู้มีตัวละครนี้หรือไม่ (เช่น มีสกินเริ่มต้นหรือสกินใดๆ ของตัวละครนี้)
        const hasChar = userInventorySkins.includes(char.default_skin_id) || char.is_free; 

        const card = document.createElement('div');
        card.className = `char-card ${hasChar ? '' : 'locked'}`;
        card.onclick = () => openBookModal(char, hasChar);

        card.innerHTML = `
          <div class="char-img-wrap">
            <img src="${char.default_image || 'https://via.placeholder.com/150'}" alt="${char.name}">
          </div>
          <div class="char-name">${char.name}</div>
        `;
        grid.appendChild(card);
      });
    }

    window.openBookModal = function(char, hasChar) {
      selectedCharacterData = char;
      
      if (!hasChar) {
        showAlert('ยังไม่ได้รับตัวละคร', 'คุณยังไม่มีตัวละครนี้ในครอบครอง จะไม่สามารถเปิดอ่านเนื้อเรื่องหรือข้อมูลได้ จนกว่าจะได้รับตัวละครจากกาชาหรือร้านค้า');
        return;
      }

      // ตั้งค่าหน้าซ้ายและขวาของหนังสือ
      document.getElementById('bookCharImg').src = char.default_image;
      
      // เรียงลำดับสกินของตัวละครนี้จากระดับสูงไปต่ำ (SSR, SR, S, A, B)
      // สมมติ char.skins เป็น Array ของสกินทั้งหมดที่มีของตัวละครนี้
      const skins = char.skins || [{ id: char.default_image, full_image: char.full_image, rank: 'B' }];
      skins.sort((a, b) => (rankOrder[b.rank] || 0) - (rankOrder[a.rank] || 0));

      selectedSkinData = skins[0]; // เริ่มต้นเลือกสกินแรกสุด
      document.getElementById('bookCharImg').src = selectedSkinData.image;

      const skinListEl = document.getElementById('skinSelectorList');
      skinListEl.innerHTML = '';

      skins.forEach((skin, idx) => {
        // เช็คเงื่อนไข: ถ้าเพื่อนมีแต่เราไม่มี และหาไม่ได้แล้ว จะไม่แสดง (อิงจาก userInventorySkins)
        const hasThisSkin = userInventorySkins.includes(skin.id) || idx === 0; 
        if (!hasThisSkin) return; // ถ้าไม่มีและไม่อยู่ในเงื่อนไขการครอบครอง ข้ามไป

        const thumb = document.createElement('div');
        thumb.className = `skin-thumb ${idx === 0 ? 'active' : ''}`;
        thumb.innerHTML = `<img src="${skin.image}" alt="Skin">`;
        thumb.onclick = (e) => {
          e.stopPropagation();
          document.querySelectorAll('.skin-thumb').forEach(t => t.classList.remove('active'));
          thumb.classList.add('active');
          selectedSkinData = skin;
          document.getElementById('bookCharImg').src = skin.image;
        };
        skinListEl.appendChild(thumb);
      });

      // สร้างหัวข้อการ์ดด้านขวา
      const infoContainer = document.getElementById('infoCardsContainer');
      infoContainer.innerHTML = `
        <div class="char-info-header">
          <h2>${char.name}</h2>
          <p>อายุ: ${char.age || '-'} | ส่วนสูง: ${char.height || '-'} ซม.</p>
          <p>อาชีพ: ${char.occupation || '-'}</p>
        </div>
        <div class="info-card-item" onclick="openContent('story', \`${char.story || 'ไม่มีเนื้อเรื่อง'}\`)">
          <span>1. เนื้อเรื่องตัวละคร</span> <i class="fa-solid fa-chevron-right"></i>
        </div>
        <div class="info-card-item" onclick="openContent('background', \`${char.background || 'ไม่มีข้อมูลภูมิหลัง'}\`)">
          <span>2. ภูมิหลัง</span> <i class="fa-solid fa-chevron-right"></i>
        </div>
        <div class="info-card-item" onclick="openContent('relationship', \`${char.relationship || 'ไม่มีข้อมูลความสัมพันธ์'}\`)">
          <span>3. ความสัมพันธ์</span> <i class="fa-solid fa-chevron-right"></i>
        </div>
      `;

      document.getElementById('bookPopup').classList.add('show');
    }

    window.closeBook = function() {
      document.getElementById('bookPopup').classList.remove('show');
    }

    window.openFullSkinModal = function() {
      if (!selectedSkinData) return;
      document.getElementById('fullSkinTitle').textContent = `สกิน: ${selectedCharacterData.name} (${selectedSkinData.rank || 'B'})`;
      document.getElementById('fullSkinImg').src = selectedSkinData.full_image || selectedSkinData.image;
      document.getElementById('fullSkinModal').classList.add('show');
    }

    window.closeFullSkinModal = function() {
      document.getElementById('fullSkinModal').classList.remove('show');
    }

    window.equipCurrentSkin = async function() {
      if (!selectedSkinData) return;

      try {
        currentUser.active_skin_full_image = selectedSkinData.full_image || selectedSkinData.image;
        currentUser.active_background_image = currentUser.active_background_image || '';

        // อัปเดตข้อมูลลง Supabase
        const { error } = await supabase
          .from('users')
          .update({
            active_skin_full_image: currentUser.active_skin_full_image
          })
          .eq('id', currentUser.id);

        if (error) throw error;

        sessionStorage.setItem('pocket_diary_user', JSON.stringify(currentUser));
        closeFullSkinModal();
        closeBook();
        showAlert('สวมใส่สำเร็จ', 'เปลี่ยนสกินสำหรับแสดงหน้าล็อบบี้เรียบร้อยแล้วครับ!');
      } catch (err) {
        showAlert('เกิดข้อผิดพลาด', 'ไม่สามารถบันทึกการสวมใส่ได้ กรุณาลองใหม่');
      }
    }

    window.openContent = function(type, text) {
      const titles = {
        'story': 'เนื้อเรื่องตัวละคร',
        'background': 'ภูมิหลังตัวละคร',
        'relationship': 'ความสัมพันธ์ตัวละคร'
      };
      document.getElementById('contentTitle').textContent = titles[type] || 'ข้อมูล';
      document.getElementById('contentText').textContent = text;
      document.getElementById('contentModal').classList.add('show');
    }

    window.closeContentModal = function() {
      document.getElementById('contentModal').classList.remove('show');
    }

    window.addEventListener('DOMContentLoaded', initDiary);
  </script>
</body>
</html>
