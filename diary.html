<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POCKET DIARY - ไดอารี่ตัวละคร</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fbfbfb;
            color: #1a1a1a;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            overscroll-behavior-y: auto;
        }
        .royal-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .royal-btn {
            background: #111111;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .royal-btn:hover {
            background: #2d2d2d;
            transform: translateY(-1px);
        }
        /* เอฟเฟกต์ขาวดำสำหรับตัวละครที่ยังไม่มี */
        .grayscale-card {
            filter: grayscale(100%);
            opacity: 0.6;
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex flex-col justify-between select-none">

    <!-- Top Navigation Bar -->
    <div class="relative z-20 p-4 max-w-lg mx-auto w-full flex items-center justify-between">
        <button onclick="window.location.href='home.html'" class="royal-card px-4 py-2 rounded-2xl text-xs font-semibold flex items-center gap-2 cursor-pointer shadow-sm">
            <span>←</span> กลับหน้าหลัก
        </button>
        <h1 class="font-bold text-base text-neutral-900 flex items-center gap-2">
            <span>📖</span> ไดอารี่ตัวละคร
        </h1>
        <div class="w-20"></div> <!-- จัดตำแหน่งให้สมดุล -->
    </div>

    <!-- Main Content: รายชื่อตัวละครทั้งหมดในเกม -->
    <div class="relative z-10 flex-1 max-w-lg mx-auto w-full p-4 overflow-y-auto">
        <div id="character-grid" class="grid grid-cols-2 gap-4 pb-6">
            <!-- รายชื่อตัวละครจะถูกเรนเดอร์ผ่าน JavaScript แบบ Realtime -->
            <div class="col-span-2 text-center py-12 text-neutral-400 text-sm">กำลังโหลดข้อมูลไดอารี่...</div>
        </div>
    </div>

    <!-- Modal: ป๊อปอัพหนังสือไดอารี่ (ขนาดเท่ากันหมดทุกตัวละคร) -->
    <div id="diary-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden" style="background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);">
        <div class="royal-card w-full max-w-md rounded-3xl p-6 relative max-h-[85vh] flex flex-col shadow-2xl" style="border: 1px solid #e5e7eb;">
            
            <!-- ปุ่มปิดป๊อปอัพหนังสือ -->
            <button onclick="closeDiaryModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-neutral-100 flex items-center justify-center text-neutral-600 hover:bg-neutral-200 cursor-pointer font-bold">✕</button>

            <!-- เนื้อหาหนังสือ (ซ้าย-ขวา) -->
            <div class="flex-1 overflow-y-auto pr-1 grid grid-cols-1 md:grid-cols-2 gap-6 my-2">
                
                <!-- หน้าซ้าย: รูปตัวละคร / สกิน / เลือกสวมใส่ -->
                <div class="flex flex-col items-center justify-center bg-neutral-50 p-4 rounded-2xl border border-neutral-100">
                    <div id="modal-skin-preview-container" class="cursor-pointer group relative" onclick="openSkinSelector()">
                        <img id="modal-char-img" src="" alt="Character Skin" class="h-48 w-auto object-contain transition-transform group-hover:scale-105">
                        <div class="absolute inset-0 flex items-end justify-center pb-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <span class="bg-black/70 text-white text-[10px] px-2 py-1 rounded-full">เปลี่ยนสกิน ▾</span>
                        </div>
                    </div>
                    <div id="modal-char-name" class="mt-3 font-bold text-sm text-neutral-900 text-center">ชื่อตัวละคร</div>
                    <button id="equip-btn" onclick="equipCurrentSkin()" class="mt-3 w-full py-2 rounded-xl text-xs font-semibold royal-btn cursor-pointer">
                        สวมใส่แสดงหน้าล็อบบี้
                    </button>
                </div>

                <!-- หน้าขวา: ข้อมูล และแถบการ์ด 3 หัวข้อ (เนื้อเรื่อง, ภูมิหลัง, ความสัมพันธ์) -->
                <div class="flex flex-col justify-between space-y-3">
                    <div class="space-y-1.5 text-xs text-neutral-700 bg-neutral-50 p-3 rounded-2xl border border-neutral-100">
                        <p><strong>อายุ:</strong> <span id="info-age">-</span></p>
                        <p><strong>ส่วนสูง:</strong> <span id="info-height">-</span></p>
                        <p><strong>อาชีพ:</strong> <span id="info-occupation">-</span></p>
                    </div>

                    <!-- แถบการ์ด 3 หัวข้อ -->
                    <div class="space-y-2 flex-1">
                        <button onclick="openCardDetail('story')" class="w-full py-2 px-3 rounded-xl bg-white border border-neutral-200 text-xs font-medium text-left flex justify-between items-center hover:bg-neutral-50 cursor-pointer shadow-sm">
                            <span>1. เนื้อเรื่อง</span> <span class="text-neutral-400">▶</span>
                        </button>
                        <button onclick="openCardDetail('background')" class="w-full py-2 px-3 rounded-xl bg-white border border-neutral-200 text-xs font-medium text-left flex justify-between items-center hover:bg-neutral-50 cursor-pointer shadow-sm">
                            <span>2. ภูมิหลัง</span> <span class="text-neutral-400">▶</span>
                        </button>
                        <button onclick="openCardDetail('relationship')" class="w-full py-2 px-3 rounded-xl bg-white border border-neutral-200 text-xs font-medium text-left flex justify-between items-center hover:bg-neutral-50 cursor-pointer shadow-sm">
                            <span>3. ความสัมพันธ์</span> <span class="text-neutral-400">▶</span>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Modal ย่อย: แสดงรายละเอียดการ์ด (เนื้อเรื่อง / ภูมิหลัง / ความสัมพันธ์) แบบเลื่อนอ่านได้ -->
    <div id="card-detail-modal" class="fixed inset-0 z-60 flex items-center justify-center p-4 hidden" style="background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);">
        <div class="royal-card w-full max-w-sm rounded-3xl p-6 relative max-h-[70vh] flex flex-col shadow-2xl">
            <h3 id="card-modal-title" class="font-bold text-sm text-neutral-900 mb-3 border-b pb-2">หัวข้อ</h3>
            <div id="card-modal-content" class="text-xs text-neutral-600 overflow-y-auto flex-1 pr-1 leading-relaxed">
                เนื้อหา...
            </div>
            <button onclick="closeCardDetail()" class="mt-4 w-full py-2 rounded-xl text-xs font-semibold royal-btn cursor-pointer">ปิด</button>
        </div>
    </div>

    <!-- Modal ย่อย: เลือกสกินทั้งหมดของผู้เล่น (เรียงระดับ B, A, S, SR, SSR) -->
    <div id="skin-selector-modal" class="fixed inset-0 z-60 flex items-center justify-center p-4 hidden" style="background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);">
        <div class="royal-card w-full max-w-sm rounded-3xl p-6 relative max-h-[70vh] flex flex-col shadow-2xl">
            <h3 class="font-bold text-sm text-neutral-900 mb-3 text-center">เลือกสกินตัวละคร</h3>
            <div id="skin-list-container" class="grid grid-cols-3 gap-3 overflow-y-auto flex-1 p-1">
                <!-- รายการสกินที่ผู้เล่นมีเรียงตามระดับ -->
            </div>
            <button onclick="closeSkinSelector()" class="mt-4 w-full py-2 rounded-xl text-xs font-semibold bg-neutral-200 text-neutral-800 cursor-pointer">ย้อนกลับ</button>
        </div>
    </div>

    <!-- Supabase & Config Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        let currentUserId = null;
        let selectedCharacter = null;
        let currentSelectedSkin = null;

        async function initDiary() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            currentUserId = session.user.id;
            loadDiaryCharacters();
        }

        // โหลดข้อมูลตัวละครและสกินของผู้ใช้
        async function loadDiaryCharacters() {
            try {
                // ดึงข้อมูลตัวละครทั้งหมดจากระบบ และสกินที่ผู้เล่นครอบครอง
                const { data: characters, error } = await supabase.from('characters').select('*');
                if (error) throw error;

                const { data: userSkins, error: skinErr } = await supabase
                    .from('user_skins')
                    .select('skin_id')
                    .eq('user_id', currentUserId);

                if (skinErr) throw skinErr;
                const ownedSkinIds = new Set(userSkins.map(s => s.skin_id));

                const grid = document.getElementById('character-grid');
                grid.innerHTML = '';

                if (!characters || characters.length === 0) {
                    grid.innerHTML = '<div class="col-span-2 text-center py-12 text-neutral-400 text-sm">ยังไม่มีข้อมูลตัวละครในระบบ</div>';
                    return;
                }

                characters.forEach(char => {
                    const hasChar = ownedSkinIds.has(char.default_skin_id) || char.is_free;
                    
                    const card = document.createElement('div');
                    card.className = `royal-card rounded-2xl p-4 flex flex-col items-center cursor-pointer transition-all hover:scale-[1.02] ${hasChar ? '' : 'grayscale-card'}`;
                    card.onclick = () => openDiaryModal(char, hasChar);

                    card.innerHTML = `
                        <img src="${char.image_url}" alt="${char.name}" class="h-36 w-auto object-contain mb-3">
                        <span class="font-bold text-xs text-neutral-900">${char.name}</span>
                        <span class="text-[10px] text-neutral-500 mt-0.5">${hasChar ? 'มีแล้ว' : 'ยังไม่มี'}</span>
                    `;
                    grid.appendChild(card);
                });

            } catch (err) {
                console.error('Error loading diary:', err.message);
            }
        }

        function openDiaryModal(char, hasChar) {
            if (!hasChar) {
                showPopup('แจ้งเตือน', 'คุณยังไม่มีตัวละครนี้ ไม่สามารถเปิดดูข้อมูลและเนื้อเรื่องได้', '🔒');
                return;
            }
            selectedCharacter = char;
            document.getElementById('modal-char-name').innerText = char.name;
            document.getElementById('modal-char-img').src = char.image_url;
            document.getElementById('info-age').innerText = char.age || 'ไม่ระบุ';
            document.getElementById('info-height').innerText = char.height || 'ไม่ระบุ';
            document.getElementById('info-squadron' || 'info-occupation').innerText = char.occupation || 'ไม่ระบุ';
            
            document.getElementById('diary-modal').classList.remove('hidden');
        }

        function closeDiaryModal() {
            document.getElementById('diary-modal').classList.add('hidden');
        }

        function openCardDetail(type) {
            const titles = { story: '1. เนื้อเรื่อง', background: '2. ภูมิหลัง', relationship: '3. ความสัมพันธ์' };
            const contents = {
                story: selectedCharacter?.story || 'ยังไม่มีข้อมูลเนื้อเรื่อง',
                background: selectedCharacter?.background || 'ยังไม่มีข้อมูลภูมิหลัง',
                relationship: selectedCharacter?.relationship || 'ยังไม่มีข้อมูลความสัมพันธ์'
            };
            document.getElementById('card-modal-title').innerText = titles[type];
            document.getElementById('card-modal-content').innerText = contents[type];
            document.getElementById('card-detail-modal').classList.remove('hidden');
        }

        function closeCardDetail() {
            document.getElementById('card-detail-modal').classList.add('hidden');
        }

        function openSkinSelector() {
            document.getElementById('skin-selector-modal').classList.remove('hidden');
        }

        function closeSkinSelector() {
            document.getElementById('skin-selector-modal').classList.add('hidden');
        }

        async function equipCurrentSkin() {
            if (!selectedCharacter) return;
            try {
                const { error } = await supabase
                    .from('users')
                    .update({ 
                        equipped_skin_image: selectedCharacter.full_image_url || selectedCharacter.image_url,
                        equipped_skin_name: selectedCharacter.name 
                    })
                    .eq('id', currentUserId);

                if (error) throw error;
                showPopup('สำเร็จ', 'สวมใส่สกินตัวละครหน้าล็อบบี้เรียบร้อยแล้ว!', '✨');
                closeDiaryModal();
            } catch (err) {
                showPopup('เกิดข้อผิดพลาด', err.message, '❌');
            }
        }

        window.addEventListener('DOMContentLoaded', initDiary);
    </script>
</body>
</html>
