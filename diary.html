<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POCKET DIARY - ไดอารี่</title>
  
  <!-- Google Font: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-pearl: #FDFBFB;
      --bg-pearl-gradient: linear-gradient(135deg, #FFFFFF 0%, #EFECE6 100%);
      --royal-black: #111111;
      --royal-gold: #D4AF37;
      --accent-gray: #555555;
      --border-color: rgba(17, 17, 17, 0.15);
      --shadow-luxury: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--bg-pearl-gradient);
      color: var(--royal-black);
      position: relative;
    }

    /* Top HUD */
    .top-hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(253, 251, 251, 0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
    }

    .back-btn, .currency-box {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      text-decoration: none;
      color: var(--royal-black);
      cursor: pointer;
    }

    .currency-container {
      display: flex;
      gap: 8px;
    }

    .currency-box img {
      width: 18px; height: 18px; object-fit: contain;
    }

    /* Main Diary Container */
    .diary-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 80px 20px 30px 20px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Grid แสดงผลตัวละคร */
    .diary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
    }

    .diary-card {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 10px;
      text-align: center;
      box-shadow: var(--shadow-luxury);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .diary-card:active {
      transform: scale(0.97);
    }

    .diary-card img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 8px;
      background: #F4F3F0;
    }

    .diary-card.locked img {
      filter: grayscale(100%);
      opacity: 0.6;
    }

    .diary-item-name {
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .diary-item-rank {
      font-size: 0.72rem;
      color: var(--royal-gold);
      font-weight: 700;
      margin-top: 2px;
    }

    .empty-state {
      grid-column: span 2;
      text-align: center;
      padding: 40px 20px;
      color: var(--accent-gray);
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 16px;
      border: 1px dashed var(--border-color);
    }

    /* Popup Overlay */
    .popup-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }

    .popup-overlay.show { opacity: 1; pointer-events: auto; }

    .popup-card {
      background: #FFF; width: 90%; max-width: 380px;
      border-radius: 20px; padding: 20px; text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      position: relative;
    }

    .popup-close {
      position: absolute;
      top: 15px; right: 15px;
      background: none; border: none;
      font-size: 1.1rem; cursor: pointer;
      color: var(--accent-gray);
    }

    .popup-btn {
      width: 100%;
      padding: 10px;
      background: var(--royal-black);
      color: #FFF;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
    }

    /* สมุดบันทึกตัวละคร */
    .book-popup-card {
      background: #FFFDF9;
      width: 92%;
      max-width: 440px;
      height: 520px;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      position: relative;
      border: 2px solid var(--royal-gold);
    }

    .book-content {
      display: flex;
      gap: 15px;
      flex: 1;
      overflow: hidden;
      margin-top: 10px;
    }

    .book-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-right: 1px dashed var(--border-color);
      padding-right: 10px;
    }

    .book-left img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: var(--shadow-luxury);
    }

    .book-right {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      text-align: left;
      padding-left: 5px;
    }

    .book-right h3 {
      font-size: 1rem;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .book-info-text {
      font-size: 0.8rem;
      color: var(--accent-gray);
      margin-bottom: 4px;
    }

    .book-tabs {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }

    .book-tab-btn {
      background: #F4F3F0;
      border: 1px solid var(--border-color);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .book-tab-btn:hover {
      background: var(--royal-black);
      color: #FFF;
    }

    .sub-popup-content {
      max-height: 250px;
      overflow-y: auto;
      font-size: 0.85rem;
      color: var(--accent-gray);
      text-align: left;
      line-height: 1.5;
      padding: 5px;
    }
  </style>
</head>
<body>

  <!-- Top HUD -->
  <header class="top-hud">
    <a href="home.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> หน้าหลัก
    </a>
    <div class="currency-container">
      <div class="currency-box">
        <i class="fa-solid fa-coins" style="color: var(--royal-gold);"></i>
        <span id="userCoins">0</span>
      </div>
      <div class="currency-box">
        <i class="fa-solid fa-cookie-bite" style="color: #c68b59;"></i>
        <span id="userCookies">0</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="diary-container">
    <div class="section-title">
      <i class="fa-solid fa-book"></i> คอลเลกชันไดอารี่ตัวละคร
    </div>
    
    <div class="diary-grid" id="diaryGrid">
      <div class="empty-state">กำลังโหลดข้อมูล...</div>
    </div>
  </main>

  <!-- Popup หนังสือตัวละคร -->
  <div class="popup-overlay" id="bookOverlay">
    <div class="book-popup-card">
      <button class="popup-close" onclick="closeBookPopup()"><i class="fa-solid fa-xmark"></i></button>
      <h2 id="bookCharTitle" style="font-size: 1.1rem; font-weight: 700; text-align: center;">สมุดบันทึกตัวละคร</h2>
      <div class="book-content">
        <div class="book-left" id="bookLeftContainer"></div>
        <div class="book-right" id="bookRightContainer"></div>
      </div>
    </div>
  </div>

  <!-- Popup ย่อย -->
  <div class="popup-overlay" id="subPopupOverlay">
    <div class="popup-card">
      <button class="popup-close" onclick="closeSubPopup()"><i class="fa-solid fa-xmark"></i></button>
      <h3 id="subPopupTitle" style="margin-bottom: 10px;">หัวข้อ</h3>
      <div id="subPopupBody" class="sub-popup-content"></div>
      <button onclick="closeSubPopup()" class="popup-btn">ปิด</button>
    </div>
  </div>

  <!-- Popup แจ้งเตือน -->
  <div class="popup-overlay" id="alertOverlay">
    <div class="popup-card">
      <h3 id="alertTitle" style="margin-bottom: 8px;">แจ้งเตือน</h3>
      <p id="alertDesc" style="color: var(--accent-gray); margin-bottom: 10px; font-size: 0.9rem;"></p>
      <button onclick="closeAlert()" class="popup-btn">ตกลง</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://ooozqddxvxeykwubumli.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xwsBeo4TJfLSwnQUiV2uSw_7GwLZd85';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let charactersList = [];
    let userOwnedSkins = [];
    let activeCharacter = null;

    window.showAlert = function(title, desc) {
      document.getElementById('alertTitle').textContent = title;
      document.getElementById('alertDesc').textContent = desc;
      document.getElementById('alertOverlay').classList.add('show');
    }

    window.closeAlert = function() {
      document.getElementById('alertOverlay').classList.remove('show');
    }

    window.closeBookPopup = function() {
      document.getElementById('bookOverlay').classList.remove('show');
    }

    window.closeSubPopup = function() {
      document.getElementById('subPopupOverlay').classList.remove('show');
    }

    async function initDiary() {
      const savedUser = sessionStorage.getItem('pocket_diary_user');
      if (!savedUser) {
        window.location.href = 'index.html';
        return;
      }
      
      const localUser = JSON.parse(savedUser);

      try {
        const { data: freshUser, error } = await supabase
          .from('users')
          .select('*')
          .eq('id', localUser.id)
          .single();

        if (error) throw error;
        currentUser = freshUser || localUser;
        sessionStorage.setItem('pocket_diary_user', JSON.stringify(currentUser));
      } catch (err) {
        currentUser = localUser;
      }

      updateCurrencyDisplay();
      await fetchCharactersAndSkins();

      supabase
        .channel('public:users')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'users', filter: `id=eq.${currentUser.id}` }, payload => {
          currentUser = payload.new;
          sessionStorage.setItem('pocket_diary_user', JSON.stringify(currentUser));
          updateCurrencyDisplay();
        })
        .subscribe();
    }

    function updateCurrencyDisplay() {
      document.getElementById('userCoins').textContent = (currentUser.coins || 0).toLocaleString();
      document.getElementById('userCookies').textContent = (currentUser.cookies || 0).toLocaleString();
    }

    async function fetchCharactersAndSkins() {
      const grid = document.getElementById('diaryGrid');
      grid.innerHTML = '<div class="empty-state">กำลังโหลดข้อมูล...</div>';

      try {
        // ดึงข้อมูลตัวละครจากตาราง characters ที่ซิงค์มาจาก admin_gacha.html
        const { data: chars, error: charErr } = await supabase.from('characters').select('*');
        if (charErr) throw charErr;
        charactersList = chars || [];

        // ดึงสกินที่ผู้ใช้ครอบครอง
        const { data: skins, error: skinErr } = await supabase.from('user_skins').select('*').eq('user_id', currentUser.id);
        if (skinErr) throw skinErr;
        userOwnedSkins = skins || [];

        renderCharacterGrid();
      } catch (err) {
        console.error('Error fetching data:', err);
        grid.innerHTML = '<div class="empty-state">ไม่สามารถโหลดข้อมูลไดอารี่ได้</div>';
      }
    }

    function renderCharacterGrid() {
      const grid = document.getElementById('diaryGrid');
      if (charactersList.length === 0) {
        grid.innerHTML = '<div class="empty-state">ยังไม่มีข้อมูลตัวละครในระบบเกม</div>';
        return;
      }

      grid.innerHTML = '';
      charactersList.forEach(char => {
        // ตรวจสอบการครอบครองผ่าน id หรือ name ของตัวละคร/สกิน
        const hasChar = userOwnedSkins.some(s => s.character_id === char.id || s.skin_id === char.id || s.name === char.name);
        
        const card = document.createElement('div');
        card.className = `diary-card ${hasChar ? '' : 'locked'}`;
        card.innerHTML = `
          <img src="${char.image_url || char.image || 'https://via.placeholder.com/150'}" alt="${char.name}">
          <div class="diary-item-name">${char.name}</div>
          <div class="diary-item-rank">[ ระดับ ${char.rank || 'B'} ]</div>
        `;
        
        card.onclick = () => openCharacterBook(char, hasChar);
        grid.appendChild(card);
      });
    }

    function openCharacterBook(char, hasChar) {
      activeCharacter = char;
      const bookOverlay = document.getElementById('bookOverlay');
      const leftContainer = document.getElementById('bookLeftContainer');
      const rightContainer = document.getElementById('bookRightContainer');

      document.getElementById('bookCharTitle').textContent = `สมุดบันทึก : ${char.name}`;

      const imgUrl = char.image_url || char.image || 'https://via.placeholder.com/150';

      if (!hasChar) {
        leftContainer.innerHTML = `<img src="${imgUrl}" style="filter: grayscale(100%);" alt="${char.name}">`;
        rightContainer.innerHTML = `
          <h3>${char.name}</h3>
          <p class="book-info-text">สถานะ: ยังไม่มีในครอบครอง</p>
          <p class="book-info-text" style="color: #d9534f; margin-top: 10px;">คุณยังไม่มีตัวละครนี้ จึงไม่สามารถเปิดดูเนื้อเรื่องและสกินได้</p>
        `;
      } else {
        leftContainer.innerHTML = `<img src="${imgUrl}" alt="${char.name}" onclick="showCharacterSkins('${char.id}')" title="คลิกเพื่อดูสกิน">`;
        rightContainer.innerHTML = `
          <h3>${char.name}</h3>
          <p class="book-info-text">ระดับ: [ ${char.rank || 'B'} ]</p>
          <div class="book-tabs">
            <button class="book-tab-btn" onclick="openStoryTab()">1. เนื้อเรื่อง <i class="fa-solid fa-chevron-right"></i></button>
            <button class="book-tab-btn" onclick="openBackgroundTab()">2. ภูมิหลัง <i class="fa-solid fa-chevron-right"></i></button>
            <button class="book-tab-btn" onclick="openRelationTab()">3. ความสัมพันธ์ <i class="fa-solid fa-chevron-right"></i></button>
          </div>
        `;
      }

      bookOverlay.classList.add('show');
    }

    window.openStoryTab = function() {
      if (!activeCharacter) return;
      document.getElementById('subPopupTitle').textContent = 'เนื้อเรื่องตัวละคร';
      document.getElementById('subPopupBody').innerHTML = `<p>${activeCharacter.story || 'ยังไม่มีข้อมูลเนื้อเรื่องสำหรับตัวละครนี้'}</p>`;
      document.getElementById('subPopupOverlay').classList.add('show');
    }

    window.openBackgroundTab = function() {
      if (!activeCharacter) return;
      document.getElementById('subPopupTitle').textContent = 'ภูมิหลังตัวละคร';
      document.getElementById('subPopupBody').innerHTML = `<p>${activeCharacter.background || 'ยังไม่มีข้อมูลภูมิหลังสำหรับตัวละครนี้'}</p>`;
      document.getElementById('subPopupOverlay').classList.add('show');
    }

    window.openRelationTab = function() {
      if (!activeCharacter) return;
      document.getElementById('subPopupTitle').textContent = 'ความสัมพันธ์ตัวละคร';
      document.getElementById('subPopupBody').innerHTML = `<p>${activeCharacter.relationship || 'ยังไม่มีข้อมูลความสัมพันธ์สำหรับตัวละครนี้'}</p>`;
      document.getElementById('subPopupOverlay').classList.add('show');
    }

    window.showCharacterSkins = function(charId) {
      document.getElementById('subPopupTitle').textContent = 'สกินตัวละคร';
      document.getElementById('subPopupBody').innerHTML = `<p>แสดงรูปเต็มตัว: <br><img src="${activeCharacter.full_image_url || activeCharacter.image_url}" style="width:100%; border-radius:10px; margin-top:8px;"></p>`;
      document.getElementById('subPopupOverlay').classList.add('show');
    }

    window.addEventListener('DOMContentLoaded', initDiary);
  </script>
</body>
</html>
