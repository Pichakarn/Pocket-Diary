<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POCKET DIARY - กาชา</title>
  
  <!-- Google Font: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-pearl: #FDFBFB;
      --bg-pearl-gradient: linear-gradient(135deg, #FFFFFF 0%, #EFECE6 100%);
      --royal-black: #111111;
      --royal-gold: #D4AF37;
      --accent-gray: #555555;
      --border-color: rgba(17, 17, 17, 0.15);
      --shadow-luxury: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      overflow-y: auto; /* ปลดล็อกให้เลื่อนขึ้นลงได้ */
      background: var(--bg-pearl-gradient);
      color: var(--royal-black);
    }

    /* Top HUD */
    .top-hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(253, 251, 251, 0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
    }

    .back-btn, .currency-box {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      text-decoration: none;
      color: var(--royal-black);
    }

    .currency-container {
      display: flex;
      gap: 8px;
    }

    .currency-box img {
      width: 18px; height: 18px; object-fit: contain;
    }

    /* Main Gacha Container - ใช้พื้นที่คุ้มค่าและให้ยืดหยุ่น */
    .gacha-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 80px 20px 30px 20px; /* เว้นหัวด้านบนให้พ้น Fixed HUD */
    }

    /* Tab เลือกตู้กาชา */
    .gacha-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      width: 100%;
      padding-bottom: 6px;
      margin-bottom: 16px;
      scrollbar-width: none; /* ซ่อน scrollbar บน Firefox */
    }
    .gacha-tabs::-webkit-scrollbar {
      display: none; /* ซ่อน scrollbar บน Chrome/Safari */
    }

    .gacha-tab {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .gacha-tab.active {
      background: var(--royal-black);
      color: #FFF;
      border-color: var(--royal-black);
    }

    .gacha-tab.hidden {
      display: none !important;
    }

    /* ตู้กาชาแสดงผลหลัก (ขยายให้เต็มตาขึ้น) */
    .gacha-banner-card {
      width: 100%;
      background: #FFFFFF;
      border: 2px solid var(--royal-black);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow-luxury);
      display: flex;
      flex-direction: column;
      position: relative;
      margin-bottom: 16px;
    }

    .banner-img-area {
      width: 100%;
      aspect-ratio: 4 / 3; /* ปรับสัดส่วนให้สูงขึ้น เต็มพื้นที่สวยงาม */
      background: #F4F3F0;
      position: relative;
      overflow: hidden;
    }

    .banner-img-area img {
      width: 100%; height: 100%; object-fit: cover;
    }

    .banner-info {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .banner-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .banner-desc {
      font-size: 0.78rem;
      color: var(--accent-gray);
      margin-top: 2px;
    }

    /* ปุ่มกดสุ่ม */
    .gacha-actions {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .gacha-btn {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      transition: transform 0.1s;
    }

    .gacha-btn:active {
      transform: scale(0.97);
    }

    .btn-single {
      background: #FFFFFF;
      color: var(--royal-black);
      border: 1.5px solid var(--royal-black);
    }

    .btn-multi {
      background: var(--royal-black);
      color: #FFFFFF;
    }

    /* Popup แสดงผลการสุ่ม */
    .popup-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }

    .popup-overlay.show { opacity: 1; pointer-events: auto; }

    .result-card {
      background: #FFFFFF;
      width: 90%; max-width: 400px;
      border-radius: 24px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .popup-overlay.show .result-card { transform: scale(1); }

    .result-items-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-height: 320px;
      overflow-y: auto;
      margin: 15px 0;
      padding: 5px;
    }

    .result-item-box {
      background: #F8F7F4;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 10px;
      text-align: center;
    }

    .result-item-box img {
      width: 75px; height: 75px; object-fit: cover; border-radius: 12px; margin-bottom: 6px;
    }

    .result-item-name {
      font-size: 0.8rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .result-item-rank {
      font-size: 0.7rem; color: var(--royal-gold); font-weight: 700;
    }

    .popup-btn {
      width: 100%;
      padding: 12px;
      background: var(--royal-black);
      color: #FFF;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .alert-card {
      background: #FFF; width: 85%; max-width: 320px;
      border-radius: 20px; padding: 25px; text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <!-- Top HUD -->
  <header class="top-hud">
    <a href="home.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> หน้าหลัก
    </a>
    <div class="currency-container">
      <div class="currency-box">
        <i class="fa-solid fa-coins" style="color: var(--royal-gold);"></i>
        <span id="userCoins">0</span>
      </div>
      <div class="currency-box">
        <i class="fa-solid fa-cookie-bite" style="color: #c68b59;"></i>
        <span id="userCookies">0</span>
      </div>
    </div>
  </header>

  <!-- Main Gacha UI -->
  <main class="gacha-container">
    <!-- ตู้เลือกกาชา -->
    <div class="gacha-tabs" id="gachaTabsContainer">
      <div class="gacha-tab active" data-type="permanent" onclick="switchGacha('permanent')">ตู้ถาวร</div>
      <div class="gacha-tab" data-type="old_season" onclick="switchGacha('old_season')">ตู้ซีซั่นเก่า</div>
      <div class="gacha-tab" data-type="season" onclick="switchGacha('season')">ตู้ประจำฤดูกาล</div>
      <div class="gacha-tab" data-type="monthly" onclick="switchGacha('monthly')">ตู้รายเดือน</div>
      <div class="gacha-tab hidden" data-type="character" id="tabCharacter" onclick="switchGacha('character')">ตู้ตัวละครใหม่</div>
    </div>

    <!-- แบนเนอร์แสดงตู้กาชา -->
    <div class="gacha-banner-card">
      <div class="banner-img-area">
        <img id="bannerImage" src="" alt="Gacha Banner">
      </div>
      <div class="banner-info">
        <div>
          <div class="banner-title" id="bannerTitle">ตู้ถาวร</div>
          <div class="banner-desc" id="bannerDesc">ตู้มาตรฐานที่ไม่เคยเปลี่ยนของ</div>
        </div>
      </div>
    </div>

    <!-- ปุ่มสุ่ม -->
    <div class="gacha-actions">
      <button class="gacha-btn btn-single" id="btnSingle" onclick="pullGacha(1)">
        <span><i class="fa-solid fa-star" style="color: var(--royal-gold);"></i> สุ่ม 1 ครั้ง</span>
        <span id="priceSingleText" style="font-size: 0.75rem; font-weight: 500;">2,500 เหรียญ</span>
      </button>
      <button class="gacha-btn btn-multi" id="btnMulti" onclick="pullGacha(10)">
        <span><i class="fa-solid fa-wand-magic-sparkles"></i> สุ่ม 10 ครั้ง</span>
        <span id="priceMultiText" style="font-size: 0.75rem; font-weight: 500; opacity: 0.85;">25,000 เหรียญ</span>
      </button>
    </div>
  </main>

  <!-- Popup แสดงผลลัพธ์การสุ่ม -->
  <div class="popup-overlay" id="resultModal">
    <div class="result-card">
      <h3 style="font-size: 1.1rem; margin-bottom: 4px;">ผลการสุ่มกาชา</h3>
      <p style="font-size: 0.8rem; color: var(--accent-gray);">ยินดีด้วย คุณได้รับไอเท็มดังนี้!</p>
      <div class="result-items-grid" id="resultItemsGrid"></div>
      <button class="popup-btn" onclick="closeResultModal()">ยอดเยี่ยม</button>
    </div>
  </div>

  <!-- Alert Popup -->
  <div class="popup-overlay" id="alertOverlay">
    <div class="alert-card">
      <h3 id="alertTitle" style="margin-bottom: 8px;">แจ้งเตือน</h3>
      <p id="alertDesc" style="color: var(--accent-gray); margin-bottom: 20px; font-size: 0.9rem;"></p>
      <button onclick="closeAlert()" class="popup-btn">ตกลง</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://ooozqddxvxeykwubumli.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xwsBeo4TJfLSwnQUiV2uSw_7GwLZd85';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentPoolType = 'permanent';
    let poolItems = {
      permanent: [],
      old_season: [],
      season: [],
      monthly: [],
      character: []
    };

    const poolConfig = {
      permanent: { title: 'ตู้ถาวร (Permanent)', desc: 'ตู้มาตรฐานที่ไม่เคยเปลี่ยนของ', price1: 2500, price10: 25000, img: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=800&auto=format&fit=crop&q=60' },
      old_season: { title: 'ตู้ซีซั่นเก่า (Old Season)', desc: 'รวบรวมสกิน B, A, S และไอเท็มตู้เก่า', price1: 2500, price10: 25000, img: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800&auto=format&fit=crop&q=60' },
      season: { title: 'ตู้ประจำฤดูกาล (Season)', desc: 'ตู้พิเศษเปลี่ยนใหม่ทุกฤดูกาล', price1: 1500, price10: 15000, img: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&auto=format&fit=crop&q=60' },
      monthly: { title: 'ตู้รายเดือน (Monthly)', desc: 'อัปเดตสกินและไอเท็มใหม่ทุก 1 เดือน', price1: 1500, price10: 15000, img: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800&auto=format&fit=crop&q=60' },
      character: { title: 'ตู้ตัวละครใหม่ (Character)', desc: 'ตู้จำกัดเวลา สำหรับสะสมตัวละครใหม่', price1: 2000, price10: 20000, img: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=800&auto=format&fit=crop&q=60' }
    };

    window.showAlert = function(title, desc) {
      document.getElementById('alertTitle').textContent = title;
      document.getElementById('alertDesc').textContent = desc;
      document.getElementById('alertOverlay').classList.add('show');
    }

    window.closeAlert = function() {
      document.getElementById('alertOverlay').classList.remove('show');
    }

    async function initGacha() {
      const savedUser = sessionStorage.getItem('pocket_diary_user');
      if (!savedUser) {
        window.location.href = 'index.html';
        return;
      }
      
      const localUser = JSON.parse(savedUser);

      try {
        const { data: freshUser, error } = await supabase
          .from('users')
          .select('*')
          .eq('id', localUser.id)
          .single();

        if (error) throw error;

        if (freshUser) {
          currentUser = freshUser;
          sessionStorage.setItem('pocket_diary_user', JSON.stringify(currentUser));
        } else {
          currentUser = localUser;
        }
      } catch (err) {
        currentUser = localUser;
      }

      updateCurrencyDisplay();
      await fetchAllPoolsData();
      switchGacha('permanent');
    }

    function updateCurrencyDisplay() {
      document.getElementById('userCoins').textContent = (currentUser.coins || 0).toLocaleString();
      document.getElementById('userCookies').textContent = (currentUser.cookies || 0).toLocaleString();
    }

    async function fetchAllPoolsData() {
      try {
        const { data, error } = await supabase.from('gacha_pools').select('*');
        if (error) throw error;

        if (data) {
          Object.keys(poolItems).forEach(type => {
            poolItems[type] = data.filter(item => item.pool_type === type);
          });
        }
      } catch (err) {
        poolItems.permanent = [
          { id: 'p1', name: 'กุหลาบแดง', type: 'item', rank: 'Item', image: 'https://via.placeholder.com/150' },
          { id: 'p2', name: 'พื้นหลังห้องนอน', type: 'background', rank: 'Background', image: 'https://via.placeholder.com/150' },
          { id: 'p3', name: 'สกินเริ่มต้น B', type: 'skin', rank: 'B', image: 'https://via.placeholder.com/150' }
        ];
      }

      const charTab = document.getElementById('tabCharacter');
      if (poolItems.character.length === 0) {
        charTab.classList.add('hidden');
        if (currentPoolType === 'character') {
          switchGacha('permanent');
        }
      } else {
        charTab.classList.remove('hidden');
      }
    }

    window.switchGacha = function(type) {
      currentPoolType = type;
      document.querySelectorAll('.gacha-tab').forEach(tab => tab.classList.remove('active'));
      const activeTab = document.querySelector(`.gacha-tab[data-type="${type}"]`);
      if (activeTab) activeTab.classList.add('active');

      const config = poolConfig[type];
      document.getElementById('bannerTitle').textContent = config.title;
      document.getElementById('bannerDesc').textContent = config.desc;
      document.getElementById('bannerImage').src = config.img;

      document.getElementById('priceSingleText').textContent = config.price1.toLocaleString() + ' เหรียญ';
      document.getElementById('priceMultiText').textContent = config.price10.toLocaleString() + ' เหรียญ';
    }

    window.pullGacha = async function(count) {
      const config = poolConfig[currentPoolType];
      const cost = count === 1 ? config.price1 : config.price10;

      if ((currentUser.coins || 0) < cost) {
        showAlert('เงินไม่พอ', 'เหรียญในธนาคารของคุณไม่เพียงพอสำหรับการสุ่ม!');
        return;
      }

      const currentPool = poolItems[currentPoolType] || [];
      if (currentPool.length === 0) {
        showAlert('ตู้ว่างเปล่า', 'ยังไม่มีไอเท็มหรือสกินในตู้กาชานี้');
        return;
      }

      currentUser.coins -= cost;

      let wonItems = [];
      for (let i = 0; i < count; i++) {
        const prize = rollGachaByProbability(currentPool);
        wonItems.push(prize);

        if (prize.type === 'skin') {
          await handleSkinReward(prize);
        } else if (prize.type === 'background') {
          await handleBackgroundReward(prize);
        } else if (prize.type === 'item') {
          await handleItemReward(prize);
        }
      }

      try {
        await supabase.from('users').update({ 
          coins: currentUser.coins, 
          cookies: currentUser.cookies 
        }).eq('id', currentUser.id);

        sessionStorage.setItem('pocket_diary_user', JSON.stringify(currentUser));
        updateCurrencyDisplay();
      } catch (err) {
        console.error('อัปเดตข้อมูลผู้ใช้ไม่สำเร็จ:', err);
      }

      showResultModal(wonItems);
    }

    function rollGachaByProbability(pool) {
      const rand = Math.random() * 100;
      let targetCategory = '';
      let targetRank = '';

      if (rand < 60) {
        targetCategory = 'item';
      } else if (rand < 80) {
        targetCategory = 'background';
      } else {
        targetCategory = 'skin';
        const skinRand = Math.random() * 20;
        if (skinRand < 10) targetRank = 'B';
        else if (skinRand < 17) targetRank = 'A';
        else targetRank = 'S';
      }

      let filtered = pool.filter(item => {
        if (targetCategory === 'skin') {
          return item.type === 'skin' && (targetRank ? item.rank === targetRank : true);
        } else {
          return item.type === targetCategory;
        }
      });

      if (filtered.length === 0) filtered = pool;
      return filtered[Math.floor(Math.random() * filtered.length)];
    }

    async function handleSkinReward(prize) {
      try {
        const { data: existing } = await supabase
          .from('user_skins')
          .select('*')
          .eq('user_id', currentUser.id)
          .eq('skin_id', prize.id)
          .single();

        if (existing) {
          let cookieReward = 1;
          if (prize.rank === 'A') cookieReward = 5;
          else if (prize.rank === 'S') cookieReward = 15;
          currentUser.cookies = (currentUser.cookies || 0) + cookieReward;
        } else {
          await supabase.from('user_skins').insert([{ user_id: currentUser.id, skin_id: prize.id }]);
        }
      } catch (err) {
        currentUser.cookies = (currentUser.cookies || 0) + 1;
      }
    }

    async function handleBackgroundReward(prize) {
      try {
        const { data: existing } = await supabase
          .from('user_inventory')
          .select('*')
          .eq('user_id', currentUser.id)
          .eq('item_id', prize.id)
          .single();

        if (existing) {
          currentUser.cookies = (currentUser.cookies || 0) + 1;
        } else {
          await supabase.from('user_inventory').insert([{ user_id: currentUser.id, item_id: prize.id, name: prize.name, item_type: prize.type, image: prize.image }]);
        }
      } catch (err) {
        currentUser.cookies = (currentUser.cookies || 0) + 1;
      }
    }

    async function handleItemReward(prize) {
      try {
        await supabase.from('user_inventory').insert([{ user_id: currentUser.id, item_id: prize.id, name: prize.name, item_type: prize.type, image: prize.image }]);
      } catch (err) {}
    }

    function showResultModal(items) {
      const grid = document.getElementById('resultItemsGrid');
      grid.innerHTML = '';

      items.forEach(item => {
        const box = document.createElement('div');
        box.className = 'result-item-box';
        box.innerHTML = `
          <img src="${item.image}" alt="${item.name}">
          <div class="result-item-name">${item.name}</div>
          <div class="result-item-rank">[ ${item.rank || item.type} ]</div>
        `;
        grid.appendChild(box);
      });

      document.getElementById('resultModal').classList.add('show');
    }

    window.closeResultModal = function() {
      document.getElementById('resultModal').classList.remove('show');
    }

    window.addEventListener('DOMContentLoaded', initGacha);
  </script>
</body>
</html>
