<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POCKET DIARY - เข้าสู่ระบบ / สมัครสมาชิก</title>
  
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Font: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-pearl: #FDFBFB;
      --bg-pearl-gradient: linear-gradient(135deg, #FFFFFF 0%, #EFECE6 100%);
      --royal-black: #111111;
      --royal-gold: #D4AF37;
      --accent-gray: #555555;
      --border-color: rgba(17, 17, 17, 0.15);
      --shadow-luxury: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--bg-pearl-gradient);
      color: var(--royal-black);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 0;
    }

    .container {
      width: 90%;
      max-width: 420px;
      margin-top: 15px;
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 35px 25px;
      box-shadow: var(--shadow-luxury);
      position: relative;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--royal-black);
      text-transform: uppercase;
    }

    .brand-header p {
      font-size: 0.85rem;
      color: var(--accent-gray);
      margin-top: 5px;
    }

    .tab-switcher {
      display: flex;
      background: #F4F3F0;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 25px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 500;
      border: none;
      background: transparent;
      color: var(--accent-gray);
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: var(--royal-black);
      color: #FFFFFF;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--royal-black);
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.95rem;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      outline: none;
      background: #FAFAFA;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--royal-black);
      background: #FFFFFF;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: var(--royal-black);
      color: #FFFFFF;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .popup-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .popup-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .popup-card {
      width: 85%;
      max-width: 320px;
      background: #FFFFFF;
      border: 2px solid var(--royal-black);
      border-radius: 20px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .popup-overlay.show .popup-card {
      transform: scale(1);
    }

    .popup-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .popup-desc {
      font-size: 0.9rem;
      color: var(--accent-gray);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .popup-btn {
      width: 100%;
      padding: 10px;
      background: var(--royal-black);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .loading-spinner {
      display: none;
      width: 20px; height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand-header">
      <h1>POCKET DIARY</h1>
      <p>บันทึกเรื่องราวความทรงจำของคุณและพวกเขา</p>
    </div>

    <!-- ปุ่มสลับแท็บ: เข้าสู่ระบบ / สมัครสมาชิก -->
    <div class="tab-switcher">
      <button class="tab-btn active" id="tabLoginBtn" onclick="switchTab('login')">เข้าสู่ระบบ</button>
      <button class="tab-btn" id="tabRegisterBtn" onclick="switchTab('register')">สมัครสมาชิก</button>
    </div>

    <!-- ฟอร์มเข้าสู่ระบบ -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>อีเมล</label>
        <input type="email" id="loginEmail" class="form-control" required>
      </div>
      <div class="form-group">
        <label>รหัสผ่าน</label>
        <input type="password" id="loginPassword" class="form-control" required>
      </div>
      <button type="submit" class="btn-submit" id="loginSubmitBtn">
        <span class="btn-text">เข้าสู่ระบบ</span>
        <div class="loading-spinner" id="loginSpinner"></div>
      </button>
    </form>

    <!-- ฟอร์มสมัครสมาชิก -->
    <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="regName" class="form-group-input form-control" required>
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="regUsername" class="form-control" required>
      </div>
      <div class="form-group">
        <label>อีเมล</label>
        <input type="email" id="regEmail" class="form-control" required>
      </div>
      <div class="form-group">
        <label>รหัสผ่าน</label>
        <input type="password" id="regPassword" class="form-control" required>
      </div>
      <button type="submit" class="btn-submit" id="regSubmitBtn">
        <span class="btn-text">สร้างบัญชีผู้ใช้</span>
        <div class="loading-spinner" id="regSpinner"></div>
      </button>
    </form>
  </div>

  <!-- Custom Popup น่ารักๆ -->
  <div class="popup-overlay" id="customPopup">
    <div class="popup-card">
      <div class="popup-title" id="popupTitle">แจ้งเตือน</div>
      <div class="popup-desc" id="popupDesc">ข้อความแจ้งเตือน...</div>
      <button class="popup-btn" onclick="closePopup()">ตกลงค่ะ / ครับ</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://ooozqddxvxeykwubumli.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xwsBeo4TJfLSwnQUiV2uSw_7GwLZd85';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.showPopup = function(title, desc) {
      document.getElementById('popupTitle').innerText = title;
      document.getElementById('popupDesc').innerText = desc;
      document.getElementById('customPopup').classList.add('show');
    }

    window.closePopup = function() {
      document.getElementById('customPopup').classList.remove('show');
    }

    window.switchTab = function(type) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const tabLoginBtn = document.getElementById('tabLoginBtn');
      const tabRegisterBtn = document.getElementById('tabRegisterBtn');

      if (type === 'login') {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        tabLoginBtn.classList.add('active');
        tabRegisterBtn.classList.remove('active');
      } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        tabRegisterBtn.classList.add('active');
        tabLoginBtn.classList.remove('active');
      }
    }

    function generateBankNumber() {
      let num = '';
      for (let i = 0; i < 10; i++) {
        num += Math.floor(Math.random() * 10);
      }
      return num;
    }

    window.handleRegister = async function(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const password = document.getElementById('regPassword').value;

      const btnText = document.querySelector('#regSubmitBtn .btn-text');
      const spinner = document.getElementById('regSpinner');
      btnText.style.display = 'none';
      spinner.style.display = 'block';

      try {
        const { data: existingUser } = await supabase
          .from('users')
          .select('email, username')
          .or(`email.eq.${email},username.eq.${username}`)
          .maybeSingle();

        if (existingUser) {
          showPopup('สมัครไม่สำเร็จ', 'อีเมลนี้หรือ Username นี้มีผู้ใช้งานในระบบแล้วครับ');
          return;
        }

        const bankAccNo = generateBankNumber();
        const isAdminUser = (email === 'ciiderydem@gmail.com');

        const { data, error } = await supabase
          .from('users')
          .insert([
            {
              email: email,
              password: password,
              name: name,
              username: username,
              bank_account_number: bankAccNo,
              bank_account_name: name,
              coins: 1000,
              cookies: 0,
              is_admin: isAdminUser,
              created_at: new Date().toISOString()
            }
          ])
          .select()
          .single();

        if (error) throw error;

        sessionStorage.setItem('pocket_diary_user', JSON.stringify(data));

        showPopup('สมัครสมาชิกสำเร็จ!', 'ยินดีต้อนรับสู่ POCKET DIARY กำลังเข้าสู่หน้าหลัก...');
        setTimeout(() => {
          window.location.href = 'home.html';
        }, 1200);

      } catch (err) {
        showPopup('เกิดข้อผิดพลาด', err.message || 'ไม่สามารถสมัครสมาชิกได้ กรุณาลองใหม่อีกครั้ง');
      } finally {
        btnText.style.display = 'inline';
        spinner.style.display = 'none';
      }
    }

    window.handleLogin = async function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const password = document.getElementById('loginPassword').value;

      const btnText = document.querySelector('#loginSubmitBtn .btn-text');
      const spinner = document.getElementById('loginSpinner');
      btnText.style.display = 'none';
      spinner.style.display = 'block';

      try {
        const { data: user, error } = await supabase
          .from('users')
          .select('*')
          .eq('email', email)
          .eq('password', password)
          .single();

        if (error || !user) {
          showPopup('เข้าสู่ระบบไม่สำเร็จ', 'อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบอีกครั้งครับ');
          return;
        }

        // เช็กสิทธิ์แอดมินอัตโนมัติถ้าใช้อีเมลแอดมิน
        if (email === 'ciiderydem@gmail.com' && password === 'adminciily') {
          user.is_admin = true;
          await supabase
            .from('users')
            .update({ is_admin: true })
            .eq('id', user.id);
        }

        sessionStorage.setItem('pocket_diary_user', JSON.stringify(user));

        showPopup('ยินดีต้อนรับกลับมา!', `เข้าสู่ระบบในชื่อ ${user.name || user.email} สำเร็จ`);
        setTimeout(() => {
          window.location.href = 'home.html';
        }, 1000);

      } catch (err) {
        showPopup('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้');
      } finally {
        btnText.style.display = 'inline';
        spinner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
