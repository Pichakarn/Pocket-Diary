<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Diary - เข้าสู่ระบบ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #f7ebed 50%, #e8f4f8 100%);
        }
        .pearl-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px rgba(216, 180, 204, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- การ์ดล็อกอินหลัก -->
    <div class="pearl-card w-full max-w-md rounded-3xl p-8 relative overflow-hidden">
        
        <!-- แถบตกแต่งหัวการ์ดสีพาสเทล -->
        <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-pink-300 via-purple-200 to-blue-300"></div>

        <!-- โลโก้ & หัวข้อ -->
        <div class="text-center mb-8 mt-2">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-pink-50 text-pink-500 text-3xl shadow-inner mb-3">
                📖
            </div>
            <h1 class="text-2xl font-bold text-gray-700 tracking-wide">Pocket Diary</h1>
            <p class="text-gray-400 text-xs mt-1">สมุดบันทึกความทรงจำและกาชาฮีลใจส่วนตัวของคุณ</p>
        </div>

        <!-- ฟอร์มกรอกข้อมูล -->
        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-gray-600 text-xs font-semibold mb-1.5 uppercase tracking-wider">อีเมล (Email)</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-3 bg-white/70 border border-pink-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-pink-300 text-gray-700 text-sm transition placeholder-gray-300"
                    placeholder="name@example.com">
            </div>

            <div>
                <label class="block text-gray-600 text-xs font-semibold mb-1.5 uppercase tracking-wider">รหัสผ่าน (Password)</label>
                <input type="password" id="password" required minlength="6"
                    class="w-full px-4 py-3 bg-white/70 border border-pink-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-pink-300 text-gray-700 text-sm transition placeholder-gray-300"
                    placeholder="อย่างน้อย 6 ตัวอักษร">
            </div>

            <div class="pt-2">
                <button type="submit" id="submit-btn"
                    class="w-full py-3 bg-gradient-to-r from-pink-400 to-pink-500 hover:from-pink-500 hover:to-pink-600 text-white font-medium text-sm rounded-2xl transition duration-300 shadow-lg shadow-pink-200/50 cursor-pointer">
                    เข้าสู่ระบบ / สมัครสมาชิก
                </button>
            </div>
        </form>

        <!-- ข้อความแนะนำตัวเลือก -->
        <div class="mt-6 text-center text-xs text-gray-400 leading-relaxed">
            ระบบจะทำการสมัครสมาชิกให้อัตโนมัติ<br>หากอีเมลนี้ยังไม่เคยใช้งานในระบบ
        </div>
    </div>

    <!-- Modal Popup แจ้งเตือนสุดน่ารัก -->
    <div id="custom-popup" class="fixed inset-0 bg-black/20 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50 transition-opacity">
        <div class="bg-white/95 border border-pink-100 w-full max-w-xs rounded-3xl p-6 text-center shadow-2xl transform scale-95 transition-transform" id="popup-box">
            <div id="popup-icon" class="text-4xl mb-3">✨</div>
            <h3 id="popup-title" class="font-bold text-gray-700 text-base mb-1">แจ้งเตือน</h3>
            <p id="popup-message" class="text-gray-500 text-xs mb-5 leading-relaxed">ข้อความแจ้งเตือน...</p>
            <button id="popup-close-btn" class="w-full py-2.5 bg-pink-100 hover:bg-pink-200 text-pink-600 font-semibold text-xs rounded-xl transition cursor-pointer">
                ตกลง
            </button>
        </div>
    </div>

    <!-- Script ควบคุมระบบ Authentication, Admin Check และ Modal Popup -->
    <script type="module">
        import { supabase } from './supabase-config.js';

        const authForm = document.getElementById('auth-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submit-btn');

        const popup = document.getElementById('custom-popup');
        const popupBox = document.getElementById('popup-box');
        const popupIcon = document.getElementById('popup-icon');
        const popupTitle = document.getElementById('popup-title');
        const popupMessage = document.getElementById('popup-message');
        const popupCloseBtn = document.getElementById('popup-close-btn');

        let onPopupCloseCallback = null;

        function showPopup(icon, title, message, isSuccess = true, callback = null) {
            popupIcon.textContent = icon;
            popupTitle.textContent = title;
            popupMessage.textContent = message;
            onPopupCloseCallback = callback;

            popup.classList.remove('hidden');
            setTimeout(() => {
                popupBox.classList.remove('scale-95');
                popupBox.classList.add('scale-100');
            }, 10);
        }

        function hidePopup() {
            popupBox.classList.remove('scale-100');
            popupBox.classList.add('scale-95');
            setTimeout(() => {
                popup.classList.add('hidden');
                if (onPopupCloseCallback) {
                    onPopupCloseCallback();
                    onPopupCloseCallback = null;
                }
            }, 150);
        }

        popupCloseBtn.addEventListener('click', hidePopup);

        // ฟังก์ชันตรวจสอบและบันทึกสถานะ Admin
        function handleAdminRole(email) {
            if (email === 'ciiderydem@gmail.com') {
                localStorage.setItem('pocket_diary_is_admin', 'true');
            } else {
                localStorage.removeItem('pocket_diary_is_admin');
            }
        }

        // 1. เช็ก Session อัตโนมัติ
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                // เช็กย้อนหลังเผื่อกรณีเปิดเว็บค้างไว้
                handleAdminRole(session.user.email);
                window.location.href = 'main.html';
            }
        }
        checkSession();

        // 2. จัดการเมื่อกดปุ่ม Submit ล็อกอิน / สมัครสมาชิก
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'กำลังตรวจสอบ...';

            // กรณีพิเศษสำหรับแอดมิน หากใน Supabase อาจจะสมัครไว้แล้วแต่ถ้ายังไม่มี ให้ระบบสมัครให้
            let { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                let signUpResult = await supabase.auth.signUp({
                    email: email,
                    password: password
                });

                if (signUpResult.error) {
                    showPopup('🥺', 'เกิดข้อผิดพลาด', signUpResult.error.message, false);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'เข้าสู่ระบบ / สมัครสมาชิก';
                    return;
                } else {
                    handleAdminRole(email);
                    showPopup('🎉', 'สมัครสมาชิกสำเร็จ!', 'ยินดีต้อนรับสู่สมุดบันทึก Pocket Diary ค่า', true, () => {
                        window.location.href = 'main.html';
                    });
                    return;
                }
            }

            if (data.session) {
                handleAdminRole(email);
                const isAdmin = email === 'ciiderydem@gmail.com';
                const welcomeMsg = isAdmin ? 'ยินดีต้อนรับท่านแอดมิน เข้าสู่ระบบจัดการพิเศษครับ 🛠️' : 'กำลังพาเข้าสู่หน้าหลัก Pocket Diary...';
                
                showPopup('💖', isAdmin ? 'Login Admin สำเร็จ!' : 'ยินดีต้อนรับกลับมานะ!', welcomeMsg, true, () => {
                    window.location.href = 'main.html';
                });
            }
        });
    </script>
</body>
</html>
