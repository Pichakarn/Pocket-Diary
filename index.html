<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POCKET DIARY - เข้าสู่ระบบ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fbfbfb; /* โทนสีขาวมุก */
            color: #1a1a1a;
            overflow: hidden; /* ล็อคหน้าจอไม่ให้ขยับซ้ายขวา บนล่าง */
            touch-action: pan-y;
        }
        .royal-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        .royal-btn {
            background: #111111; /* สีดำพราวราชวงศ์ */
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .royal-btn:hover {
            background: #2d2d2d;
            transform: translateY(-1px);
        }
        /* Custom Popup Style */
        .popup-overlay {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-4">

    <!-- Main Container -->
    <div class="w-full max-w-md royal-card rounded-3xl p-8 relative">
        
        <!-- Header Title -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-wider text-neutral-900 mb-1">POCKET DIARY</h1>
            <p class="text-sm text-neutral-500">บันทึกเรื่องราวและความทรงจำของคุณ</p>
        </div>

        <!-- Form Switcher Tabs -->
        <div class="flex rounded-xl bg-neutral-100 p-1 mb-6 relative z-10">
            <button type="button" id="tab-login" onclick="switchTab('login')" class="flex-1 py-2 text-sm font-medium rounded-lg transition-all bg-white shadow-sm text-neutral-900 cursor-pointer">เข้าสู่ระบบ</button>
            <button type="button" id="tab-register" onclick="switchTab('register')" class="flex-1 py-2 text-sm font-medium rounded-lg transition-all text-neutral-500 hover:text-neutral-900 cursor-pointer">สมัครสมาชิก</button>
        </div>

        <!-- Login Form -->
        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-neutral-600 mb-1">อีเมล</label>
                <input type="email" id="login-email" required class="w-full px-4 py-3 rounded-xl border border-neutral-200 focus:outline-none focus:border-neutral-800 text-sm bg-neutral-50/50">
            </div>
            <div>
                <label class="block text-xs font-medium text-neutral-600 mb-1">รหัสผ่าน</label>
                <input type="password" id="login-password" required class="w-full px-4 py-3 rounded-xl border border-neutral-200 focus:outline-none focus:border-neutral-800 text-sm bg-neutral-50/50">
            </div>
            <button type="submit" class="w-full py-3.5 rounded-xl royal-btn font-medium text-sm tracking-wide shadow-md mt-2 cursor-pointer">
                เข้าสู่ระบบ
            </button>
        </form>

        <!-- Register Form -->
        <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-medium text-neutral-600 mb-1">ชื่อตัวละคร / ชื่อผู้ใช้</label>
                <input type="text" id="reg-name" required class="w-full px-4 py-3 rounded-xl border border-neutral-200 focus:outline-none focus:border-neutral-800 text-sm bg-neutral-50/50">
            </div>
            <div>
                <label class="block text-xs font-medium text-neutral-600 mb-1">อีเมล</label>
                <input type="email" id="reg-email" required class="w-full px-4 py-3 rounded-xl border border-neutral-200 focus:outline-none focus:border-neutral-800 text-sm bg-neutral-50/50">
            </div>
            <div>
                <label class="block text-xs font-medium text-neutral-600 mb-1">รหัสผ่าน</label>
                <input type="password" id="reg-password" required class="w-full px-4 py-3 rounded-xl border border-neutral-200 focus:outline-none focus:border-neutral-800 text-sm bg-neutral-50/50">
            </div>
            <button type="submit" class="w-full py-3.5 rounded-xl royal-btn font-medium text-sm tracking-wide shadow-md mt-2 cursor-pointer">
                สมัครสมาชิก
            </button>
        </form>

    </div>

    <!-- Cute Popup Modal -->
    <div id="cute-popup" class="fixed inset-0 popup-overlay flex items-center justify-center p-4 hidden z-50 transition-opacity">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl transform scale-95 transition-transform" id="popup-box">
            <div id="popup-icon" class="text-4xl mb-3">✨</div>
            <h3 id="popup-title" class="text-lg font-bold text-neutral-900 mb-1">แจ้งเตือน</h3>
            <p id="popup-message" class="text-sm text-neutral-600 mb-6">ข้อความแจ้งเตือน...</p>
            <button onclick="closePopup()" class="w-full py-2.5 rounded-xl royal-btn font-medium text-sm cursor-pointer">ตกลง</button>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://ooozqddxvxeykwubumli.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_xwsBeo4TJfLSwnQUiV2uSw_7GwLZd85';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Check Existing Session on Load
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'home.html';
            }
        });

        // Tab Switcher Logic
        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                tabLogin.className = "flex-1 py-2 text-sm font-medium rounded-lg transition-all bg-white shadow-sm text-neutral-900 cursor-pointer";
                tabReg.className = "flex-1 py-2 text-sm font-medium rounded-lg transition-all text-neutral-500 hover:text-neutral-900 cursor-pointer";
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                tabReg.className = "flex-1 py-2 text-sm font-medium rounded-lg transition-all bg-white shadow-sm text-neutral-900 cursor-pointer";
                tabLogin.className = "flex-1 py-2 text-sm font-medium rounded-lg transition-all text-neutral-500 hover:text-neutral-900 cursor-pointer";
            }
        }

        // Cute Popup Handler
        function showPopup(title, message, icon = '✨') {
            document.getElementById('popup-title').innerText = title;
            document.getElementById('popup-message').innerText = message;
            document.getElementById('popup-icon').innerText = icon;
            const modal = document.getElementById('cute-popup');
            modal.classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('popup-box').classList.remove('scale-95');
                document.getElementById('popup-box').classList.add('scale-100');
            }, 10);
        }

        function closePopup() {
            const modal = document.getElementById('cute-popup');
            document.getElementById('popup-box').classList.remove('scale-100');
            document.getElementById('popup-box').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 150);
        }

        // Generate 10-digit Unique Bank Account
        function generateBankAccount() {
            return Math.floor(1000000000 + Math.random() * 9000000000).toString();
        }

        // Handle Login
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                showPopup('สำเร็จ', 'เข้าสู่ระบบสำเร็จ กำลังพาเข้าสู่โลก POCKET DIARY...', '🎉');
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 1000);

            } catch (err) {
                showPopup('เกิดข้อผิดพลาด', err.message || 'อีเมลหรือรหัสผ่านไม่ถูกต้อง', '⚠️');
            }
        }

        // Handle Register (Without Email Confirmation)
        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const bankAccount = generateBankAccount();

            try {
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            display_name: name,
                            bank_account: bankAccount,
                            coins: 1000,
                            cookies: 10
                        }
                    }
                });

                if (error) throw error;

                const user = data.user;
                if (user) {
                    await supabase.from('users').upsert([
                        {
                            id: user.id,
                            username: name,
                            email: email,
                            bank_account: bankAccount,
                            coins: 1000,
                            cookies: 10
                        }
                    ]);
                }

                showPopup('สมัครสมาชิกสำเร็จ', 'ยินดีต้อนรับสู่ POCKET DIARY บัญชีของคุณพร้อมใช้งานแล้ว!', '💖');
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 1200);

            } catch (err) {
                showPopup('เกิดข้อผิดพลาด', err.message || 'ไม่สามารถสมัครสมาชิกได้', '⚠️');
            }
        }
    </script>
</body>
</html>
