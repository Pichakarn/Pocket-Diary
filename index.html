<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POCKET DIARY - เข้าสู่ระบบ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase SDK & Config Scripts (โหลดไว้ที่ Header เพื่อให้ตัวแปร supabase พร้อมใช้งานก่อน Script อื่นเสมอ) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fbfbfb;
            color: #1a1a1a;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            overscroll-behavior-y: auto;
            touch-action: pan-y;
        }
        .royal-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .royal-btn {
            background: #111111;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .royal-btn:hover {
            background: #2d2d2d;
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex items-center justify-center p-4 select-none">

    <!-- กรอบหลักล็อกอิน / สมัครสมาชิก -->
    <div class="royal-card w-full max-w-sm rounded-3xl p-6 shadow-xl space-y-6">
        
        <!-- ส่วนหัว -->
        <div class="text-center space-y-2">
            <h1 class="font-bold text-xl text-neutral-900 tracking-wide">POCKET DIARY</h1>
            <p class="text-xs text-neutral-500">ยินดีต้อนรับสู่โลกแห่งความทรงจำและตัวละครของคุณ</p>
        </div>

        <!-- ฟอร์มเข้าสู่ระบบ / สมัครสมาชิก -->
        <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
            <div class="space-y-1">
                <label class="text-[11px] font-bold text-neutral-700 ml-1">อีเมล</label>
                <input type="email" id="email" required class="w-full px-4 py-3 bg-neutral-50 border border-neutral-200 rounded-2xl text-xs focus:outline-none focus:border-neutral-900 transition-colors">
            </div>

            <div class="space-y-1">
                <label class="text-[11px] font-bold text-neutral-700 ml-1">รหัสผ่าน</label>
                <input type="password" id="password" required class="w-full px-4 py-3 bg-neutral-50 border border-neutral-200 rounded-2xl text-xs focus:outline-none focus:border-neutral-900 transition-colors">
            </div>

            <!-- ช่อง Username และ Display Name เฉพาะตอนสมัครสมาชิกใหม่ -->
            <div id="register-fields" class="space-y-4 hidden">
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-neutral-700 ml-1">ชื่อที่แสดง (Display Name)</label>
                    <input type="text" id="display_name" class="w-full px-4 py-3 bg-neutral-50 border border-neutral-200 rounded-2xl text-xs focus:outline-none focus:border-neutral-900 transition-colors">
                </div>
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-neutral-700 ml-1">ชื่อผู้ใช้ (username)</label>
                    <input type="text" id="username" class="w-full px-4 py-3 bg-neutral-50 border border-neutral-200 rounded-2xl text-xs focus:outline-none focus:border-neutral-900 transition-colors">
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full py-3.5 rounded-2xl text-xs font-bold royal-btn shadow-md cursor-pointer">
                เข้าสู่ระบบ
            </button>
        </form>

        <!-- สลับโหมด เข้าสู่ระบบ / สมัครสมาชิก -->
        <div class="text-center pt-2">
            <button type="button" onclick="toggleAuthMode()" id="toggle-mode-btn" class="text-[11px] text-neutral-500 hover:text-neutral-900 font-semibold transition-colors cursor-pointer">
                ยังไม่มีบัญชีใช่ไหม? สมัครสมาชิก
            </button>
        </div>

    </div>

    <!-- Popup แจ้งเตือนน่ารักๆ แทน alert ปกติ -->
    <div id="alert-popup" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden" style="background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);">
        <div class="royal-card w-full max-w-xs rounded-3xl p-6 relative flex flex-col items-center shadow-2xl text-center space-y-3 bg-white">
            <div id="alert-icon" class="text-3xl mb-1">✨</div>
            <h3 id="alert-title" class="font-bold text-sm text-neutral-900">แจ้งเตือน</h3>
            <p id="alert-message" class="text-xs text-neutral-600">ข้อความแจ้งเตือน</p>
            <button onclick="closeAlertPopup()" class="w-full py-2.5 rounded-xl text-xs font-bold royal-btn cursor-pointer mt-2">ตกลง</button>
        </div>
    </div>

    <script>
        let isRegisterMode = false;

        async function checkExistingSession() {
            if (typeof supabase !== 'undefined') {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    window.location.href = 'home.html';
                }
            }
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            const registerFields = document.getElementById('register-fields');
            const submitBtn = document.getElementById('submit-btn');
            const toggleBtn = document.getElementById('toggle-mode-btn');

            if (isRegisterMode) {
                registerFields.classList.remove('hidden');
                document.getElementById('display_name').required = true;
                document.getElementById('username').required = true;
                submitBtn.innerText = 'สมัครสมาชิก';
                toggleBtn.innerText = 'มีบัญชีอยู่แล้ว? เข้าสู่ระบบ';
            } else {
                registerFields.classList.add('hidden');
                document.getElementById('display_name').required = false;
                document.getElementById('username').required = false;
                submitBtn.innerText = 'เข้าสู่ระบบ';
                toggleBtn.innerText = 'ยังไม่มีบัญชีใช่ไหม? สมัครสมาชิก';
            }
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                if (isRegisterMode) {
                    const displayName = document.getElementById('display_name').value.trim();
                    const username = document.getElementById('username').value.trim();

                    const { data: authData, error: authError } = await supabase.auth.signUp({
                        email,
                        password
                    });

                    if (authError) {
                        showAlert('สมัครสมาชิกไม่สำเร็จ', authError.message, '❌');
                        return;
                    }

                    if (authData.user) {
                        const userId = authData.user.id;
                        const accountNumber = Math.floor(1000000000 + Math.random() * 9000000000).toString();
                        const isAdmin = (email === 'ciiderydem@gmail.com');

                        const { error: profileError } = await supabase.from('users').insert({
                            id: userId,
                            email: email,
                            username: username,
                            display_name: displayName,
                            account_number: accountNumber,
                            account_name: displayName,
                            coins: 1000,
                            cookies: 10,
                            is_admin: isAdmin
                        });

                        if (profileError) {
                            showAlert('สร้างโปรไฟล์ไม่สำเร็จ', profileError.message, '❌');
                            return;
                        }

                        showAlert('สำเร็จ!', 'สมัครสมาชิกเรียบร้อย กำลังเข้าสู่เกม...', '🎉');
                        setTimeout(() => {
                            window.location.href = 'home.html';
                        }, 1200);
                    }
                } else {
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email,
                        password
                    });

                    if (error) {
                        showAlert('เข้าสู่ระบบไม่สำเร็จ', error.message, '🔒');
                        return;
                    }

                    if (data.session) {
                        window.location.href = 'home.html';
                    }
                }
            } catch (err) {
                showAlert('เกิดข้อผิดพลาด', err.message || 'Unknown error', '⚠️');
            }
        }

        function showAlert(title, message, icon = '✨') {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            document.getElementById('alert-icon').innerText = icon;
            document.getElementById('alert-popup').classList.remove('hidden');
        }

        function closeAlertPopup() {
            document.getElementById('alert-popup').classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', checkExistingSession);
    </script>
</body>
</html>
