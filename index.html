<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Diary - Cozy Gacha</title>
    <!-- Tailwind CSS สำหรับจัดหน้าเว็บ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1p:wght@400;700&display=swap');
        body {
            font-family: 'M PLUS Rounded 1p', sans-serif;
            background-color: #fdf6f0;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between relative select-none">

    <!-- ส่วนหัว: แสดงชื่อเกมและทรัพยากร/เงิน -->
    <header class="flex justify-between items-center p-4 bg-white/60 backdrop-blur-md shadow-sm z-10">
        <div class="flex items-center gap-2">
            <span class="text-2xl">📖</span>
            <h1 class="font-bold text-lg text-pink-600">Pocket Diary</h1>
        </div>
        <div class="flex gap-3 text-sm font-semibold text-gray-700">
            <div class="bg-pink-100 px-3 py-1 rounded-full flex items-center gap-1 shadow-inner">
                <span>🪙</span> <span id="gold-count">10,000</span>
            </div>
            <div class="bg-purple-100 px-3 py-1 rounded-full flex items-center gap-1 shadow-inner">
                <span>🧂</span> <span id="shard-count">250</span>
            </div>
        </div>
    </header>

    <!-- หน้าจอหลัก (Room View): ตัวละครยืนเด่นตรงกลาง -->
    <main class="flex-1 flex flex-col items-center justify-center relative">
        <div class="relative w-64 h-96 flex items-center justify-center">
            <!-- ภาพนิ่งตัวละครปกติ -->
            <div id="character-display" class="w-full h-full bg-pink-50 rounded-3xl border-4 border-pink-200 flex items-center justify-center shadow-lg cursor-pointer overflow-hidden" onclick="openCollectionModal()">
                <span class="text-gray-400 text-sm">✨ แตะเพื่อเปิดสมุดสะสม ✨</span>
            </div>

            <!-- วิดีโอแสดงผลสำหรับสกินระดับ SR/SSR (ซ่อนไว้เริ่มต้น) -->
            <video id="skin-video" class="absolute inset-0 w-full h-full object-cover rounded-3xl border-4 border-purple-400 hidden" muted playsinline></video>
        </div>
        <p class="mt-4 text-xs text-gray-400">แตะที่ตัวละครเพื่อเปิดสมุดภาพคอลเลกชัน</p>
    </main>

    <!-- ปุ่มลัดเข้าสู่ระบบหลัก (Floating Buttons ด้านข้าง/ด้านล่าง) -->
    <div class="absolute bottom-6 left-6 flex flex-col gap-3 z-10">
        <button onclick="openGacha()" class="bg-pink-500 hover:bg-pink-600 text-white font-bold p-4 rounded-full shadow-lg transition transform hover:scale-105 flex items-center justify-center text-xl">
            🎁
        </button>
        <button onclick="openMinigame()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold p-4 rounded-full shadow-lg transition transform hover:scale-105 flex items-center justify-center text-xl">
            🎮
        </button>
    </div>

    <!-- ปุ่มเปิดสมาร์ทโฟน (มุมขวาล่าง) -->
    <div class="absolute bottom-6 right-6 z-10">
        <button onclick="openSmartphone()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-3 rounded-2xl shadow-xl transition transform hover:scale-105 flex items-center gap-2">
            <span>📱</span> สมาร์ทโฟน
        </button>
    </div>

    <!-- โครงสร้างหน้าต่างจำลองสมาร์ทโฟน (ซ่อนไว้เริ่มต้น) -->
    <div id="smartphone-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-md h-[80vh] rounded-[40px] shadow-2xl flex flex-col overflow-hidden border-8 border-gray-800 relative">
            <!-- แถบด้านบนมือถือ -->
            <div class="bg-gray-800 text-white px-6 py-2 flex justify-between items-center text-xs">
                <span>13:36</span>
                <div class="w-16 h-4 bg-black rounded-full mx-auto"></div>
                <span>5G 🔋</span>
            </div>
            <!-- เนื้อหาภายในแอปมือถือ -->
            <div class="flex-1 p-6 overflow-y-auto bg-gray-50">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-gray-800">Apps</h2>
                    <button onclick="closeSmartphone()" class="text-gray-400 hover:text-gray-600 font-bold">✕ ปิด</button>
                </div>
                <div class="grid grid-cols-3 gap-4 text-center">
                    <div onclick="alert('เปิดระบบเพื่อน & แชท')" class="bg-pink-100 p-4 rounded-2xl cursor-pointer hover:bg-pink-200 transition">
                        <span class="text-2xl">👥</span>
                        <p class="text-xs mt-1 font-semibold text-gray-700">เพื่อน</p>
                    </div>
                    <div onclick="alert('เปิดระบบธนาคาร')" class="bg-blue-100 p-4 rounded-2xl cursor-pointer hover:bg-blue-200 transition">
                        <span class="text-2xl">🏦</span>
                        <p class="text-xs mt-1 font-semibold text-gray-700">ธนาคาร</p>
                    </div>
                    <div onclick="alert('เปิดร้านค้า')" class="bg-green-100 p-4 rounded-2xl cursor-pointer hover:bg-green-200 transition">
                        <span class="text-2xl">🛍️</span>
                        <p class="text-xs mt-1 font-semibold text-gray-700">ร้านค้า</p>
                    </div>
                    <div onclick="alert('เปิดหน้ากรอกโค้ด')" class="bg-yellow-100 p-4 rounded-2xl cursor-pointer hover:bg-yellow-200 transition">
                        <span class="text-2xl">🎟️</span>
                        <p class="text-xs mt-1 font-semibold text-gray-700">เติมโค้ด</p>
                    </div>
                    <!-- แอป Admin (จำลองเงื่อนไขการแสดงผลเฉพาะแอดมิน) -->
                    <div onclick="alert('เปิดหลังบ้าน Admin')" class="bg-red-100 p-4 rounded-2xl cursor-pointer hover:bg-red-200 transition">
                        <span class="text-2xl">🛠️</span>
                        <p class="text-xs mt-1 font-semibold text-gray-700">Admin</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script ควบคุมการทำงานเบื้องต้น -->
    <script>
        function openSmartphone() {
            document.getElementById('smartphone-modal').classList.remove('hidden');
            document.getElementById('smartphone-modal').classList.add('flex');
        }

        function closeSmartphone() {
            document.getElementById('smartphone-modal').classList.remove('flex');
            document.getElementById('smartphone-modal').classList.add('hidden');
        }

        function openGacha() {
            alert('กำลังเปิดหน้าตู้สุ่มกาชา...');
        }

        function openMinigame() {
            alert('กำลังเปิดมินิเกมหาเงิน...');
        }

        function openCollectionModal() {
            // จำลองตัวอย่างการกดดูสกินระดับ SR/SSR ที่จะเล่นวิดีโอก่อนแสดงภาพนิ่ง
            // ถ้าระดับเป็น B, A, S ข้ามวิดีโอแล้วแสดงภาพปกติได้ทันที
            let isHighTier = confirm("จำลองการเลือกดูสกิน: กด 'OK' เพื่อดูสกินระดับ SR/SSR (เล่นวิดีโอ) หรือ 'Cancel' เพื่อดูสกินระดับ S ลงมา");
            
            const characterDisplay = document.getElementById('character-display');
            const skinVideo = document.getElementById('skin-video');

            if (isHighTier) {
                // สมมติตั้งลิงก์วิดีโอสั้นตัวอย่าง
                skinVideo.src = "https://www.w3schools.com/html/mov_bbb.mp4"; 
                skinVideo.classList.remove('hidden');
                characterDisplay.classList.add('hidden');
                
                skinVideo.play();

                // เมื่อวิดีโอเล่นจบ ให้ซ่อนวิดีโอแล้วกลับมาแสดงภาพนิ่งเหมือนเดิมอัตโนมัติ
                skinVideo.onended = function() {
                    skinVideo.classList.add('hidden');
                    characterDisplay.classList.remove('hidden');
                };
            } else {
                alert("แสดงผลสกินระดับ B / A / S (แสดงภาพนิ่งปกติทันที ไม่มีวิดีโอ)");
            }
        }
    </script>
</body>
</html>
