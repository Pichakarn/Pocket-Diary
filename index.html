<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POCKET DIARY - เข้าสู่ระบบ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fbfbfb;
            color: #1a1a1a;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        .royal-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .royal-btn {
            background: #111111;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .royal-btn:hover {
            background: #2d2d2d;
        }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center p-4">

    <div class="royal-card w-full max-w-sm rounded-3xl p-6 shadow-xl space-y-6">
        <div class="text-center space-y-1">
            <h1 id="form-title" class="font-bold text-xl text-neutral-900">POCKET DIARY</h1>
            <p class="text-xs text-neutral-500">ยินดีต้อนรับสู่โลกแห่งความทรงจำและตัวละครของคุณ</p>
        </div>

        <form id="authForm" onsubmit="handleSubmit(event)" class="space-y-4">
            <div>
                <label class="block text-[11px] font-bold text-neutral-700 mb-1 ml-1">อีเมล</label>
                <input type="email" id="email" required placeholder="example@email.com" class="w-full px-4 py-3 bg-neutral-50 border border-neutral-200 rounded-2xl text-xs focus:outline-none focus:border-neutral-900">
            </div>

            <div>
                <label class="block text-[11px] font-bold text-neutral-700 mb-1 ml-1">รหัสผ่าน</label>
                <input type="password" id="password" required placeholder="********" class="w-full px-4 py-3 bg-neutral-50 border border-neutral-200 rounded-2xl text-xs focus:outline-none focus:border-neutral-900">
            </div>

            <div id="extraFields" class="space-y-4 hidden">
                <div>
                    <label class="block text-[11px] font-bold text-neutral-700 mb-1 ml-1">ชื่อที่แสดง (Display Name)</label>
                    <input type="text" id="display_name" placeholder="ชื่อในเกม" class="w-full px-4 py-3 bg-neutral-50 border border-neutral-200 rounded-2xl text-xs focus:outline-none focus:border-neutral-900">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-neutral-700 mb-1 ml-1">ชื่อผู้ใช้ (Username)</label>
                    <input type="text" id="username" placeholder="username123" class="w-full px-4 py-3 bg-neutral-50 border border-neutral-200 rounded-2xl text-xs focus:outline-none focus:border-neutral-900">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3.5 rounded-2xl text-xs font-bold royal-btn shadow-md cursor-pointer">
                เข้าสู่ระบบ
            </button>
        </form>

        <div class="text-center pt-1">
            <button type="button" onclick="toggleMode()" id="toggleBtn" class="text-[11px] text-neutral-500 hover:text-neutral-900 font-semibold cursor-pointer">
                ยังไม่มีบัญชีใช่ไหม? สมัครสมาชิก
            </button>
        </div>
    </div>

    <!-- Popup แจ้งเตือน -->
    <div id="popup" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden" style="background: rgba(0,0,0,0.5);">
        <div class="royal-card w-full max-w-xs rounded-3xl p-6 text-center space-y-3 bg-white">
            <div id="popupIcon" class="text-3xl">✨</div>
            <h3 id="popupTitle" class="font-bold text-sm text-neutral-900">แจ้งเตือน</h3>
            <p id="popupMsg" class="text-xs text-neutral-600">-</p>
            <button type="button" onclick="closePopup()" class="w-full py-2.5 rounded-xl text-xs font-bold royal-btn cursor-pointer">ตกลง</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ooozqddxvxeykwubumli.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_xwsBeo4TJfLSwnQUiV2uSw_7GwLZd85';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isRegister = false;

        function toggleMode() {
            isRegister = !isRegister;
            const extra = document.getElementById('extraFields');
            const submitBtn = document.getElementById('submitBtn');
            const toggleBtn = document.getElementById('toggleBtn');
            const title = document.getElementById('form-title');

            if (isRegister) {
                extra.classList.remove('hidden');
                document.getElementById('display_name').required = true;
                document.getElementById('username').required = true;
                submitBtn.innerText = 'สมัครสมาชิก';
                toggleBtn.innerText = 'มีบัญชีอยู่แล้ว? เข้าสู่ระบบ';
                title.innerText = 'สมัครสมาชิก POCKET DIARY';
            } else {
                extra.classList.add('hidden');
                document.getElementById('display_name').required = false;
                document.getElementById('username').required = false;
                submitBtn.innerText = 'เข้าสู่ระบบ';
                toggleBtn.innerText = 'ยังไม่มีบัญชีใช่ไหม? สมัครสมาชิก';
                title.innerText = 'POCKET DIARY';
            }
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                if (isRegister) {
                    const display_name = document.getElementById('display_name').value.trim();
                    const username = document.getElementById('username').value.trim();

                    const { data, error } = await supabase.auth.signUp({
                        email,
                        password
                    });

                    if (error) {
                        showPopup('สมัครไม่สำเร็จ', error.message, '❌');
                        return;
                    }

                    if (data.user) {
                        const accountNumber = Math.floor(1000000000 + Math.random() * 9000000000).toString();
                        const isAdmin = (email === 'ciiderydem@gmail.com');

                        const { error: dbError } = await supabase.from('users').insert({
                            id: data.user.id,
                            email: email,
                            username: username,
                            display_name: display_name,
                            account_number: accountNumber,
                            account_name: display_name,
                            coins: 1000,
                            cookies: 10,
                            is_admin: isAdmin
                        });

                        if (dbError) {
                            showPopup('บันทึกโปรไฟล์ไม่สำเร็จ', dbError.message, '⚠️');
                            return;
                        }

                        showPopup('สำเร็จ', 'สมัครสมาชิกเรียบร้อย กำลังเข้าเกม...', '🎉');
                        setTimeout(() => window.location.href = 'home.html', 1000);
                    }
                } else {
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email,
                        password
                    });

                    if (error) {
                        showPopup('เข้าสู่ระบบไม่สำเร็จ', 'อีเมลหรือรหัสผ่านไม่ถูกต้อง', '🔒');
                        return;
                    }

                    if (data.session) {
                        window.location.href = 'home.html';
                    }
                }
            } catch (err) {
                showPopup('เกิดข้อผิดพลาด', err.message, '⚠️');
            }
        }

        function showPopup(title, msg, icon) {
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupMsg').innerText = msg;
            document.getElementById('popupIcon').innerText = icon;
            document.getElementById('popup').classList.remove('hidden');
        }

        function closePopup() {
            document.getElementById('popup').classList.add('hidden');
        }
    </script>
</body>
</html>
