<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POCKET DIARY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #f0f7ff 50%, #fdf2f8 100%);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(224, 231, 255, 0.6);
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.95);
            border-color: #f472b6;
            box-shadow: 0 0 0 4px rgba(244, 114, 182, 0.12);
        }
    </style>
    <script type="module">
        import { supabase } from './supabase-config.js';

        // ตรวจสอบสถานะ Session ผ่าน Supabase Auth ทันทีที่โหลดหน้าเว็บ
        async function checkUserSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.replace('home.html');
            }
        }
        checkUserSession();
    </script>
</head>
<body class="min-h-screen w-full flex items-center justify-center p-4 text-gray-700">

    <div class="w-full max-w-md flex flex-col items-center py-10 px-6">
        <!-- ไอคอนและชื่อโปรเจค -->
        <div class="w-20 h-20 rounded-3xl bg-white/90 shadow-xl shadow-pink-100/50 flex items-center justify-center text-3xl mb-4 border border-pink-100/60 transform hover:scale-105 transition duration-300">
            📖
        </div>
        <h1 id="form-title" class="text-2xl font-bold text-gray-800 tracking-wider mb-1">เข้าสู่ระบบ</h1>
        <p class="text-gray-400 text-xs text-center mb-8">POCKET DIARY - สมุดบันทึกความทรงจำและฮีลใจส่วนตัว</p>

        <!-- ฟอร์มหลัก -->
        <form id="auth-form" class="w-full space-y-4">
            <div>
                <label class="block text-gray-500 text-xs font-medium mb-1.5 tracking-wide">อีเมล (Email)</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-3.5 glass-input rounded-2xl focus:outline-none text-gray-700 text-sm placeholder-gray-300"
                    placeholder="name@example.com">
            </div>
            <div>
                <label class="block text-gray-500 text-xs font-medium mb-1.5 tracking-wide">รหัสผ่าน (Password)</label>
                <input type="password" id="password" required minlength="6"
                    class="w-full px-4 py-3.5 glass-input rounded-2xl focus:outline-none text-gray-700 text-sm placeholder-gray-300"
                    placeholder="อย่างน้อย 6 ตัวอักษร">
            </div>
            <div class="pt-2">
                <button type="submit" id="submit-btn"
                    class="w-full py-3.5 bg-gradient-to-r from-sky-400 via-pink-400 to-pink-500 hover:from-sky-500 hover:to-pink-600 text-white font-medium text-sm rounded-2xl transition duration-300 shadow-lg shadow-pink-200/50 cursor-pointer active:scale-98">
                    เข้าสู่ระบบ
                </button>
            </div>
        </form>

        <!-- สลับโหมด เข้าสู่ระบบ / สมัครสมาชิก -->
        <div class="mt-8 text-center text-xs text-gray-400">
            <span id="toggle-text">ยังไม่มีบัญชีใช่ไหม?</span> 
            <button type="button" id="toggle-mode-btn" class="text-pink-500 font-semibold hover:underline ml-1 cursor-pointer">สมัครสมาชิก</button>
        </div>
    </div>

    <!-- Modal แจ้งเตือน (Popup) สวยๆ งามๆ -->
    <div id="custom-popup" class="fixed inset-0 bg-black/20 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50 transition-opacity">
        <div class="bg-white/95 border border-pink-100 w-full max-w-xs rounded-3xl p-6 text-center shadow-2xl transform scale-95 transition-transform" id="popup-box">
            <div id="popup-icon" class="text-4xl mb-3">✨</div>
            <h3 id="popup-title" class="font-bold text-gray-700 text-base mb-1">แจ้งเตือน</h3>
            <p id="popup-message" class="text-gray-500 text-xs mb-5 leading-relaxed">ข้อความแจ้งเตือน...</p>
            <button type="button" id="popup-close-btn" class="w-full py-2.5 bg-pink-100 hover:bg-pink-200 text-pink-600 font-semibold text-xs rounded-xl transition cursor-pointer">
                ตกลง
            </button>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase-config.js';

        const authForm = document.getElementById('auth-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submit-btn');
        const formTitle = document.getElementById('form-title');
        const toggleText = document.getElementById('toggle-text');
        const toggleModeBtn = document.getElementById('toggle-mode-btn');

        const popup = document.getElementById('custom-popup');
        const popupBox = document.getElementById('popup-box');
        const popupIcon = document.getElementById('popup-icon');
        const popupTitle = document.getElementById('popup-title');
        const popupMessage = document.getElementById('popup-message');
        const popupCloseBtn = document.getElementById('popup-close-btn');

        let isRegisterMode = false;
        let onPopupCloseCallback = null;

        function showPopup(icon, title, message, callback = null) {
            popupIcon.textContent = icon;
            popupTitle.textContent = title;
            popupMessage.textContent = message;
            onPopupCloseCallback = callback;
            popup.classList.remove('hidden');
            setTimeout(() => {
                popupBox.classList.remove('scale-95');
                popupBox.classList.add('scale-100');
            }, 10);
        }

        function hidePopup() {
            popupBox.classList.remove('scale-100');
            popupBox.classList.add('scale-95');
            setTimeout(() => {
                popup.classList.add('hidden');
                if (onPopupCloseCallback) {
                    onPopupCloseCallback();
                    onPopupCloseCallback = null;
                }
            }, 120);
        }

        popupCloseBtn.addEventListener('click', hidePopup);

        // สลับโหมดระหว่าง เข้าสู่ระบบ และ สมัครสมาชิก
        toggleModeBtn.addEventListener('click', () => {
            isRegisterMode = !isRegisterMode;
            if (isRegisterMode) {
                formTitle.textContent = 'สมัครสมาชิก';
                submitBtn.textContent = 'สมัครสมาชิก';
                toggleText.textContent = 'มีบัญชีอยู่แล้วใช่ไหม?';
                toggleModeBtn.textContent = 'เข้าสู่ระบบ';
            } else {
                formTitle.textContent = 'เข้าสู่ระบบ';
                submitBtn.textContent = 'เข้าสู่ระบบ';
                toggleText.textContent = 'ยังไม่มีบัญชีใช่ไหม?';
                toggleModeBtn.textContent = 'สมัครสมาชิก';
            }
        });

        // จัดการเมื่อกดปุ่ม Submit (เข้าสู่ระบบ หรือ สมัครสมาชิกผ่าน Supabase Auth)
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'กำลังดำเนินการ...';

            try {
                if (isRegisterMode) {
                    // สมัครสมาชิกผ่าน Supabase Auth
                    const { data, error } = await supabase.auth.signUp({
                        email: email,
                        password: password,
                        options: {
                            data: {
                                role: (email === 'ciiderydem@gmail.com') ? 'admin' : 'user'
                            }
                        }
                    });

                    if (error) {
                        throw error;
                    }

                    showPopup('🎉', 'สมัครสมาชิกสำเร็จ!', 'ยินดีต้อนรับสู่ POCKET DIARY ค่า', () => {
                        window.location.href = 'home.html';
                    });

                } else {
                    // จัดการกรณีพิเศษ แอดมิน (สร้าง Session จริงผ่าน Supabase Auth)
                    if (email === 'ciiderydem@gmail.com' && password === 'adminciily') {
                        // พยายามเข้าสู่ระบบปกติก่อน ถ้ายังไม่มีบัญชีในระบบ Auth ให้ทำการสมัครให้อัตโนมัติเพื่อให้ได้ Session จริง
                        const { error: signInError } = await supabase.auth.signInWithPassword({ email, password });
                        if (signInError) {
                            await supabase.auth.signUp({
                                email: email,
                                password: password,
                                options: { data: { role: 'admin' } }
                            });
                            await supabase.auth.signInWithPassword({ email, password });
                        }

                        showPopup('🛠️', 'ยินดีต้อนรับท่านแอดมิน!', 'เข้าสู่ระบบสำเร็จ กำลังไปหน้าหลัก...', () => {
                            window.location.href = 'home.html';
                        });
                        return;
                    }

                    // เข้าสู่ระบบผ่าน Supabase Auth ปกติ
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                    if (error || !data.session) {
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'เข้าสู่ระบบ';
                        showPopup('🥺', 'เข้าสู่ระบบไม่สำเร็จ', 'อีเมลหรือรหัสผ่านไม่ถูกต้อง หรือยังไม่ได้สมัครสมาชิก');
                        return;
                    }

                    showPopup('💖', 'ยินดีต้อนรับกลับมานะ!', 'กำลังเข้าสู่หน้าหลัก...', () => {
                        window.location.href = 'home.html';
                    });
                }
            } catch (err) {
                console.error(err);
                submitBtn.disabled = false;
                submitBtn.textContent = isRegisterMode ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ';
                showPopup('⚠️', 'เกิดข้อผิดพลาด', err.message || 'ไม่สามารถเชื่อมต่อกับฐานข้อมูลได้ โปรดลองใหม่อีกครั้ง');
            }
        });
    </script>
</body>
</html>
