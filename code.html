<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POCKET DIARY - กรอกโค้ด</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fbfbfb;
            color: #1a1a1a;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            overscroll-behavior-y: auto;
            touch-action: pan-y;
        }
        .royal-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .royal-btn {
            background: #111111;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .royal-btn:hover {
            background: #2d2d2d;
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex flex-col justify-between select-none">

    <!-- Header -->
    <div class="relative z-20 p-4 max-w-lg mx-auto w-full flex flex-col gap-3">
        <div class="flex items-center justify-between">
            <button onclick="window.location.href='phone.html'" class="royal-card px-4 py-2 rounded-2xl text-xs font-semibold flex items-center gap-2 cursor-pointer shadow-sm">
                <span>←</span> กลับโทรศัพท์
            </button>
            <h1 class="font-bold text-base text-neutral-900 flex items-center gap-2">
                <span>🎁</span> กรอกโค้ดรับรางวัล
            </h1>
            <div class="w-20"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="relative z-10 flex-1 max-w-lg mx-auto w-full p-4 flex flex-col justify-center items-center">
        <div class="royal-card w-full rounded-3xl p-6 space-y-4 text-center shadow-xl">
            <div class="w-20 h-20 bg-neutral-900 text-white rounded-2xl mx-auto flex items-center justify-center text-3xl shadow-md">
                🎁
            </div>
            <div>
                <h3 class="font-bold text-sm text-neutral-900">เติมโค้ดไอเท็ม / ของรางวัล</h3>
                <p class="text-[11px] text-neutral-500 mt-1">กรอกโค้ดลับเพื่อรับเหรียญ, คุกกี้ หรือไอเท็มพิเศษเข้าบัญชีของคุณ</p>
            </div>

            <div class="space-y-3 pt-2">
                <input type="text" id="redeem-code-input" placeholder="พิมพ์โค้ดของคุณที่นี่..." class="w-full bg-neutral-50 border border-neutral-200 rounded-2xl px-4 py-3 text-xs text-center text-neutral-900 font-bold uppercase tracking-wider focus:outline-none focus:border-neutral-900">
                <button onclick="redeemCode()" class="w-full py-3 rounded-2xl text-xs font-bold royal-btn cursor-pointer shadow-md">
                    ยืนยันการรับรางวัล
                </button>
            </div>
        </div>
    </div>

    <!-- Popup แจ้งเตือน -->
    <div id="alert-popup" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden" style="background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);">
        <div class="royal-card w-full max-w-xs rounded-3xl p-6 relative flex flex-col items-center shadow-2xl text-center space-y-3">
            <div id="alert-icon" class="text-3xl mb-1">✨</div>
            <h3 id="alert-title" class="font-bold text-sm text-neutral-900">แจ้งเตือน</h3>
            <p id="alert-message" class="text-xs text-neutral-600">ข้อความแจ้งเตือน</p>
            <button onclick="closeAlertPopup()" class="w-full py-2 rounded-xl text-xs font-bold royal-btn cursor-pointer mt-2">ตกลง</button>
        </div>
    </div>

    <!-- Supabase & Config Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        let currentUserId = null;

        async function initCodePage() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            currentUserId = session.user.id;
        }

        async function redeemCode() {
            const codeInput = document.getElementById('redeem-code-input');
            const codeStr = codeInput.value.trim().toUpperCase();
            if (!codeStr) {
                showAlert('กรอกข้อมูลไม่ครบ', 'กรุณากรอกโค้ดก่อนกดรับรางวัล', '⚠️');
                return;
            }

            try {
                // ค้นหาโค้ดในตาราง promo_codes
                const { data: promo, error: promoErr } = await supabase
                    .from('promo_codes')
                    .select('*')
                    .eq('code', codeStr)
                    .single();

                if (promoErr || !promo) {
                    showAlert('โค้ดไม่ถูกต้อง', 'ไม่พบโค้ดนี้ในระบบ หรือโค้ดอาจหมดอายุแล้ว', '❌');
                    return;
                }

                // ตรวจสอบว่าผู้ใช้เคยใช้โค้ดนี้หรือยัง
                const { data: used } = await supabase
                    .from('redeemed_codes')
                    .select('*')
                    .eq('user_id', currentUserId)
                    .eq('code_id', promo.id)
                    .single();

                if (used) {
                    showAlert('คุณเคยใช้โค้ดนี้แล้ว', 'คุณได้ทำการกรอกโค้ดนี้ไปแล้ว ไม่สามารถใช้งานซ้ำได้', '📌');
                    return;
                }

                // บันทึกการใช้งานโค้ด
                await supabase.from('redeemed_codes').insert([{
                    user_id: currentUserId,
                    code_id: promo.id
                }]);

                // แจกรางวัลตามประเภท
                const { reward_type, reward_value, reward_amount, image_url, name } = promo;
                const { data: userAcc } = await supabase.from('users').select('coins, cookies').eq('id', currentUserId).single();

                if (reward_type === 'coins') {
                    await supabase.from('users').update({ coins: (userAcc.coins || 0) + (reward_amount || 0) }).eq('id', currentUserId);
                } else if (reward_type === 'cookies') {
                    await supabase.from('users').update({ cookies: (userAcc.cookies || 0) + (reward_amount || 0) }).eq('id', currentUserId);
                } else if (reward_type === 'character') {
                    await supabase.from('user_characters').insert([{
                        user_id: currentUserId,
                        character_name: name || reward_value,
                        skin_rank: 'B',
                        image_url: image_url || 'https://via.placeholder.com/150',
                        full_image_url: image_url || 'https://via.placeholder.com/150'
                    }]);
                } else if (reward_type === 'item') {
                    await supabase.from('user_items').insert([{
                        user_id: currentUserId,
                        name: name || reward_value,
                        image_url: image_url || 'https://via.placeholder.com/150',
                        type: 'ไอเท็มพิเศษ',
                        property: 'ได้รับจากโค้ดกิจกรรม'
                    }]);
                }

                showAlert('รับรางวัลสำเร็จ! 🎉', `คุณได้รับ ${name || reward_value} เรียบร้อยแล้ว`, '🎁');
                codeInput.value = '';
            } catch (err) {
                console.error('Error redeeming code:', err.message);
                showAlert('เกิดข้อผิดพลาด', err.message, '❌');
            }
        }

        function showAlert(title, message, icon = '✨') {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            document.getElementById('alert-icon').innerText = icon;
            document.getElementById('alert-popup').classList.remove('hidden');
        }

        function closeAlertPopup() {
            document.getElementById('alert-popup').classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', initCodePage);
    </script>
</body>
</html>
