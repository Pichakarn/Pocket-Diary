<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POCKET DIARY - ร้านค้า</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fbfbfb;
            color: #1a1a1a;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            overscroll-behavior-y: auto;
        }
        .royal-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .royal-btn {
            background: #111111;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .royal-btn:hover {
            background: #2d2d2d;
            transform: translateY(-1px);
        }
        .tab-active {
            background: #111111 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex flex-col justify-between select-none">

    <!-- Top Navigation Bar & Currency Display -->
    <div class="relative z-20 p-4 max-w-lg mx-auto w-full flex flex-col gap-3">
        <div class="flex items-center justify-between">
            <button onclick="window.location.href='phone.html'" class="royal-card px-4 py-2 rounded-2xl text-xs font-semibold flex items-center gap-2 cursor-pointer shadow-sm">
                <span>←</span> กลับโทรศัพท์
            </button>
            <h1 class="font-bold text-base text-neutral-900 flex items-center gap-2">
                <span>🛍️</span> ร้านค้าพกพา
            </h1>
            <div class="flex items-center gap-3 royal-card px-3 py-1.5 rounded-2xl text-xs font-bold">
                <span class="flex items-center gap-1">🪙 <span id="store-coins">0</span></span>
                <span class="flex items-center gap-1">🍪 <span id="store-cookies">0</span></span>
            </div>
        </div>

        <!-- หมวดหมู่ Store: กาชา, พื้นหลัง, ไอเท็มพิเศษ -->
        <div class="grid grid-cols-3 gap-2">
            <button onclick="switchStoreTab('gacha')" id="btn-gacha" class="tab-active py-2.5 rounded-2xl text-xs font-semibold royal-card transition-all cursor-pointer text-center shadow-sm">
                🎰 สุ่มกาชา
            </button>
            <button onclick="switchStoreTab('background')" id="btn-background" class="py-2.5 rounded-2xl text-xs font-semibold royal-card transition-all cursor-pointer text-center shadow-sm">
                🖼️ พื้นหลัง
            </button>
            <button onclick="switchStoreTab('item')" id="btn-item" class="py-2.5 rounded-2xl text-xs font-semibold royal-card transition-all cursor-pointer text-center shadow-sm">
                📦 ไอเท็ม
            </button>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="relative z-10 flex-1 max-w-lg mx-auto w-full p-4 overflow-y-auto pb-8">
        
        <!-- หมวด 1: สุ่มกาชา (Gacha Section) -->
        <div id="section-gacha" class="space-y-4">
            <div class="royal-card rounded-3xl p-6 shadow-xl flex flex-col items-center text-center relative overflow-hidden bg-gradient-to-br from-indigo-900 to-purple-900 text-white">
                <div class="absolute -right-10 -bottom-10 text-9xl opacity-10">🎰</div>
                <div class="text-4xl mb-2">🎁</div>
                <h3 class="font-bold text-base mb-1">ตู้สุ่มกาชาพิเศษ</h3>
                <p class="text-xs text-indigo-200 mb-6">ลุ้นรับสกินตัวละครและไอเท็มหายากระดับ SSR!</p>
                <div class="grid grid-cols-2 gap-3 w-full">
                    <button onclick="pullGacha(1)" class="py-3 rounded-xl bg-white text-indigo-900 text-xs font-bold hover:bg-indigo-50 cursor-pointer shadow-md">
                        สุ่ม 1 ครั้ง (100 🪙)
                    </button>
                    <button onclick="pullGacha(10)" class="py-3 rounded-xl bg-amber-400 text-neutral-900 text-xs font-bold hover:bg-amber-300 cursor-pointer shadow-md">
                        สุ่ม 10 ครั้ง (900 🪙)
                    </button>
                </div>
            </div>
        </div>

        <!-- หมวด 2: ซื้อพื้นหลัง (Background Section) -->
        <div id="section-background" class="grid grid-cols-2 gap-4 hidden">
            <!-- ตัวอย่างสินค้าพื้นหลัง 1 -->
            <div class="royal-card rounded-2xl p-3 flex flex-col items-center shadow-sm">
                <div class="w-full h-32 rounded-xl bg-cover bg-center mb-3 border border-neutral-100" style="background-image: url('https://res.cloudinary.com/demo/image/upload/v1312461200/sample.jpg')"></div>
                <span class="font-bold text-xs text-neutral-900 mb-1 w-full text-center truncate">ห้องนอนสุดอบอุ่น</span>
                <span class="text-[11px] text-amber-600 font-bold mb-2">500 🪙</span>
                <button onclick="buyBackground('ห้องนอนสุดอบอุ่น', 'https://res.cloudinary.com/demo/image/upload/v1312461200/sample.jpg', 500)" class="w-full py-2 rounded-xl text-[11px] font-semibold royal-btn cursor-pointer">
                    ซื้อพื้นหลัง
                </button>
            </div>
            <!-- ตัวอย่างสินค้าพื้นหลัง 2 -->
            <div class="royal-card rounded-2xl p-3 flex flex-col items-center shadow-sm">
                <div class="w-full h-32 rounded-xl bg-cover bg-center mb-3 border border-neutral-100" style="background-image: url('https://res.cloudinary.com/demo/image/upload/v1312461200/sample.jpg')"></div>
                <span class="font-bold text-xs text-neutral-900 mb-1 w-full text-center truncate">คาเฟ่ริมทะเล</span>
                <span class="text-[11px] text-amber-600 font-bold mb-2">800 🪙</span>
                <button onclick="buyBackground('คาเฟ่ริมทะเล', 'https://res.cloudinary.com/demo/image/upload/v1312461200/sample.jpg', 800)" class="w-full py-2 rounded-xl text-[11px] font-semibold royal-btn cursor-pointer">
                    ซื้อพื้นหลัง
                </button>
            </div>
        </div>

        <!-- หมวด 3: ซื้อไอเท็มทั่วไป (Item Section) -->
        <div id="section-item" class="grid grid-cols-2 gap-4 hidden">
            <div class="royal-card rounded-2xl p-4 flex flex-col items-center justify-between shadow-sm">
                <div class="text-4xl mb-2">🍪</div>
                <div class="text-center w-full mb-3">
                    <span class="font-bold text-xs text-neutral-900 block">คุกกี้เพิ่มพลัง</span>
                    <span class="text-[10px] text-neutral-500 font-bold text-amber-600">50 🪙</span>
                </div>
                <button onclick="buyItem('คุกกี้เพิ่มพลัง', 50)" class="w-full py-2 rounded-xl text-[11px] font-semibold royal-btn cursor-pointer">
                    ซื้อไอเท็ม
                </button>
            </div>
        </div>

    </div>

    <!-- Supabase & Config Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        let currentUserId = null;
        let userCoins = 0;
        let userCookies = 0;

        async function initStore() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            currentUserId = session.user.id;
            loadUserCurrency();
        }

        async function loadUserCurrency() {
            try {
                const { data, error } = await supabase.from('users').select('coins, cookies').eq('id', currentUserId).single();
                if (error) throw error;
                if (data) {
                    userCoins = data.coins || 0;
                    userCookies = data.cookies || 0;
                    document.getElementById('store-coins').innerText = userCoins;
                    document.getElementById('store-cookies').innerText = userCookies;
                }
            } catch (err) {
                console.error('Error loading currency:', err.message);
            }
        }

        function switchStoreTab(tab) {
            document.querySelectorAll('button[id^="btn-"]').forEach(btn => btn.classList.remove('tab-active'));
            document.getElementById(`btn-${tab}`).classList.add('tab-active');

            document.getElementById('section-gacha').classList.add('hidden');
            document.getElementById('section-background').classList.add('hidden');
            document.getElementById('section-item').classList.add('hidden');

            document.getElementById(`section-${tab}`).classList.remove('hidden');
        }

        // ฟังก์ชันสุ่มกาชา
        async function pullGacha(times) {
            const cost = times === 1 ? 100 : 900;
            if (userCoins < cost) {
                showPopup('เหรียญไม่พอ', `คุณต้องการ ${cost} เหรียญ แต่มีเพียง ${userCoins} เหรียญ`, '🪙');
                return;
            }

            try {
                const newCoins = userCoins - cost;
                const { error } = await supabase.from('users').update({ coins: newCoins }).eq('id', currentUserId);
                if (error) throw error;

                userCoins = newCoins;
                document.getElementById('store-coins').innerText = userCoins;

                showPopup('สุ่มกาชาสำเร็จ!', `ยินดีด้วย! คุณสุ่มกาชา ${times} ครั้งเรียบร้อยแล้ว`, '🎉');
            } catch (err) {
                showPopup('เกิดข้อผิดพลาด', err.message, '❌');
            }
        }

        // ฟังก์ชันซื้อพื้นหลัง
        async function buyBackground(name, imageUrl, price) {
            if (userCoins < price) {
                showPopup('เหรียญไม่พอ', `ราคานี้คือ ${price} เหรียญ แต่คุณมี ${userCoins} เหรียญ`, '🪙');
                return;
            }

            try {
                // ตัดเหรียญ
                const newCoins = userCoins - price;
                await supabase.from('users').update({ coins: newCoins }).eq('id', currentUserId);
                userCoins = newCoins;
                document.getElementById('store-coins').innerText = userCoins;

                // เพิ่มพื้นหลังเข้าตาราง user_backgrounds
                await supabase.from('user_backgrounds').insert([{ user_id: currentUserId, name, image_url: imageUrl }]);

                showPopup('ซื้อสำเร็จ!', `คุณได้รับพื้นหลัง "${name}" ไปที่คลังเก็บของแล้ว`, '🖼️');
            } catch (err) {
                showPopup('เกิดข้อผิดพลาด', err.message, '❌');
            }
        }

        // ฟังก์ชันซื้อไอเท็ม
        async function buyItem(name, price) {
            if (userCoins < price) {
                showPopup('เหรียญไม่พอ', `ราคานี้คือ ${price} เหรียญ แต่คุณมี ${userCoins} เหรียญ`, '🪙');
                return;
            }

            try {
                const newCoins = userCoins - price;
                await supabase.from('users').update({ coins: newCoins }).eq('id', currentUserId);
                userCoins = newCoins;
                document.getElementById('store-coins').innerText = userCoins;

                await supabase.from('user_items').insert([{ user_id: currentUserId, name, quantity: 1, type: 'consumable' }]);

                showPopup('ซื้อสำเร็จ!', `คุณได้รับ "${name}" เข้าคลังไอเท็มแล้ว`, '📦');
            } catch (err) {
                showPopup('เกิดข้อผิดพลาด', err.message, '❌');
            }
        }

        window.addEventListener('DOMContentLoaded', initStore);
    </script>
</body>
</html>
