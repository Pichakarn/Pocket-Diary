<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POCKET DIARY - ร้านค้า</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fbfbfb;
            color: #1a1a1a;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            overscroll-behavior-y: auto;
            touch-action: pan-y;
        }
        .royal-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .royal-btn {
            background: #111111;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .royal-btn:hover {
            background: #2d2d2d;
            transform: translateY(-1px);
        }
        .tab-active {
            background: #111111 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex flex-col justify-between select-none">

    <!-- Top Navigation & Currency Bar -->
    <div class="relative z-20 p-4 max-w-lg mx-auto w-full flex flex-col gap-3">
        <div class="flex items-center justify-between">
            <button onclick="window.location.href='phone.html'" class="royal-card px-4 py-2 rounded-2xl text-xs font-semibold flex items-center gap-2 cursor-pointer shadow-sm">
                <span>←</span> กลับโทรศัพท์
            </button>
            <h1 class="font-bold text-base text-neutral-900 flex items-center gap-2">
                <span>🛍️</span> ร้านค้า
            </h1>
            <!-- แสดงยอดเงิน (เหรียญและคุกกี้) -->
            <div class="flex items-center gap-2">
                <div class="royal-card px-2.5 py-1.5 rounded-xl text-[11px] font-bold flex items-center gap-1 shadow-sm">
                    <span>🪙</span> <span id="user-coins">0</span>
                </div>
                <div class="royal-card px-2.5 py-1.5 rounded-xl text-[11px] font-bold flex items-center gap-1 shadow-sm">
                    <span>🍪</span> <span id="user-cookies">0</span>
                </div>
            </div>
        </div>

        <!-- แท็บสลับหมวดหมู่ร้านค้า: Character, Background, Item -->
        <div class="grid grid-cols-3 gap-2">
            <button onclick="switchStoreTab('character')" id="btn-character" class="tab-active py-2.5 rounded-2xl text-xs font-semibold royal-card transition-all cursor-pointer text-center shadow-sm">
                👤 ตัวละคร
            </button>
            <button onclick="switchStoreTab('background')" id="btn-background" class="py-2.5 rounded-2xl text-xs font-semibold royal-card transition-all cursor-pointer text-center shadow-sm">
                🖼️ พื้นหลัง
            </button>
            <button onclick="switchStoreTab('item')" id="btn-item" class="py-2.5 rounded-2xl text-xs font-semibold royal-card transition-all cursor-pointer text-center shadow-sm">
                📦 ไอเท็ม
            </button>
        </div>
    </div>

    <!-- Main Content Grid Area -->
    <div class="relative z-10 flex-1 max-w-lg mx-auto w-full p-4 overflow-y-auto pb-12">
        <div id="store-grid" class="grid grid-cols-2 gap-4">
            <!-- รายการสินค้าจะถูกโหลดแสดงที่นี่แบบ Realtime -->
            <div class="col-span-2 text-center py-16 text-neutral-400 text-xs">กำลังโหลดสินค้าในร้านค้า...</div>
        </div>
    </div>

    <!-- Popup สำหรับแสดงรายละเอียดสินค้า (ตัวละคร / พื้นหลัง / ไอเท็ม) แบบน่ารัก -->
    <div id="store-popup" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden" style="background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);">
        <div class="royal-card w-full max-w-xs rounded-3xl p-6 relative flex flex-col items-center shadow-2xl text-center space-y-4 animate-in fade-in zoom-in duration-200">
            <button onclick="closeStorePopup()" class="absolute top-4 right-4 text-neutral-400 hover:text-neutral-900 text-sm font-bold cursor-pointer">✕</button>
            <div id="popup-image-container" class="w-32 h-40 rounded-2xl bg-cover bg-center border border-neutral-200 shadow-md"></div>
            <div class="w-full">
                <h3 id="popup-title" class="font-bold text-sm text-neutral-900 mb-1">ชื่อสินค้า</h3>
                <p id="popup-desc" class="text-[11px] text-neutral-500 mb-3">รายละเอียดคุณสมบัติสินค้า</p>
                <div id="popup-price" class="font-bold text-xs text-amber-600 mb-4">🪙 0 เหรียญ</div>
            </div>
            <button id="popup-buy-btn" class="w-full py-2.5 rounded-xl text-xs font-bold royal-btn cursor-pointer">
                ยืนยันการซื้อ
            </button>
        </div>
    </div>

    <!-- Popup แจ้งเตือนทั่วไป -->
    <div id="alert-popup" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden" style="background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);">
        <div class="royal-card w-full max-w-xs rounded-3xl p-6 relative flex flex-col items-center shadow-2xl text-center space-y-3">
            <div id="alert-icon" class="text-3xl mb-1">✨</div>
            <h3 id="alert-title" class="font-bold text-sm text-neutral-900">แจ้งเตือน</h3>
            <p id="alert-message" class="text-xs text-neutral-600">ข้อความแจ้งเตือน</p>
            <button onclick="closeAlertPopup()" class="w-full py-2 rounded-xl text-xs font-bold royal-btn cursor-pointer mt-2">ตกลง</button>
        </div>
    </div>

    <!-- Supabase & Config Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        let currentUserId = null;
        let userCoins = 0;
        let userCookies = 0;
        let currentTab = 'character';
        let selectedProduct = null;

        async function initStore() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            currentUserId = session.user.id;
            await loadUserData();
            loadStoreProducts();
        }

        async function loadUserData() {
            try {
                const { data, error } = await supabase
                    .from('users')
                    .select('coins, cookies')
                    .eq('id', currentUserId)
                    .single();

                if (error) throw error;
                if (data) {
                    userCoins = data.coins || 0;
                    userCookies = data.cookies || 0;
                    document.getElementById('user-coins').innerText = userCoins;
                    document.getElementById('user-cookies').innerText = userCookies;
                }
            } catch (err) {
                console.error('Error loading user currency:', err.message);
            }
        }

        function switchStoreTab(tab) {
            currentTab = tab;
            document.querySelectorAll('button[id^="btn-"]').forEach(btn => btn.classList.remove('tab-active'));
            document.getElementById(`btn-${tab}`).classList.add('tab-active');
            loadStoreProducts();
        }

        // โหลดข้อมูลสินค้าจากตาราง store_products ใน Supabase แบบ Realtime
        async function loadStoreProducts() {
            const grid = document.getElementById('store-grid');
            grid.innerHTML = '<div class="col-span-2 text-center py-16 text-neutral-400 text-xs">กำลังโหลดสินค้า...</div>';

            try {
                const { data, error } = await supabase
                    .from('store_products')
                    .select('*')
                    .eq('category', currentTab);

                if (error) throw error;
                renderProducts(data || []);
            } catch (err) {
                console.error('Error loading store:', err.message);
                grid.innerHTML = '<div class="col-span-2 text-center py-16 text-red-400 text-xs">เกิดข้อผิดพลาดในการโหลดสินค้า</div>';
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('store-grid');
            grid.innerHTML = '';

            if (products.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-center py-16 text-neutral-400 text-xs">ยังไม่มีสินค้าในหมวดหมู่นี้</div>';
                return;
            }

            products.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'royal-card rounded-2xl p-4 flex flex-col items-center justify-between shadow-sm relative';
                
                // ป้ายระดับสกิน (ถ้ามี) มุมขวาบน
                let badgeHtml = '';
                if (prod.skin_rank) {
                    badgeHtml = `<span class="absolute top-3 right-3 bg-neutral-900 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">${prod.skin_rank}</span>`;
                }

                let currencyIcon = prod.currency_type === 'cookies' ? '🍪' : '🪙';

                card.innerHTML = `
                    ${badgeHtml}
                    <div class="w-full h-32 rounded-xl bg-cover bg-center mb-3 border border-neutral-100 cursor-pointer" style="background-image: url('${prod.image_url}')" onclick='openProductDetail(${JSON.stringify(prod)})'></div>
                    <div class="text-center w-full mb-3 cursor-pointer" onclick='openProductDetail(${JSON.stringify(prod)})'>
                        <span class="font-bold text-xs text-neutral-900 block truncate w-full">${prod.name}</span>
                        <span class="text-[11px] font-bold text-amber-600 mt-1 block">${currencyIcon} ${prod.price.toLocaleString()} ${prod.currency_type === 'cookies' ? 'คุกกี้' : 'เหรียญ'}</span>
                    </div>
                    <button onclick='buyProduct(${JSON.stringify(prod)})' class="w-full py-2 rounded-xl text-[11px] font-semibold royal-btn cursor-pointer">
                        ซื้อสินค้า
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        // เปิดป๊อปอัพดูรายละเอียดสินค้า
        function openProductDetail(prod) {
            selectedProduct = prod;
            document.getElementById('popup-image-container').style.backgroundImage = `url('${prod.full_image_url || prod.image_url}')`;
            document.getElementById('popup-title').innerText = prod.name;
            document.getElementById('popup-desc').innerText = prod.description || (prod.category === 'item' ? `คุณสมบัติ: ${prod.property || 'ไอเท็มทั่วไป'}` : 'สินค้าคุณภาพพรีเมียมจาก POCKET DIARY');
            
            let currencyIcon = prod.currency_type === 'cookies' ? '🍪' : '🪙';
            document.getElementById('popup-price').innerText = `${currencyIcon} ${prod.price.toLocaleString()} ${prod.currency_type === 'cookies' ? 'คุกกี้' : 'เหรียญ'}`;
            
            document.getElementById('popup-buy-btn').onclick = () => buyProduct(prod);
            document.getElementById('store-popup').classList.remove('hidden');
        }

        function closeStorePopup() {
            document.getElementById('store-popup').classList.add('hidden');
        }

        // ฟังก์ชันซื้อสินค้า (รองรับ Character, Background และ Item พร้อมเช็คเงื่อนไขซ้ำและหักเงิน Realtime)
        async function buyProduct(prod) {
            closeStorePopup();
            let cost = prod.price;
            let isCookie = prod.currency_type === 'cookies';

            if (isCookie && userCookies < cost) {
                showAlert('คุกกี้ไม่พอ', `คุณต้องการ ${cost} คุกกี้ แต่มีเพียง ${userCookies} คุกกี้`, '🍪');
                return;
            }
            if (!isCookie && userCoins < cost) {
                showAlert('เหรียญไม่พอ', `คุณต้องการ ${cost} เหรียญ แต่มีเพียง ${userCoins} เหรียญ`, '🪙');
                return;
            }

            try {
                // เช็คว่าซื้อไปแล้วหรือยัง (สำหรับ Character และ Background ที่ซื้อซ้ำไม่ได้)
                if (prod.category === 'character') {
                    const { data: existing } = await supabase.from('user_characters').select('*').eq('user_id', currentUserId).eq('character_name', prod.name).single();
                    if (existing) {
                        showAlert('มีสินค้านี้แล้ว', 'คุณมีตัวละคร/สกินนี้อยู่ในไดอารี่แล้ว ไม่สามารถซื้อซ้ำได้', '⚠️');
                        return;
                    }
                } else if (prod.category === 'background') {
                    const { data: existing } = await supabase.from('user_backgrounds').select('*').eq('user_id', currentUserId).eq('image_url', prod.image_url).single();
                    if (existing) {
                        showAlert('มีสินค้านี้แล้ว', 'คุณมีพื้นหลังนี้อยู่ในคลังเก็บของแล้ว ไม่สามารถซื้อซ้ำได้', '⚠️');
                        return;
                    }
                }

                // หักเงินผู้ใช้
                let newCoins = userCoins;
                let newCookies = userCookies;
                let updatePayload = {};

                if (isCookie) {
                    newCookies -= cost;
                    updatePayload.cookies = newCookies;
                } else {
                    newCoins -= cost;
                    updatePayload.coins = newCoins;
                }

                const { error: updateErr } = await supabase.from('users').update(updatePayload).eq('id', currentUserId);
                if (updateErr) throw updateErr;

                userCoins = newCoins;
                userCookies = newCookies;
                document.getElementById('user-coins').innerText = userCoins;
                document.getElementById('user-cookies').innerText = userCookies;

                // บันทึกสินค้าลงตู้เก็บของของผู้ใช้ตามหมวดหมู่
                if (prod.category === 'character') {
                    await supabase.from('user_characters').insert([{
                        user_id: currentUserId,
                        character_name: prod.name,
                        skin_rank: prod.skin_rank || 'B',
                        image_url: prod.image_url,
                        full_image_url: prod.full_image_url || prod.image_url
                    }]);
                } else if (prod.category === 'background') {
                    await supabase.from('user_backgrounds').insert([{
                        user_id: currentUserId,
                        name: prod.name,
                        image_url: prod.image_url
                    }]);
                } else {
                    // Item หมวดนี้ซื้อซ้ำได้ บันทึกลง user_items
                    await supabase.from('user_items').insert([{
                        user_id: currentUserId,
                        name: prod.name,
                        image_url: prod.image_url,
                        type: prod.item_type || 'ทั่วไป',
                        property: prod.property || 'ใช้งานได้ทันที'
                    }]);
                }

                showAlert('ซื้อสำเร็จ!', `คุณได้รับ "${prod.name}" เรียบร้อยแล้ว`, '🛍️');

            } catch (err) {
                console.error('Error buying product:', err.message);
                showAlert('เกิดข้อผิดพลาด', err.message, '❌');
            }
        }

        function showAlert(title, message, icon = '✨') {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            document.getElementById('alert-icon').innerText = icon;
            document.getElementById('alert-popup').classList.remove('hidden');
        }

        function closeAlertPopup() {
            document.getElementById('alert-popup').classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', initStore);
    </script>
</body>
</html>
