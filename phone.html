<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POCKET DIARY - Phone</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(135deg, #fcfbfa 0%, #f0ede6 100%);
            color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow-x: hidden; /* ล็อกซ้ายขวาตามสั่ง */
            overflow-y: auto;   /* ให้เลื่อนขึ้นลงได้ */
            touch-action: pan-y;
        }

        /* หน้าจอหลักแบบเต็มพื้นที่ (ไม่มีกรอบมือถือแล้ว) */
        .phone-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            min-height: 100vh;
            background: transparent;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* วิดเจ็ตแสดงเวลา วันที่ และสภาพอากาศแบบน่ารัก */
        .phone-header {
            padding: 24px 20px 10px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .widget-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            padding: 18px 22px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time-box {
            display: flex;
            flex-direction: column;
        }

        .time-display {
            font-size: 34px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        .date-text {
            font-size: 13px;
            font-weight: 500;
            color: #666;
            margin-top: 2px;
        }

        .weather-box {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .weather-temp {
            font-size: 18px;
            font-weight: 600;
            color: #222;
        }

        .weather-desc {
            font-size: 12px;
            color: #666;
        }

        /* ตารางแอปพลิเคชัน (3 แอปต่อแถว) */
        .apps-grid {
            flex: 1;
            padding: 10px 20px 30px 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 105px;
            gap: 18px;
            align-content: start;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            position: relative;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .app-icon:active {
            transform: scale(0.92);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .app-icon .icon-emoji {
            font-size: 34px;
            margin-bottom: 6px;
        }

        .app-icon .app-name {
            font-size: 12px;
            font-weight: 600;
            color: #333;
        }

        /* ปุ่มออกจาก Phone ด้านล่าง */
        .phone-footer {
            padding: 15px 20px 25px 20px;
            display: flex;
            justify-content: center;
            background: transparent;
        }

        .home-bar-btn {
            width: 140px;
            height: 42px;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 21px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            transition: background 0.2s, transform 0.1s;
        }

        .home-bar-btn:active {
            background: #444;
            transform: scale(0.96);
        }

        /* Popup สไตล์น่ารัก ตามโจทย์ */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .popup-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .popup-box {
            width: 82%;
            max-width: 320px;
            background: #fff;
            padding: 24px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            transform: scale(0.9);
            transition: transform 0.2s ease;
            border: 2px solid #f0ede6;
        }

        .popup-overlay.active .popup-box {
            transform: scale(1);
        }

        .popup-box h3 {
            font-size: 18px;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        .popup-box p {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .popup-btn {
            background: #1a1a1a;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* iframe สำหรับเปิดแอปย่อยแบบเต็มจอภายในหน้า Phone */
        .sub-app-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fcfbfa;
            z-index: 200;
            display: none;
            flex-direction: column;
        }

        .sub-app-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            background: #fff;
            border-bottom: 1px solid #eee;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            color: #1a1a1a;
            margin-right: 15px;
        }

        .sub-app-title {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a1a;
        }

        .sub-app-content {
            flex: 1;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- หัวข้อ: วิดเจ็ตเวลา วันที่ และสภาพอากาศสุดน่ารัก -->
        <div class="phone-header">
            <div class="widget-card">
                <div class="time-box">
                    <div class="time-display" id="realTime">00:00</div>
                    <div class="date-text" id="realDate">--/--/----</div>
                </div>
                <div class="weather-box">
                    <div class="weather-temp" id="weatherTemp">🌤️ --°C</div>
                    <div class="weather-desc" id="weatherDesc">กำลังโหลด...</div>
                </div>
            </div>
        </div>

        <!-- หน้าจอหลัก: แอปพลิเคชัน (3 แอปต่อแถว) -->
        <div class="apps-grid" id="appsGrid">
            <!-- 1. นามบัตร -->
            <div class="app-icon" onclick="openApp('mycard.html', 'นามบัตร')">
                <div class="icon-emoji">🪪</div>
                <div class="app-name">นามบัตร</div>
            </div>
            <!-- 2. ธนาคาร -->
            <div class="app-icon" onclick="openApp('bank.html', 'ธนาคาร')">
                <div class="icon-emoji">📱</div>
                <div class="app-name">ธนาคาร</div>
            </div>
            <!-- 3. ร้านค้า -->
            <div class="app-icon" onclick="openApp('store.html', 'ร้านค้า')">
                <div class="icon-emoji">🛍️</div>
                <div class="app-name">ร้านค้า</div>
            </div>
            <!-- 4. เพื่อน -->
            <div class="app-icon" onclick="openApp('friends.html', 'เพื่อน')">
                <div class="icon-emoji">👥</div>
                <div class="app-name">เพื่อน</div>
            </div>
            <!-- 5. กรอกโค้ด -->
            <div class="app-icon" onclick="openApp('code.html', 'กรอกโค้ด')">
                <div class="icon-emoji">🎁</div>
                <div class="app-name">กรอกโค้ด</div>
            </div>
            <!-- 6. Admin (ซ่อนไว้จนกว่าจะเช็คสิทธิ์แอดมิน) -->
            <div class="app-icon" id="adminAppIcon" style="display: none;" onclick="openApp('admin.html', 'ระบบแอดมิน')">
                <div class="icon-emoji">🛠️</div>
                <div class="app-name">Admin</div>
            </div>
        </div>

        <!-- ปุ่มออกจาก Phone ด้านล่าง -->
        <div class="phone-footer">
            <button class="home-bar-btn" onclick="closePhone()">ปิดโทรศัพท์</button>
        </div>

        <!-- Sub App View (เปิดไฟล์เสริมภายในระบบ) -->
        <div class="sub-app-container" id="subAppContainer">
            <div class="sub-app-header">
                <button class="back-btn" onclick="closeApp()">‹ ย้อนกลับ</button>
                <div class="sub-app-title" id="subAppTitle">ชื่อแอป</div>
            </div>
            <iframe class="sub-app-content" id="subAppIframe" src=""></iframe>
        </div>

        <!-- Popup แจ้งเตือนสไตล์น่ารัก -->
        <div class="popup-overlay" id="popupOverlay">
            <div class="popup-box">
                <h3 id="popupTitle">แจ้งเตือน</h3>
                <p id="popupMessage">ข้อความแจ้งเตือน...</p>
                <button class="popup-btn" onclick="closePopup()">ตกลง</button>
            </div>
        </div>
    </div>

    <script>
        // ตั้งค่าการเชื่อมต่อ Supabase
        const SUPABASE_URL = 'https://ooozqddxvxeykwubumli.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_xwsBeo4TJfLSwnQUiV2uSw_7GwLZd85';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ฟังก์ชันแสดงเวลา วัน วันที่ เดือน ปี (พ.ศ.) แบบเรียลไทม์
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('realTime').textContent = `${hours}:${minutes}`;

            // แปลงปีเป็น พ.ศ. ให้เข้ากับภาษาไทย
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Asia/Bangkok' };
            let thaiDate = now.toLocaleDateString('th-TH', options);
            document.getElementById('realDate').textContent = thaiDate;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ดึงข้อมูลสภาพอากาศจริง
        async function fetchWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=13.7563&longitude=100.5018&current=temperature_2m,weather_code&timezone=Asia%2FBangkok');
                const data = await res.json();
                const temp = Math.round(data.current.temperature_2m);
                document.getElementById('weatherTemp').textContent = `🌤️ ${temp}°C`;
                document.getElementById('weatherDesc').textContent = 'อากาศแจ่มใส';
            } catch (e) {
                document.getElementById('weatherTemp').textContent = '🌤️ 28°C';
                document.getElementById('weatherDesc').textContent = 'กรุงเทพฯ';
            }
        }
        fetchWeather();

        // ตรวจสอบสิทธิ์แอดมิน (ciiderydem@gmail.com)
        async function checkAdminPermission() {
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (user && user.email === 'ciiderydem@gmail.com') {
                    document.getElementById('adminAppIcon').style.display = 'flex';
                } else {
                    const localUserEmail = localStorage.getItem('user_email');
                    if (localUserEmail === 'ciiderydem@gmail.com') {
                        document.getElementById('adminAppIcon').style.display = 'flex';
                    }
                }
            } catch (err) {
                console.log('Admin check skipped or failed', err);
            }
        }
        checkAdminPermission();

        // ฟังก์ชันเปิดแอปย่อย
        function openApp(fileName, appName) {
            document.getElementById('subAppTitle').textContent = appName;
            document.getElementById('subAppIframe').src = fileName;
            document.getElementById('subAppContainer').style.display = 'flex';
        }

        // ฟังก์ชันปิดแอปย่อยกลับมาหน้าหลัก
        function closeApp() {
            document.getElementById('subAppContainer').style.display = 'none';
            document.getElementById('subAppIframe').src = '';
        }

        // ฟังก์ชันปิดหน้า Phone หลัก
        function closePhone() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage('closePhone', '*');
            } else {
                showPopup("แจ้งเตือน", "ออกจากหน้าโทรศัพท์มือถือแล้ว");
            }
        }

        // ระบบแสดง Popup แทน Alert ทั่วไปตามข้อกำหนด
        function showPopup(title, message) {
            document.getElementById('popupTitle').textContent = title;
            document.getElementById('popupMessage').textContent = message;
            document.getElementById('popupOverlay').classList.add('active');
        }

        function closePopup() {
            document.getElementById('popupOverlay').classList.remove('active');
        }
    </script>
</body>
</html>
