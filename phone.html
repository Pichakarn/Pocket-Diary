<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POCKET DIARY - โทรศัพท์มือถือ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #111111 0%, #2d2d2d 100%);
            color: #1a1a1a;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            overscroll-behavior-y: auto;
        }
        .phone-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .app-icon {
            transition: all 0.2s ease;
        }
        .app-icon:hover {
            transform: scale(1.08);
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex flex-col items-center justify-center p-4 select-none">

    <!-- กรอบโทรศัพท์มือถือจำลอง -->
    <div class="phone-container w-full max-w-sm rounded-[40px] p-6 flex flex-col justify-between min-h-[680px] shadow-2xl relative overflow-hidden">
        
        <!-- Status Bar & Clock -->
        <div class="flex justify-between items-center text-xs text-neutral-800 font-semibold px-2 pt-1">
            <span id="real-time-clock">00:00</span>
            <div class="w-16 h-4 bg-neutral-900 rounded-full mx-auto absolute left-1/2 transform -translate-x-1/2 top-1"></div>
            <span class="flex items-center gap-1">5G 📶</span>
        </div>

        <!-- Widget: วัน เดือน ปี (ค.ศ.) & สภาพอากาศ -->
        <div class="mt-6 bg-gradient-to-br from-neutral-900 to-neutral-800 text-white p-5 rounded-3xl shadow-lg flex justify-between items-center">
            <div>
                <div id="widget-date" class="text-sm font-medium tracking-wide">กำลังโหลดวันที่...</div>
                <div id="widget-weather" class="text-xs text-neutral-300 mt-1 flex items-center gap-1.5">🌤️ กรุงเทพมหานคร, 32°C</div>
            </div>
            <div class="text-3xl">⛅</div>
        </div>

        <!-- Apps Grid (แถวละ 3 แอป รวม 6 แอปหลัก + แอปแอดมินถ้ามีสิทธิ์) -->
        <div class="grid grid-cols-3 gap-6 my-auto px-2" id="phone-apps-grid">
            
            <!-- 1. นามบัตร (mycard.html) -->
            <button onclick="openApp('mycard.html')" class="app-icon flex flex-col items-center cursor-pointer">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-300 shadow-md flex items-center justify-center text-2xl text-white mb-1.5">🪪</div>
                <span class="text-[11px] font-semibold text-neutral-800">นามบัตร</span>
            </button>

            <!-- 2. ธนาคาร (bank.html) -->
            <button onclick="openApp('bank.html')" class="app-icon flex flex-col items-center cursor-pointer">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-600 to-emerald-400 shadow-md flex items-center justify-center text-2xl text-white mb-1.5">📱</div>
                <span class="text-[11px] font-semibold text-neutral-800">ธนาคาร</span>
            </button>

            <!-- 3. ร้านค้า (store.html) -->
            <button onclick="openApp('store.html')" class="app-icon flex flex-col items-center cursor-pointer">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-400 shadow-md flex items-center justify-center text-2xl text-white mb-1.5">🛍️</div>
                <span class="text-[11px] font-semibold text-neutral-800">ร้านค้า</span>
            </button>

            <!-- 4. เพื่อน (friends.html) -->
            <button onclick="openApp('friends.html')" class="app-icon flex flex-col items-center cursor-pointer">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-400 shadow-md flex items-center justify-center text-2xl text-white mb-1.5">👥</div>
                <span class="text-[11px] font-semibold text-neutral-800">เพื่อน</span>
            </button>

            <!-- 5. กรอกโค้ด (code.html) -->
            <button onclick="openApp('code.html')" class="app-icon flex flex-col items-center cursor-pointer">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-500 to-cyan-400 shadow-md flex items-center justify-center text-2xl text-white mb-1.5">🎁</div>
                <span class="text-[11px] font-semibold text-neutral-800">กรอกโค้ด</span>
            </button>

            <!-- 6. Admin (เฉพาะ ciiderydem@gmail.com) -->
            <button id="admin-app-btn" onclick="openApp('admin.html')" class="app-icon hidden flex-col items-center cursor-pointer">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-neutral-900 to-neutral-700 shadow-md flex items-center justify-center text-2xl text-white mb-1.5 border-2 border-amber-400">🛠️</div>
                <span class="text-[11px] font-semibold text-neutral-900">Admin</span>
            </button>

        </div>

        <!-- Bottom Navigation: ปุ่มออกจาก Phone กลับหน้าหลัก -->
        <div class="pt-4 border-t border-neutral-200 flex justify-center">
            <button onclick="window.location.href='home.html'" class="w-32 h-10 rounded-full bg-neutral-900 text-white text-xs font-semibold shadow-md flex items-center justify-center gap-1.5 hover:bg-neutral-800 cursor-pointer">
                <span>◀</span> ออกจากโทรศัพท์
            </button>
        </div>

    </div>

    <!-- Supabase & Config Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        // อัปเดตเวลาจริงแบบ Realtime
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('real-time-clock').innerText = `${hours}:${minutes}`;

            // อัปเดตวันที่ (ค.ศ.)
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' };
            document.getElementById('widget-date').innerText = now.toLocaleDateString('th-TH', options);
        }

        async function initPhone() {
            updateClock();
            setInterval(updateClock, 1000);

            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }

            // ตรวจสอบสิทธิ์แอดมินจากอีเมล ciiderydem@gmail.com
            const userEmail = session.user.email;
            if (userEmail === 'ciiderydem@gmail.com') {
                const adminBtn = document.getElementById('admin-app-btn');
                if (adminBtn) adminBtn.classList.remove('hidden');
            }
        }

        function openApp(page) {
            window.location.href = page;
        }

        window.addEventListener('DOMContentLoaded', initPhone);
    </script>
</body>
</html>
