<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POCKET DIARY - โทรศัพท์</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f5f5f7;
            color: #1a1a1a;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            overscroll-behavior-y: auto;
            touch-action: pan-y;
        }
        .phone-frame {
            background: linear-gradient(135deg, #ffffff 0%, #f0f2f5 100%);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .royal-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(229, 231, 235, 0.8);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .app-icon {
            transition: all 0.2s ease;
        }
        .app-icon:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex items-center justify-center p-0 sm:p-4 select-none">

    <!-- Phone Container (ล็อกขนาดหน้าจอจำลองมือถือ สีขาวมุก/ดำพราวราชวงศ์) -->
    <div class="phone-frame relative w-full sm:max-w-md h-screen sm:h-[844px] sm:rounded-[40px] flex flex-col justify-between overflow-hidden shadow-2xl">

        <!-- Status Bar & Dynamic Weather/Time Header -->
        <div class="relative z-25 pt-6 px-6 pb-2 flex flex-col gap-3">
            <div class="flex items-center justify-between text-neutral-800 text-xs font-semibold">
                <span id="realtime-clock">00:00</span>
                <div class="w-20 h-5 bg-neutral-900 rounded-full mx-auto absolute left-1/2 -translate-x-1/2 top-3"></div> <!-- Dynamic Notch -->
                <span class="flex items-center gap-1 font-bold">5G 🔋</span>
            </div>

            <!-- Widget: วัน เดือน ปี (ค.ศ.) และสภาพอากาศจริง -->
            <div class="royal-card rounded-3xl p-4 flex items-center justify-between shadow-sm mt-2">
                <div>
                    <div id="widget-date" class="text-xs font-bold text-neutral-900">กำลังโหลดวันที่...</div>
                    <div id="widget-location" class="text-[10px] text-neutral-500 font-medium">กรุงเทพมหานคร, ประเทศไทย</div>
                </div>
                <div class="text-right">
                    <div id="widget-temp" class="text-base font-bold text-neutral-900">--°C</div>
                    <div id="widget-weather" class="text-[10px] text-neutral-500 font-medium">กำลังโหลด...</div>
                </div>
            </div>
        </div>

        <!-- App Grid Area (แนวนอนแถวละ 3 แอป ตามโครงสร้างที่กำหนด) -->
        <div class="relative z-20 flex-1 px-6 py-4 flex flex-col justify-center">
            <div class="grid grid-cols-3 gap-6 text-center">
                
                <!-- 1. นามบัตร (mycard.html) -->
                <div onclick="window.location.href='mycard.html'" class="app-icon flex flex-col items-center gap-2 cursor-pointer group">
                    <div class="w-16 h-16 royal-card rounded-2xl flex items-center justify-center text-2xl shadow-md group-hover:shadow-lg">🪪</div>
                    <span class="text-[11px] font-bold text-neutral-800">นามบัตร</span>
                </div>

                <!-- 2. ธนาคาร (bank.html) -->
                <div onclick="window.location.href='bank.html'" class="app-icon flex flex-col items-center gap-2 cursor-pointer group">
                    <div class="w-16 h-16 royal-card rounded-2xl flex items-center justify-center text-2xl shadow-md group-hover:shadow-lg">📱</div>
                    <span class="text-[11px] font-bold text-neutral-800">ธนาคาร</span>
                </div>

                <!-- 3. ร้านค้า (store.html) -->
                <div onclick="window.location.href='store.html'" class="app-icon flex flex-col items-center gap-2 cursor-pointer group">
                    <div class="w-16 h-16 royal-card rounded-2xl flex items-center justify-center text-2xl shadow-md group-hover:shadow-lg">🛍️</div>
                    <span class="text-[11px] font-bold text-neutral-800">ร้านค้า</span>
                </div>

                <!-- 4. เพื่อน (friends.html) -->
                <div onclick="window.location.href='friends.html'" class="app-icon flex flex-col items-center gap-2 cursor-pointer group">
                    <div class="w-16 h-16 royal-card rounded-2xl flex items-center justify-center text-2xl shadow-md group-hover:shadow-lg">👥</div>
                    <span class="text-[11px] font-bold text-neutral-800">เพื่อน</span>
                </div>

                <!-- 5. กรอกโค้ด (code.html) -->
                <div onclick="window.location.href='code.html'" class="app-icon flex flex-col items-center gap-2 cursor-pointer group">
                    <div class="w-16 h-16 royal-card rounded-2xl flex items-center justify-center text-2xl shadow-md group-hover:shadow-lg">🎁</div>
                    <span class="text-[11px] font-bold text-neutral-800">กรอกโค้ด</span>
                </div>

                <!-- 6. Admin (แสดงเฉพาะแอดมิน ciiderydem@gmail.com เท่านั้น) -->
                <div id="admin-app-icon" onclick="window.location.href='admin.html'" class="app-icon hidden flex-col items-center gap-2 cursor-pointer group">
                    <div class="w-16 h-16 bg-neutral-900 text-white rounded-2xl flex items-center justify-center text-2xl shadow-md group-hover:shadow-lg">🛠️</div>
                    <span class="text-[11px] font-bold text-neutral-900">Admin</span>
                </div>

            </div>
        </div>

        <!-- Bottom Navigation / Exit Phone Button -->
        <div class="relative z-20 p-6 pt-2 flex flex-col items-center gap-3">
            <button onclick="window.location.href='home.html'" class="w-full py-3 royal-card rounded-2xl text-xs font-bold text-neutral-900 shadow-md cursor-pointer hover:bg-white transition-all text-center">
                ออกจาก Phone
            </button>
            <div class="w-32 h-1 bg-neutral-400 rounded-full"></div> <!-- Home Indicator Bar -->
        </div>

    </div>

    <!-- Supabase & Config Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        let currentUserId = null;
        const ADMIN_EMAIL = "ciiderydem@gmail.com";

        async function initPhone() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            currentUserId = session.user.id;

            // ตรวจสอบสิทธิ์แอดมินจากอีเมลลับ
            if (session.user.email === ADMIN_EMAIL) {
                document.getElementById('admin-app-icon').classList.remove('hidden');
                document.getElementById('admin-app-icon').classList.add('flex');
            }

            startRealtimeClock();
            loadRealtimeWeatherAndDate();
        }

        // ระบบเวลา Realtime ตามเวลาจริง
        function startRealtimeClock() {
            function updateClock() {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                document.getElementById('realtime-clock').innerText = `${hours}:${minutes}`;
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        // โหลดข้อมูล วัน เดือน ปี (ค.ศ.) และสภาพอากาศจริงแบบ Realtime
        async function loadRealtimeWeatherAndDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' };
            const dateStr = now.toLocaleDateString('th-TH', options);
            document.getElementById('widget-date').innerText = dateStr;

            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=13.7563&longitude=100.5018&current_weather=true');
                const weatherData = await response.json();
                if (weatherData && weatherData.current_weather) {
                    const temp = Math.round(weatherData.current_weather.temperature);
                    const weatherCode = weatherData.current_weather.weathercode;
                    document.getElementById('widget-temp').innerText = `${temp}°C`;
                    document.getElementById('widget-weather').innerText = getWeatherDescription(weatherCode);
                }
            } catch (err) {
                console.error('Error fetching weather:', err);
                document.getElementById('widget-temp').innerText = '30°C';
                document.getElementById('widget-weather').innerText = 'แจ่มใส';
            }
        }

        function getWeatherDescription(code) {
            if (code === 0) return 'ท้องฟ้าแจ่มใส';
            if (code >= 1 && code <= 3) return 'มีเมฆบางส่วน';
            if (code >= 51 && code <= 67) return 'ฝนตกปรอยๆ';
            if (code >= 95) return 'พายุฝนฟ้าคะนอง';
            return 'อากาศปกติ';
        }

        window.addEventListener('DOMContentLoaded', initPhone);
    </script>
</body>
</html>
