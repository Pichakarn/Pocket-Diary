<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POCKET DIARY - ธนาคาร</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fbfbfb;
            color: #1a1a1a;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            overscroll-behavior-y: auto;
        }
        .royal-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .royal-btn {
            background: #111111;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .royal-btn:hover {
            background: #2d2d2d;
            transform: translateY(-1px);
        }
        .tab-active {
            background: #111111 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex flex-col justify-between select-none">

    <!-- Top Navigation Bar -->
    <div class="relative z-20 p-4 max-w-lg mx-auto w-full flex items-center justify-between">
        <button onclick="window.location.href='phone.html'" class="royal-card px-4 py-2 rounded-2xl text-xs font-semibold flex items-center gap-2 cursor-pointer shadow-sm">
            <span>←</span> กลับโทรศัพท์
        </button>
        <h1 class="font-bold text-base text-neutral-900 flex items-center gap-2">
            <span>📱</span> ธนาคารพกพา
        </h1>
        <div class="w-20"></div>
    </div>

    <!-- Main Content -->
    <div class="relative z-10 flex-1 max-w-lg mx-auto w-full p-4 overflow-y-auto pb-8 space-y-4">
        
        <!-- แถบการ์ดแสดงข้อมูลบัญชี -->
        <div class="royal-card rounded-3xl p-6 shadow-xl bg-gradient-to-br from-neutral-900 to-neutral-800 text-white relative overflow-hidden">
            <div class="absolute -right-6 -bottom-6 text-8xl opacity-10">💳</div>
            <div class="flex justify-between items-start mb-6">
                <div>
                    <div class="text-[11px] text-neutral-400">ชื่อบัญชี</div>
                    <input type="text" id="account-name-input" onchange="updateAccountName(this.value)" class="bg-transparent font-bold text-base text-white border-b border-neutral-600 focus:outline-none focus:border-white pb-0.5 mt-0.5" value="กำลังโหลด...">
                </div>
                <div class="text-right">
                    <div class="text-[11px] text-neutral-400">เลขบัญชี</div>
                    <div id="account-number" class="font-mono font-bold text-sm text-amber-400 tracking-wider">----------</div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 border-t border-neutral-700/60 pt-4">
                <div>
                    <div class="text-[10px] text-neutral-400">ยอดเงินคงเหลือ</div>
                    <div class="text-lg font-bold text-white flex items-center gap-1.5 mt-0.5">🪙 <span id="bank-coins">0</span></div>
                </div>
                <div>
                    <div class="text-[10px] text-neutral-400">คุกกี้สะสม</div>
                    <div class="text-lg font-bold text-white flex items-center gap-1.5 mt-0.5">🍪 <span id="bank-cookies">0</span></div>
                </div>
            </div>
        </div>

        <!-- แท็บสลับการทำงาน: โอนเงิน / รายชื่อผู้รับเงิน -->
        <div class="grid grid-cols-2 gap-2">
            <button onclick="switchBankTab('transfer')" id="btn-transfer" class="tab-active py-2.5 rounded-2xl text-xs font-semibold royal-card transition-all cursor-pointer text-center shadow-sm">
                💸 โอนเงิน
            </button>
            <button onclick="switchBankTab('contacts')" id="btn-contacts" class="py-2.5 rounded-2xl text-xs font-semibold royal-card transition-all cursor-pointer text-center shadow-sm">
                👥 รายชื่อผู้รับเงิน
            </button>
        </div>

        <!-- หมวด 1: โอนเงิน -->
        <div id="section-transfer" class="royal-card rounded-3xl p-6 shadow-xl space-y-4">
            <h3 class="font-bold text-sm text-neutral-900 border-b pb-2">โอนเงินให้ผู้อื่น</h3>
            <div>
                <label class="text-[11px] font-semibold text-neutral-500 mb-1 block">เลขบัญชีผู้รับ (10 หลัก)</label>
                <input type="text" id="transfer-acc-num" class="w-full px-4 py-2.5 rounded-xl border border-neutral-200 text-xs focus:outline-none focus:border-neutral-900 bg-neutral-50" placeholder="กรอกเลขบัญชี 10 หลัก">
            </div>
            <div>
                <label class="text-[11px] font-semibold text-neutral-500 mb-1 block">จำนวนเงิน (เหรียญ 🪙)</label>
                <input type="number" id="transfer-amount" class="w-full px-4 py-2.5 rounded-xl border border-neutral-200 text-xs focus:outline-none focus:border-neutral-900 bg-neutral-50" placeholder="0">
            </div>
            <button onclick="executeTransfer()" class="w-full py-3 rounded-xl text-xs font-bold royal-btn cursor-pointer">
                ยืนยันการโอนเงิน
            </button>
        </div>

        <!-- หมวด 2: รายชื่อผู้รับเงิน (ซ่อนไว้ก่อน) -->
        <div id="section-contacts" class="royal-card rounded-3xl p-6 shadow-xl space-y-4 hidden">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-neutral-900">บันทึกรายชื่อเพื่อน</h3>
                <button onclick="openAddContactModal()" class="text-xs font-semibold px-3 py-1.5 rounded-xl royal-btn">+ เพิ่มเพื่อน</button>
            </div>
            <div id="contacts-list" class="space-y-2">
                <div class="text-center py-6 text-neutral-400 text-xs">ยังไม่มีรายชื่อที่บันทึกไว้</div>
            </div>
        </div>

    </div>

    <!-- Modal: สลิปโอนเงินสำเร็จ -->
    <div id="receipt-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden" style="background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);">
        <div class="royal-card w-full max-w-sm rounded-3xl p-6 relative flex flex-col items-center shadow-2xl text-center space-y-3">
            <div class="text-4xl text-emerald-600 mb-1">✅</div>
            <h3 class="font-bold text-base text-neutral-900">โอนเงินสำเร็จ</h3>
            <div class="w-full bg-neutral-50 p-4 rounded-2xl border border-neutral-200 text-xs text-left space-y-2">
                <div class="flex justify-between"><span>ผู้โอน:</span> <span id="receipt-sender" class="font-bold">-</span></div>
                <div class="flex justify-between"><span>ผู้รับ:</span> <span id="receipt-receiver" class="font-bold">-</span></div>
                <div class="flex justify-between"><span>เลขบัญชีผู้รับ:</span> <span id="receipt-acc" class="font-mono font-bold">-</span></div>
                <div class="flex justify-between border-t pt-2 font-bold text-sm text-emerald-600"><span>จำนวนเงิน:</span> <span id="receipt-amount">- 🪙</span></div>
            </div>
            <button onclick="closeReceiptModal()" class="w-full py-2.5 rounded-xl text-xs font-bold royal-btn cursor-pointer">ปิดสลิป</button>
        </div>
    </div>

    <!-- Supabase & Config Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        let currentUserId = null;
        let userCoins = 0;
        let userCookies = 0;

        async function initBank() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            currentUserId = session.user.id;
            loadBankData();
        }

        async function loadBankData() {
            try {
                const { data, error } = await supabase.from('users').select('*').eq('id', currentUserId).single();
                if (error) throw error;

                if (data) {
                    userCoins = data.coins || 0;
                    userCookies = data.cookies || 0;
                    document.getElementById('bank-coins').innerText = userCoins;
                    document.getElementById('bank-cookies').innerText = userCookies;
                    document.getElementById('account-name-input').value = data.bank_account_name || data.name || 'บัญชีของฉัน';
                    
                    // หากยังไม่มีเลขบัญชี 10 หลัก ให้สุ่มสร้างและบันทึก
                    let accNum = data.bank_account_number;
                    if (!accNum) {
                        accNum = Math.floor(1000000000 + Math.random() * 9000000000).toString();
                        await supabase.from('users').update({ bank_account_number: accNum }).eq('id', currentUserId);
                    }
                    document.getElementById('account-number').innerText = accNum;
                }
            } catch (err) {
                console.error('Error loading bank:', err.message);
            }
        }

        async function updateAccountName(newName) {
            try {
                await supabase.from('users').update({ bank_account_name: newName }).eq('id', currentUserId);
            } catch (err) {
                console.error('Error updating name:', err.message);
            }
        }

        function switchBankTab(tab) {
            document.querySelectorAll('button[id^="btn-"]').forEach(btn => btn.classList.remove('tab-active'));
            document.getElementById(`btn-${tab}`).classList.add('tab-active');

            if (tab === 'transfer') {
                document.getElementById('section-transfer').classList.remove('hidden');
                document.getElementById('section-contacts').classList.add('hidden');
            } else {
                document.getElementById('section-transfer').classList.add('hidden');
                document.getElementById('section-contacts').classList.remove('hidden');
            }
        }

        async function executeTransfer() {
            const accNum = document.getElementById('transfer-acc-num').value.trim();
            const amount = parseInt(document.getElementById('transfer-amount').value);

            if (!accNum || isNaN(amount) || amount <= 0) {
                showPopup('ข้อมูลไม่ถูกต้อง', 'กรุณากรอกเลขบัญชีและจำนวนเงินให้ถูกต้อง', '⚠️');
                return;
            }

            if (userCoins < amount) {
                showPopup('เหรียญไม่พอ', `คุณมี ${userCoins} เหรียญ ไม่เพียงพอสำหรับการโอน`, '🪙');
                return;
            }

            try {
                // ตัดเหรียญผู้โอน
                const newCoins = userCoins - amount;
                const { error } = await supabase.from('users').update({ coins: newCoins }).eq('id', currentUserId);
                if (error) throw error;

                userCoins = newCoins;
                document.getElementById('bank-coins').innerText = userCoins;

                // แสดงสลิป
                document.getElementById('receipt-sender').innerText = document.getElementById('account-name-input').value;
                document.getElementById('receipt-receiver').innerText = 'เพื่อนผู้รับ';
                document.getElementById('receipt-acc').innerText = accNum;
                document.getElementById('receipt-amount').innerText = `${amount.toLocaleString()} 🪙`;
                document.getElementById('receipt-modal').classList.remove('hidden');

            } catch (err) {
                showPopup('เกิดข้อผิดพลาด', err.message, '❌');
            }
        }

        function closeReceiptModal() {
            document.getElementById('receipt-modal').classList.add('hidden');
            document.getElementById('transfer-acc-num').value = '';
            document.getElementById('transfer-amount').value = '';
        }

        function openAddContactModal() {
            showPopup('เพิ่มรายชื่อ', 'ฟังก์ชันบันทึกรายชื่อบัญชีเพื่อน', '👥');
        }

        window.addEventListener('DOMContentLoaded', initBank);
    </script>
</body>
</html>
