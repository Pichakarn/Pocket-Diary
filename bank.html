<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POCKET DIARY - ธนาคาร</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fbfbfb;
            color: #1a1a1a;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            overscroll-behavior-y: auto;
            touch-action: pan-y;
        }
        .royal-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .royal-btn {
            background: #111111;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .royal-btn:hover {
            background: #2d2d2d;
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex flex-col justify-between select-none pb-8">

    <!-- Header -->
    <div class="relative z-20 p-4 max-w-lg mx-auto w-full flex flex-col gap-3">
        <div class="flex items-center justify-between">
            <button onclick="window.location.href='phone.html'" class="royal-card px-4 py-2 rounded-2xl text-xs font-semibold flex items-center gap-2 cursor-pointer shadow-sm">
                <span>←</span> กลับโทรศัพท์
            </button>
            <h1 class="font-bold text-base text-neutral-900 flex items-center gap-2">
                <span>📱</span> ธนาคารส่วนตัว
            </h1>
            <div class="w-20"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="relative z-10 flex-1 max-w-lg mx-auto w-full p-4 space-y-4">
        
        <!-- การ์ดแสดงข้อมูลบัญชี (ชื่อบัญชี, เลขบัญชี 10 หลัก, ยอดเงินคงเหลือ, คุกกี้) -->
        <div class="royal-card rounded-3xl p-6 relative overflow-hidden shadow-xl space-y-4 bg-gradient-to-br from-white via-neutral-50 to-neutral-100">
            <div class="flex justify-between items-start">
                <div>
                    <div class="text-[10px] text-neutral-400 font-bold uppercase tracking-wider">ชื่อบัญชี (แก้ไขได้)</div>
                    <div class="flex items-center gap-2 mt-1">
                        <input type="text" id="input-account-name" placeholder="ชื่อบัญชีของคุณ" class="bg-transparent border-b border-neutral-300 text-sm font-bold text-neutral-900 focus:outline-none focus:border-neutral-900 pb-0.5 w-48">
                        <button onclick="saveAccountName()" class="px-2.5 py-1 bg-neutral-900 text-white rounded-xl text-[10px] font-bold shadow-sm">บันทึก</button>
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-[10px] text-neutral-400 font-bold uppercase tracking-wider">เลขบัญชี (10 หลัก)</div>
                    <div id="display-account-no" class="text-xs font-bold text-neutral-900 mt-1 tracking-widest bg-white px-3 py-1 rounded-xl border border-neutral-200 shadow-inner">----------</div>
                </div>
            </div>

            <div class="pt-2 border-t border-neutral-200/60 flex justify-between items-end">
                <div>
                    <div class="text-[10px] text-neutral-400 font-bold uppercase tracking-wider">ยอดเงินคงเหลือ</div>
                    <div class="text-xl font-bold text-neutral-900 mt-1 flex items-center gap-1.5">
                        <span>🪙</span> <span id="display-balance">0</span> <span class="text-xs font-normal text-neutral-500">เหรียญ</span>
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-[10px] text-neutral-400 font-bold uppercase tracking-wider">คุกกี้สะสม</div>
                    <div class="text-sm font-bold text-amber-700 mt-1 flex items-center justify-end gap-1">
                        <span>🍪</span> <span id="display-cookies">0</span> <span class="text-xs font-normal text-neutral-500">ชิ้น</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- แท็บสลับหมวดหมู่ (1. โอนเงิน, 2. รายชื่อผู้รับเงิน) -->
        <div class="flex gap-2 bg-neutral-100 p-1.5 rounded-2xl">
            <button onclick="switchBankTab('transfer')" id="tab-transfer" class="flex-1 py-2 rounded-xl text-xs font-bold transition-all royal-btn">โอนเงิน</button>
            <button onclick="switchBankTab('contacts')" id="tab-contacts" class="flex-1 py-2 rounded-xl text-xs font-bold transition-all text-neutral-600">รายชื่อผู้รับเงิน</button>
        </div>

        <!-- 1. หมวดโอนเงิน -->
        <div id="section-transfer" class="royal-card rounded-3xl p-6 space-y-4 shadow-xl">
            <h3 class="font-bold text-xs text-neutral-900 border-b border-neutral-100 pb-2">💸 โอนเหรียญให้เพื่อน</h3>
            <div class="space-y-3">
                <div>
                    <label class="text-[10px] text-neutral-400 font-bold">เลขบัญชีผู้รับ (10 หลัก)</label>
                    <input type="text" id="transfer-acc-no" placeholder="กรอกเลขบัญชี 10 หลัก" maxlength="10" class="w-full bg-neutral-50 border border-neutral-200 rounded-xl px-3 py-2 text-xs font-bold text-neutral-900 focus:outline-none focus:border-neutral-900 mt-1">
                </div>
                <div>
                    <label class="text-[10px] text-neutral-400 font-bold">จำนวนเงิน (เหรียญ)</label>
                    <input type="number" id="transfer-amount" placeholder="0" min="1" class="w-full bg-neutral-50 border border-neutral-200 rounded-xl px-3 py-2 text-xs font-bold text-neutral-900 focus:outline-none focus:border-neutral-900 mt-1">
                </div>
                <button onclick="executeTransfer()" class="w-full py-3 rounded-xl text-xs font-bold royal-btn cursor-pointer shadow-md mt-2">
                    ยืนยันการโอนเงิน
                </button>
            </div>
        </div>

        <!-- 2. หมวดรายชื่อผู้รับเงิน (เซฟบัญชีเพื่อน) -->
        <div id="section-contacts" class="space-y-3 hidden">
            <div class="royal-card rounded-3xl p-6 space-y-3 shadow-xl">
                <h3 class="font-bold text-xs text-neutral-900 border-b border-neutral-100 pb-2">📒 บันทึกบัญชีเพื่อน</h3>
                <div class="space-y-2">
                    <input type="text" id="contact-alias-name" placeholder="ชื่อที่จำง่าย (เช่น เพื่อนสนิท)" class="w-full bg-neutral-50 border border-neutral-200 rounded-xl px-3 py-2 text-xs font-bold text-neutral-900 focus:outline-none focus:border-neutral-900">
                    <input type="text" id="contact-acc-no" placeholder="เลขบัญชี 10 หลัก" maxlength="10" class="w-full bg-neutral-50 border border-neutral-200 rounded-xl px-3 py-2 text-xs font-bold text-neutral-900 focus:outline-none focus:border-neutral-900">
                    <button onclick="saveContact()" class="w-full py-2.5 rounded-xl text-xs font-bold royal-btn cursor-pointer shadow-md">บันทึกรายชื่อ</button>
                </div>
            </div>

            <!-- รายการรายชื่อที่เซฟไว้ -->
            <div id="contacts-list-container" class="space-y-2">
                <!-- เรนเดอร์รายชื่อเพื่อนที่เซฟไว้ -->
            </div>
        </div>

    </div>

    <!-- Popup แสดงสลิปโอนเงินสำเร็จ -->
    <div id="transfer-slip-popup" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden" style="background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);">
        <div class="royal-card w-full max-w-xs rounded-3xl p-6 relative flex flex-col items-center shadow-2xl text-center space-y-4 bg-white">
            <div class="w-12 h-12 bg-neutral-900 text-white rounded-2xl flex items-center justify-center text-xl shadow-md">🧾</div>
            <h3 class="font-bold text-sm text-neutral-900">สลิปการโอนเงินสำเร็จ</h3>
            
            <div class="w-full bg-neutral-50 p-4 rounded-2xl border border-neutral-200 text-left space-y-2 text-xs">
                <div class="flex justify-between"><span class="text-neutral-500">ผู้โอน:</span> <span id="slip-sender" class="font-bold text-neutral-900">--</span></div>
                <div class="flex justify-between"><span class="text-neutral-500">ผู้รับ:</span> <span id="slip-receiver" class="font-bold text-neutral-900">--</span></div>
                <div class="flex justify-between"><span class="text-neutral-500">เลขบัญชีผู้รับ:</span> <span id="slip-receiver-no" class="font-bold text-neutral-900">--</span></div>
                <div class="border-t border-neutral-200 pt-2 flex justify-between font-bold text-sm text-neutral-900"><span>จำนวนเงิน:</span> <span id="slip-amount" class="text-emerald-700">-- เหรียญ</span></div>
            </div>

            <button onclick="closeSlipPopup()" class="w-full py-2.5 rounded-xl text-xs font-bold royal-btn cursor-pointer">ตกลง</button>
        </div>
    </div>

    <!-- Popup แจ้งเตือนทั่วไป (ตามกติกา: เปลี่ยนช่องข้อความให้เป็น popup น่ารักๆ เสมอ) -->
    <div id="alert-popup" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden" style="background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);">
        <div class="royal-card w-full max-w-xs rounded-3xl p-6 relative flex flex-col items-center shadow-2xl text-center space-y-3">
            <div id="alert-icon" class="text-3xl mb-1">✨</div>
            <h3 id="alert-title" class="font-bold text-sm text-neutral-900">แจ้งเตือน</h3>
            <p id="alert-message" class="text-xs text-neutral-600">ข้อความแจ้งเตือน</p>
            <button onclick="closeAlertPopup()" class="w-full py-2 rounded-xl text-xs font-bold royal-btn cursor-pointer mt-2">ตกลง</button>
        </div>
    </div>

    <!-- Supabase & Config Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        let currentUserId = null;
        let currentUserAccountNo = null;
        let currentUserCoins = 0;
        let currentUserAccountName = '';

        async function initBank() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            currentUserId = session.user.id;
            await loadUserBankData();
            await loadSavedContacts();
        }

        async function loadUserBankData() {
            let { data: user, error } = await supabase
                .from('users')
                .select('*')
                .eq('id', currentUserId)
                .single();

            if (user) {
                // หากยังไม่มีเลขบัญชี 10 หลัก ให้สุ่มสร้างใหม่ที่ไม่ซ้ำในระบบ
                if (!user.account_no) {
                    currentUserAccountNo = await generateUniqueAccountNumber();
                    await supabase.from('users').update({ account_no: currentUserAccountNo }).eq('id', currentUserId);
                } else {
                    currentUserAccountNo = user.account_no;
                }

                currentUserAccountName = user.account_name || user.name || 'บัญชีของฉัน';
                currentUserCoins = user.coins || 0;

                document.getElementById('input-account-name').value = currentUserAccountName;
                document.getElementById('display-account-no').innerText = currentUserAccountNo;
                document.getElementById('display-balance').innerText = currentUserCoins.toLocaleString();
                document.getElementById('display-cookies').innerText = (user.cookies || 0).toLocaleString();
            }
        }

        async function generateUniqueAccountNumber() {
            let isUnique = false;
            let randomAccNo = '';
            while (!isUnique) {
                randomAccNo = Math.floor(1000000000 + Math.random() * 9000000000).toString();
                const { data } = await supabase.from('users').select('account_no').eq('account_no', randomAccNo).single();
                if (!data) isUnique = true;
            }
            return randomAccNo;
        }

        async function saveAccountName() {
            const newName = document.getElementById('input-account-name').value.trim();
            if (!newName) {
                showAlert('ชื่อไม่ถูกต้อง', 'กรุณากรอกชื่อบัญชีของคุณ', '⚠️');
                return;
            }

            const { error } = await supabase.from('users').update({ account_name: newName }).eq('id', currentUserId);
            if (error) {
                showAlert('บันทึกไม่สำเร็จ', error.message, '❌');
            } else {
                currentUserAccountName = newName;
                showAlert('สำเร็จ', 'เปลี่ยนชื่อบัญชีเรียบร้อยแล้ว', '✨');
            }
        }

        function switchBankTab(tabKey) {
            const btnTransfer = document.getElementById('tab-transfer');
            const btnContacts = document.getElementById('tab-contacts');
            const secTransfer = document.getElementById('section-transfer');
            const secContacts = document.getElementById('section-contacts');

            if (tabKey === 'transfer') {
                btnTransfer.className = 'flex-1 py-2 rounded-xl text-xs font-bold transition-all royal-btn';
                btnContacts.className = 'flex-1 py-2 rounded-xl text-xs font-bold transition-all text-neutral-600';
                secTransfer.classList.remove('hidden');
                secContacts.classList.add('hidden');
            } else {
                btnContacts.className = 'flex-1 py-2 rounded-xl text-xs font-bold transition-all royal-btn';
                btnTransfer.className = 'flex-1 py-2 rounded-xl text-xs font-bold transition-all text-neutral-600';
                secContacts.classList.remove('hidden');
                secTransfer.classList.add('hidden');
            }
        }

        async function executeTransfer() {
            const receiverAccNo = document.getElementById('transfer-acc-no').value.trim();
            const amount = parseInt(document.getElementById('transfer-amount').value);

            if (!receiverAccNo || receiverAccNo.length !== 10) {
                showAlert('เลขบัญชีไม่ถูกต้อง', 'กรุณากรอกเลขบัญชีผู้รับให้ครบ 10 หลัก', '⚠️');
                return;
            }
            if (isNaN(amount) || amount <= 0) {
                showAlert('จำนวนเงินไม่ถูกต้อง', 'กรุณากรอกจำนวนเงินที่ต้องการโอน', '⚠️');
                return;
            }
            if (receiverAccNo === currentUserAccountNo) {
                showAlert('ไม่สามารถโอนได้', 'ไม่สามารถโอนเงินให้บัญชีตนเองได้', '⚠️');
                return;
            }
            if (currentUserCoins < amount) {
                showAlert('เงินไม่พอ', `คุณมี ${currentUserCoins} เหรียญ แต่ต้องการโอน ${amount} เหรียญ`, '🪙');
                return;
            }

            // ค้นหาบัญชีผู้รับใน Supabase
            const { data: receiverUser, error: receiverError } = await supabase
                .from('users')
                .select('*')
                .eq('account_no', receiverAccNo)
                .single();

            if (receiverError || !receiverUser) {
                showAlert('ไม่พบบัญชี', 'ไม่พบเลขบัญชีผู้รับนี้ในระบบ กรุณาตรวจสอบอีกครั้ง', '❌');
                return;
            }

            // หักเงินผู้โอน
            const newSenderCoins = currentUserCoins - amount;
            await supabase.from('users').update({ coins: newSenderCoins }).eq('id', currentUserId);

            // เพิ่มเงินผู้รับ
            const newReceiverCoins = (receiverUser.coins || 0) + amount;
            await supabase.from('users').update({ coins: newReceiverCoins }).eq('id', receiverUser.id);

            currentUserCoins = newSenderCoins;
            document.getElementById('display-balance').innerText = currentUserCoins.toLocaleString();

            // แสดงสลิป
            document.getElementById('slip-sender').innerText = currentUserAccountName;
            document.getElementById('slip-receiver').innerText = receiverUser.account_name || receiverUser.name || 'ผู้รับ';
            document.getElementById('slip-receiver-no').innerText = receiverAccNo;
            document.getElementById('slip-amount').innerText = `${amount.toLocaleString()} เหรียญ`;
            document.getElementById('transfer-slip-popup').classList.remove('hidden');

            // เคลียร์ค่าฟอร์ม
            document.getElementById('transfer-acc-no').value = '';
            document.getElementById('transfer-amount').value = '';
        }

        function closeSlipPopup() {
            document.getElementById('transfer-slip-popup').classList.add('hidden');
        }

        async function saveContact() {
            const aliasName = document.getElementById('contact-alias-name').value.trim();
            const accNo = document.getElementById('contact-acc-no').value.trim();

            if (!aliasName || !accNo || accNo.length !== 10) {
                showAlert('ข้อมูลไม่ครบถ้วน', 'กรุณากรอกชื่อที่จำง่ายและเลขบัญชี 10 หลักให้ถูกต้อง', '⚠️');
                return;
            }

            const { error } = await supabase.from('user_contacts').insert([{
                user_id: currentUserId,
                alias_name: aliasName,
                account_no: accNo
            }]);

            if (error) {
                showAlert('บันทึกไม่สำเร็จ', error.message, '❌');
            } else {
                showAlert('สำเร็จ', 'บันทึกรายชื่อผู้รับเงินเรียบร้อยแล้ว', '✨');
                document.getElementById('contact-alias-name').value = '';
                document.getElementById('contact-acc-no').value = '';
                loadSavedContacts();
            }
        }

        async function loadSavedContacts() {
            const { data: contacts } = await supabase
                .from('user_contacts')
                .select('*')
                .eq('user_id', currentUserId);

            const container = document.getElementById('contacts-list-container');
            container.innerHTML = '';

            if (!contacts || contacts.length === 0) {
                container.innerHTML = '<div class="text-center text-xs text-neutral-400 py-6">ยังไม่มีรายชื่อบัญชีที่บันทึกไว้</div>';
                return;
            }

            contacts.forEach(c => {
                const div = document.createElement('div');
                div.className = 'royal-card p-4 rounded-2xl flex items-center justify-between shadow-sm cursor-pointer hover:shadow-md transition-all';
                div.innerHTML = `
                    <div>
                        <div class="font-bold text-xs text-neutral-900">${c.alias_name}</div>
                        <div class="text-[10px] text-neutral-500 mt-0.5 tracking-wider">เลขบัญชี: ${c.account_no}</div>
                    </div>
                    <button onclick="selectContactForTransfer('${c.account_no}')" class="px-3 py-1.5 bg-neutral-900 text-white rounded-xl text-[10px] font-bold shadow-sm">โอนเงิน</button>
                `;
                container.appendChild(div);
            });
        }

        function selectContactForTransfer(accNo) {
            switchBankTab('transfer');
            document.getElementById('transfer-acc-no').value = accNo;
        }

        function showAlert(title, message, icon = '✨') {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            document.getElementById('alert-icon').innerText = icon;
            document.getElementById('alert-popup').classList.remove('hidden');
        }

        function closeAlertPopup() {
            document.getElementById('alert-popup').classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', initBank);
    </script>
</body>
</html>
