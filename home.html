<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Diary - หน้าหลัก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #f7ebed 50%, #e8f4f8 100%);
        }
        .journal-book {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 15px 35px rgba(216, 180, 204, 0.2);
        }
        .phone-modal {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 relative overflow-x-hidden">

    <!-- แถบด้านบน: ข้อมูลผู้เล่น & ปุ่มออกจากระบบ -->
    <div class="w-full max-w-4xl flex justify-between items-center bg-white/70 backdrop-blur-md px-6 py-3 rounded-2xl border border-pink-100 shadow-sm mt-2">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-pink-100 flex items-center justify-center text-pink-500 font-bold shadow-inner">
                📖
            </div>
            <div>
                <h2 id="user-email-display" class="text-xs font-semibold text-gray-700">กำลังโหลด...</h2>
                <span id="user-role-badge" class="inline-block px-2 py-0.5 text-[10px] rounded-full bg-pink-100 text-pink-600 font-medium">ผู้เล่นทั่วไป</span>
            </div>
        </div>
        <button id="logout-btn" class="px-4 py-1.5 bg-gray-100 hover:bg-red-50 hover:text-red-500 text-gray-600 text-xs font-medium rounded-xl transition cursor-pointer">
            ออกจากระบบ
        </button>
    </div>

    <!-- พื้นที่สมุดบันทึกหลัก (Home Content) -->
    <main class="w-full max-w-4xl my-auto py-8 flex flex-col items-center text-center">
        <div class="journal-book w-full max-w-xl rounded-3xl p-8 border border-pink-100 relative">
            <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-pink-200 text-pink-700 text-[10px] font-bold px-4 py-1 rounded-full uppercase tracking-wider">
                My Pocket Journal
            </div>
            
            <h1 class="text-2xl font-bold text-gray-700 mt-2 mb-2">ยินดีต้อนรับสู่ Pocket Diary ✨</h1>
            <p class="text-gray-400 text-xs mb-6">เลือกเปิดสมุดภาพตัวละคร หรือกดที่ไอคอนมือถือด้านล่างเพื่อเข้าถึงฟีเจอร์อื่นๆ ได้เลย</p>

            <!-- ปุ่มทางลัดหลัก -->
            <div class="grid grid-cols-2 gap-4">
                <button onclick="alert('ฟีเจอร์สมุดภาพตัวละคร กำลังจะมาเร็วๆ นี้ค่า!')" class="p-4 rounded-2xl bg-pink-50 hover:bg-pink-100 text-pink-600 font-medium text-sm transition flex flex-col items-center justify-center space-y-2 cursor-pointer border border-pink-100 shadow-sm">
                    <span class="text-2xl">📚</span>
                    <span>สมุดภาพตัวละคร</span>
                </button>
                <button onclick="alert('ฟีเจอร์กาชาสุ่มสกิน กำลังจะมาเร็วๆ นี้ค่า!')" class="p-4 rounded-2xl bg-blue-50 hover:bg-blue-100 text-blue-600 font-medium text-sm transition flex flex-col items-center justify-center space-y-2 cursor-pointer border border-blue-100 shadow-sm">
                    <span class="text-2xl">🎁</span>
                    <span>สุ่มกาชา (Gacha)</span>
                </button>
            </div>
        </div>
    </main>

    <!-- ไอคอนมือถือลอยได้มุมขวาล่าง สำหรับเปิด Smartphone Hub -->
    <div class="fixed bottom-6 right-6 z-40">
        <button id="open-phone-btn" class="w-14 h-14 bg-gradient-to-tr from-pink-400 to-pink-500 hover:from-pink-500 hover:to-pink-600 text-white rounded-full shadow-lg shadow-pink-300/50 flex items-center justify-center text-2xl transition transform hover:scale-105 cursor-pointer">
            📱
        </button>
    </div>

    <!-- Modal: หน้าจอสมาร์ทโฟนจำลองในเกม -->
    <div id="smartphone-modal" class="fixed inset-0 bg-black/30 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50 transition-opacity">
        <div class="phone-modal w-full max-w-xs h-[520px] rounded-[40px] border-8 border-gray-800 p-5 flex flex-col justify-between relative shadow-2xl overflow-hidden">
            
            <!-- ลำโพงและกล้องหน้าจำลองขอบมือถือ -->
            <div class="absolute top-2 left-1/2 transform -translate-x-1/2 w-20 h-4 bg-gray-800 rounded-full flex items-center justify-center">
                <div class="w-2 h-2 bg-gray-700 rounded-full mr-2"></div>
                <div class="w-8 h-1 bg-gray-700 rounded-full"></div>
            </div>

            <!-- Header มือถือ -->
            <div class="flex justify-between items-center mt-4 px-2 text-xs text-gray-500 font-medium">
                <span id="phone-time">12:00</span>
                <span>PocketOS 📱</span>
            </div>

            <!-- แอปพลิเคชันในมือถือ (App Grid) -->
            <div class="grid grid-cols-3 gap-3 my-auto px-2 overflow-y-auto">
                <button onclick="alert('เปิดห้องแชทกับเพื่อน')" class="flex flex-col items-center p-2 rounded-2xl hover:bg-pink-50 transition cursor-pointer">
                    <div class="w-12 h-12 bg-pink-100 rounded-2xl flex items-center justify-center text-xl mb-1 shadow-sm">💬</div>
                    <span class="text-[10px] text-gray-600">Chat</span>
                </button>
                <button onclick="alert('เปิดระบบธนาคาร')" class="flex flex-col items-center p-2 rounded-2xl hover:bg-green-50 transition cursor-pointer">
                    <div class="w-12 h-12 bg-green-100 rounded-2xl flex items-center justify-center text-xl mb-1 shadow-sm">💳</div>
                    <span class="text-[10px] text-gray-600">Bank</span>
                </button>
                <button onclick="alert('เปิดร้านค้าไอเทม')" class="flex flex-col items-center p-2 rounded-2xl hover:bg-yellow-50 transition cursor-pointer">
                    <div class="w-12 h-12 bg-yellow-100 rounded-2xl flex items-center justify-center text-xl mb-1 shadow-sm">🛒</div>
                    <span class="text-[10px] text-gray-600">Shop</span>
                </button>
                <button onclick="alert('ใส่โค้ดรับรางวัล')" class="flex flex-col items-center p-2 rounded-2xl hover:bg-purple-50 transition cursor-pointer">
                    <div class="w-12 h-12 bg-purple-100 rounded-2xl flex items-center justify-center text-xl mb-1 shadow-sm">🎟️</div>
                    <span class="text-[10px] text-gray-600">Code</span>
                </button>

                <!-- 🛠️ โหมดแอดมิน (จะแสดงเฉพาะแอดมินเท่านั้น ถูกซ่อนไว้สำหรับยูสเซอร์อื่น) -->
                <button id="admin-tool-app" onclick="alert('ยินดีต้อนรับสู่ระบบ Admin Tools')" class="flex flex-col items-center p-2 rounded-2xl hover:bg-red-50 transition cursor-pointer hidden">
                    <div class="w-12 h-12 bg-red-100 rounded-2xl flex items-center justify-center text-xl mb-1 shadow-sm">🛠️</div>
                    <span class="text-[10px] text-red-500 font-bold">Admin</span>
                </button>
            </div>

            <!-- ปุ่ม Home Bar ด้านล่างมือถือสำหรับปิดจอ -->
            <div class="text-center pt-2">
                <button id="close-phone-btn" class="w-24 h-1.5 bg-gray-300 hover:bg-gray-400 rounded-full mx-auto transition cursor-pointer"></button>
            </div>
        </div>
    </div>

    <!-- Script ควบคุมหน้า Home และสิทธิ์ Admin -->
    <script type="module">
        import { supabase } from './supabase-config.js';

        const userEmailDisplay = document.getElementById('user-email-display');
        const userRoleBadge = document.getElementById('user-role-badge');
        const logoutBtn = document.getElementById('logout-btn');
        const openPhoneBtn = document.getElementById('open-phone-btn');
        const smartphoneModal = document.getElementById('smartphone-modal');
        const closePhoneBtn = document.getElementById('close-phone-btn');
        const adminToolApp = document.getElementById('admin-tool-app');

        // 1. ตรวจสอบ Session และสิทธิ์ผู้ใช้งานตอนโหลดหน้า
        async function initPage() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (!session) {
                // ถ้ายังไม่ได้ล็อกอิน ให้เด้งกลับไปหน้า index.html ทันที
                window.location.href = 'index.html';
                return;
            }

            const email = session.user.email;
            userEmailDisplay.textContent = email;

            // เช็กสิทธิ์แอดมินจากอีเมลพิเศษ หรือค่าที่บันทึกไว้ใน LocalStorage
            const isAdmin = (email === 'ciiderydem@gmail.com') || (localStorage.getItem('pocket_diary_is_admin') === 'true');

            if (isAdmin) {
                userRoleBadge.textContent = 'ผู้ดูแลระบบ (Admin)';
                userRoleBadge.className = 'inline-block px-2 py-0.5 text-[10px] rounded-full bg-red-100 text-red-600 font-bold';
                // แสดงปุ่มโหมดแอดมินในมือถือ
                adminToolApp.classList.remove('hidden');
            } else {
                userRoleBadge.textContent = 'ผู้เล่นทั่วไป';
                userRoleBadge.className = 'inline-block px-2 py-0.5 text-[10px] rounded-full bg-pink-100 text-pink-600 font-medium';
                // ซ่อนปุ่มโหมดแอดมิน
                adminToolApp.classList.add('hidden');
            }
        }

        initPage();

        // 2. จัดการเปิด-ปิดหน้าจอมือถือจำลอง
        openPhoneBtn.addEventListener('click', () => {
            smartphoneModal.classList.remove('hidden');
        });

        closePhoneBtn.addEventListener('click', () => {
            smartphoneModal.classList.add('hidden');
        });

        smartphoneModal.addEventListener('click', (e) => {
            if (e.target === smartphoneModal) {
                smartphoneModal.classList.add('hidden');
            }
        });

        // 3. ระบบออกจากระบบ
        logoutBtn.addEventListener('click', async () => {
            await supabase.auth.signOut();
            localStorage.removeItem('pocket_diary_is_admin');
            window.location.href = 'index.html';
        });

        // อัปเดตนาฬิกาบนมือถือเรียลไทม์
        function updatePhoneClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('phone-time').textContent = `${hours}:${minutes}`;
        }
        updatePhoneClock();
        setInterval(updatePhoneClock, 60000);
    </script>
</body>
</html>
