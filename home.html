<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POCKET DIARY - หน้าหลัก</title>
  
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Font: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-pearl: #FDFBFB;
      --bg-pearl-gradient: linear-gradient(135deg, #FFFFFF 0%, #EFECE6 100%);
      --royal-black: #111111;
      --royal-gold: #D4AF37;
      --accent-gray: #555555;
      --border-color: rgba(17, 17, 17, 0.15);
      --shadow-luxury: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ล็อกหน้าจอไม่ให้ขยับซ้ายขวา และบนล่าง */
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-pearl-gradient);
      color: var(--royal-black);
      position: relative;
    }

    /* พื้นที่ล็อบบี้ (แสดงพื้นหลัง + ตัวละคร) */
    .lobby-container {
      width: 100%;
      height: calc(100vh - 85px);
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      background-size: cover;
      background-position: center;
      background-color: #EFECE6;
    }

    /* สกรีน/ตัวละครที่ยืนอยู่หน้าล็อบบี้ */
    .lobby-character {
      height: 75vh;
      max-width: 95%;
      object-fit: contain;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.18));
      transition: all 0.3s ease;
      z-index: 2;
    }

    /* แถบข้อมูลด้านบน (ชื่อผู้ใช้ / Coins / Cookies) */
    .top-hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .user-pill {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      padding: 8px 15px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      pointer-events: auto;
    }

    .user-pill img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--royal-black);
    }

    .user-info-text h3 {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.1;
    }

    .user-info-text p {
      font-size: 0.7rem;
      color: var(--accent-gray);
    }

    .currency-pill-group {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .currency-pill {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .coin-icon {
      color: var(--royal-gold);
    }

    .cookie-icon {
      color: #C88A58;
    }

    /* แถบเมนูด้านล่าง (5 ฟังก์ชัน: Dairy, Gacha, Inventory, Minigame, Phone) */
    .bottom-nav {
      height: 85px;
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(15px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
      z-index: 20;
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--accent-gray);
      cursor: pointer;
      transition: all 0.2s ease;
      gap: 4px;
      padding: 8px 0;
      border-radius: 16px;
    }

    .nav-btn i {
      font-size: 1.35rem;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .nav-btn span {
      font-size: 0.72rem;
      font-weight: 500;
    }

    .nav-btn:hover, .nav-btn.active {
      color: var(--royal-black);
    }

    .nav-btn:active i {
      transform: scale(0.9);
    }

    .nav-btn.phone-special {
      background: var(--royal-black);
      color: #FFFFFF;
      max-width: 65px;
      height: 62px;
      border-radius: 20px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    .nav-btn.phone-special i {
      color: var(--royal-gold);
      font-size: 1.4rem;
    }

    /* Custom Popup น่ารักๆ แทน Alert */
    .popup-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .popup-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .popup-card {
      width: 85%;
      max-width: 320px;
      background: #FFFFFF;
      border: 2px solid var(--royal-black);
      border-radius: 20px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .popup-overlay.show .popup-card {
      transform: scale(1);
    }

    .popup-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--royal-black);
    }

    .popup-desc {
      font-size: 0.9rem;
      color: var(--accent-gray);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .popup-btn {
      width: 100%;
      padding: 10px;
      background: var(--royal-black);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- แถบด้านบนแสดงชื่อผู้ใช้ และ Coins / Cookies เรียลไทม์ -->
  <div class="top-hud">
    <div class="user-pill">
      <img id="userAvatarImg" src="https://via.placeholder.com/150" alt="Avatar">
      <div class="user-info-text">
        <h3 id="userNameDisplay">Loading...</h3>
        <p id="userUsernameDisplay">@username</p>
      </div>
    </div>

    <div class="currency-pill-group">
      <div class="currency-pill">
        <i class="fa-solid fa-coins coin-icon"></i>
        <span id="userCoinsDisplay">0</span>
      </div>
      <div class="currency-pill">
        <i class="fa-solid fa-cookie-bite cookie-icon"></i>
        <span id="userCookiesDisplay">0</span>
      </div>
    </div>
  </div>

  <!-- หน้าจอ Lobby (แสดง Background + ตัวละครที่สวมใส่) -->
  <div class="lobby-container" id="lobbyBackground">
    <img id="lobbyCharacterImg" class="lobby-character" src="" alt="Character">
  </div>

  <!-- เมนูด้านล่าง 5 ฟังก์ชันหลัก -->
  <nav class="bottom-nav">
    <button class="nav-btn" onclick="goToPage('diary.html')">
      <i class="fa-solid fa-book"></i>
      <span>Dairy</span>
    </button>
    <button class="nav-btn" onclick="goToPage('gacha.html')">
      <i class="fa-solid fa-star"></i>
      <span>Gacha</span>
    </button>
    <button class="nav-btn" onclick="goToPage('inventory.html')">
      <i class="fa-solid fa-bag-shopping"></i>
      <span>Inventory</span>
    </button>
    <button class="nav-btn" onclick="goToPage('minigame.html')">
      <i class="fa-solid fa-gamepad"></i>
      <span>Minigame</span>
    </button>
    <button class="nav-btn phone-special" onclick="goToPage('phone.html')">
      <i class="fa-solid fa-mobile-screen-button"></i>
      <span>Phone</span>
    </button>
  </nav>

  <!-- Custom Popup -->
  <div class="popup-overlay" id="customPopup">
    <div class="popup-card">
      <div class="popup-title" id="popupTitle">แจ้งเตือน</div>
      <div class="popup-desc" id="popupDesc">ข้อความแจ้งเตือน...</div>
      <button class="popup-btn" onclick="closePopup()">ตกลง</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://ooozqddxvxeykwubumli.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xwsBeo4TJfLSwnQUiV2uSw_7GwLZd85';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.showPopup = function(title, desc) {
      document.getElementById('popupTitle').innerText = title;
      document.getElementById('popupDesc').innerText = desc;
      document.getElementById('customPopup').classList.add('show');
    }

    window.closePopup = function() {
      document.getElementById('customPopup').classList.remove('show');
    }

    window.goToPage = function(pageName) {
      window.location.href = pageName;
    }

    // ดึงข้อมูล User จาก sessionStorage (หรือตรวจสอบ auth)
    const localUserRaw = sessionStorage.getItem('pocket_diary_user');
    if (!localUserRaw) {
      window.location.href = 'index.html';
    }
    const localUser = JSON.parse(localUserRaw);

    async function loadUserDataRealtime() {
      try {
        const { data: user, error } = await supabase
          .from('users')
          .select('*')
          .eq('id', localUser.id)
          .single();

        if (error || !user) return;

        // อัปเดตข้อมูลบนหน้าจอ
        document.getElementById('userNameDisplay').innerText = user.name || 'Pocket User';
        document.getElementById('userUsernameDisplay').innerText = `@${user.username || 'user'}`;
        document.getElementById('userCoinsDisplay').innerText = Number(user.coins || 0).toLocaleString();
        document.getElementById('userCookiesDisplay').innerText = Number(user.cookies || 0).toLocaleString();

        // โหลดรูปโปรไฟล์ (ถ้ามีเก็บไว้ใน profile_image หรือค่าเริ่มต้น)
        const avatarImg = document.getElementById('userAvatarImg');
        avatarImg.src = user.profile_image || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150';

        // โหลดตัวละคร/สกิน และ Background ที่ตั้งไว้โชว์หน้าล็อบบี้
        // (สามารถผูกคอลัมน์ active_skin_full_image และ active_background_image ในตาราง users ได้)
        const lobbyCharImg = document.getElementById('lobbyCharacterImg');
        lobbyCharImg.src = user.active_skin_full_image || 'https://res.cloudinary.com/demo/image/upload/v1312461204/sample.jpg';

        const lobbyBg = document.getElementById('lobbyBackground');
        if (user.active_background_image) {
          lobbyBg.style.backgroundImage = `url('${user.active_background_image}')`;
        }

      } catch (err) {
        console.error('Error loading user data:', err);
      }
    }

    // เรียกโหลดครั้งแรก
    loadUserDataRealtime();

    // สมัครรับการเปลี่ยนแปลง Realtime จากตาราง users
    supabase
      .channel('public:users')
      .on('postgres_changes', {
        event: 'UPDATE',
        schema: 'public',
        table: 'users',
        filter: `id=eq.${localUser.id}`
      }, (payload) => {
        const updated = payload.new;
        document.getElementById('userNameDisplay').innerText = updated.name;
        document.getElementById('userCoinsDisplay').innerText = Number(updated.coins).toLocaleString();
        document.getElementById('userCookiesDisplay').innerText = Number(updated.cookies).toLocaleString();
        if (updated.active_skin_full_image) {
          document.getElementById('lobbyCharacterImg').src = updated.active_skin_full_image;
        }
        if (updated.active_background_image) {
          document.getElementById('lobbyBackground').style.backgroundImage = `url('${updated.active_background_image}')`;
        }
      })
      .subscribe();
  </script>
</body>
</html>
