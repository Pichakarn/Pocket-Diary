<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lobby - POCKET DIARY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            overflow-x: hidden;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body id="lobby-bg" class="flex flex-col justify-between p-3 sm:p-6 text-gray-700 min-h-[100dvh]" style="background-image: url('https://res.cloudinary.com/ncpkgyfz/image/upload/v1789129860/xwcdfvquvalzrhnwjzxo.png');">

    <!-- แถบด้านบน (Navbar) -->
    <header class="w-full max-w-5xl mx-auto flex justify-between items-center glass-panel px-4 py-2.5 rounded-2xl shadow-sm z-10 shrink-0">
        <div class="flex items-center space-x-2.5">
            <div class="w-9 h-9 rounded-xl bg-pink-100 flex items-center justify-center text-base shadow-inner">📖</div>
            <div>
                <span id="user-email-display" class="font-bold text-gray-800 text-xs block">กำลังโหลด...</span>
                <span id="role-badge" class="text-[10px] text-pink-500 font-medium">ผู้ใช้งานทั่วไป</span>
            </div>
        </div>
        <button id="logout-btn" class="px-3 py-1.5 bg-pink-50 hover:bg-pink-100 text-pink-600 font-medium text-xs rounded-xl transition cursor-pointer">
            ออก
        </button>
    </header>

    <!-- พื้นที่ตรงกลาง: ตัวละครหลักในล็อบบี้ (ชื่ออยู่ด้านบนแผ่นป้าย, ตัวละครอยู่ด้านล่าง) -->
    <main class="w-full max-w-5xl mx-auto my-auto flex flex-col items-center justify-center relative py-8">
        <div class="flex flex-col items-center transform hover:scale-105 transition duration-300 cursor-pointer" onclick="openCharacterSelector()">
            <!-- แผ่นป้ายชื่อตัวละคร (ย้ายมาไว้ด้านบนหัว) -->
            <div class="glass-panel px-5 py-2 rounded-full shadow-lg text-center mb-4 z-10 border border-white/90">
                <span id="lobby-char-name" class="text-xs sm:text-sm font-bold text-gray-800 tracking-wide">ไอจัง (นักเรียนฝึกหัด)</span>
            </div>

            <!-- รูปตัวละครหลัก (แสดงเป็นตัวละครยืนเต็มตัว/สัดส่วนแนวตั้ง) -->
            <div id="lobby-char-container" class="w-48 h-64 sm:w-56 sm:h-72 flex items-center justify-center relative drop-shadow-2xl">
                <!-- กรณีถ้า avatar เป็น URL รูปภาพ จะถูกเรนเดอร์เป็น tag img ถ้าเป็น emoji/text จะแสดงผลผ่าน span ปกติ -->
                <span id="lobby-char-avatar" class="text-7xl sm:text-8xl filter drop-shadow-md">🌸</span>
            </div>
        </div>
    </main>

    <!-- เมนูด้านล่าง (จัดวางตามตำแหน่งใหม่ ทั้งหมดเป็นลิงก์เปลี่ยนหน้า HTML) -->
    <footer class="w-full max-w-5xl mx-auto flex justify-between items-end z-10 pb-3 sm:pb-4 px-2 sm:px-6 shrink-0">
        <!-- ฝั่งซ้าย: DIARY, MINIGAME และ GACHA (อยู่ด้านบนหัว DIARY) -->
        <div class="flex items-end space-x-3 sm:space-x-5">
            <!-- DIARY & GACHA Container -->
            <div class="flex flex-col items-center relative">
                <!-- 3. GACHA (อยู่ด้านบนหัว DIARY) -->
                <a href="gacha.html" class="absolute -top-24 sm:-top-28 flex flex-col items-center hover:scale-105 transition cursor-pointer group focus:outline-none">
                    <img src="https://res.cloudinary.com/ncpkgyfz/image/upload/v1789125922/mag4vfdtgzzwjpwmv5w4.png" alt="Gacha" class="w-[67px] h-[67px] sm:w-[86px] sm:h-[86px] object-contain drop-shadow-lg mb-1">
                    <span class="text-[12px] sm:text-sm font-bold text-white tracking-wider drop-shadow-md">GACHA</span>
                </a>

                <!-- 1. DIARY -->
                <a href="diary.html" class="flex flex-col items-center hover:scale-105 transition cursor-pointer group focus:outline-none">
                    <img src="https://res.cloudinary.com/ncpkgyfz/image/upload/v1789125418/p6eluz9xd15wwwdc5yyo.png" alt="Diary" class="w-[67px] h-[67px] sm:w-[86px] sm:h-[86px] object-contain drop-shadow-lg mb-1">
                    <span class="text-[12px] sm:text-sm font-bold text-white tracking-wider drop-shadow-md">DIARY</span>
                </a>
            </div>

            <!-- 2. MINIGAME (อยู่ทางขวาของ DIARY และใกล้กัน) -->
            <a href="minigame.html" class="flex flex-col items-center hover:scale-105 transition cursor-pointer group focus:outline-none">
                <img src="https://res.cloudinary.com/ncpkgyfz/image/upload/v1789125402/pb9q6zjgfueuvtbooohr.png" alt="Minigame" class="w-[67px] h-[67px] sm:w-[86px] sm:h-[86px] object-contain drop-shadow-lg mb-1">
                <span class="text-[12px] sm:text-sm font-bold text-white tracking-wider drop-shadow-md">MINIGAME</span>
            </a>
        </div>

        <!-- ฝั่งขวา: INVENTORY (ด้านล่างขวาสุด) และ PHONE (อยู่ด้านบนหัว INVENTORY) -->
        <div class="flex items-end space-x-3 sm:space-x-5">
            <div class="flex flex-col items-center relative">
                <!-- 5. PHONE (อยู่ด้านบนหัว INVENTORY) -->
                <a href="phone.html" class="absolute -top-24 sm:-top-28 flex flex-col items-center hover:scale-105 transition cursor-pointer group focus:outline-none">
                    <img src="https://res.cloudinary.com/ncpkgyfz/image/upload/v1789125433/merda4dtpylmqa0y4jgn.png" alt="Phone" class="w-[67px] h-[67px] sm:w-[86px] sm:h-[86px] object-contain drop-shadow-lg mb-1">
                    <span class="text-[12px] sm:text-sm font-bold text-white tracking-wider drop-shadow-md">PHONE</span>
                </a>

                <!-- 4. INVENTORY (ด้านล่างขวาสุด) -->
                <a href="inventory.html" class="flex flex-col items-center hover:scale-105 transition cursor-pointer group focus:outline-none">
                    <img src="https://res.cloudinary.com/ncpkgyfz/image/upload/v1789125395/z6aukuewgjba0mdbgsfz.png" alt="Inventory" class="w-[67px] h-[67px] sm:w-[86px] sm:h-[86px] object-contain drop-shadow-lg mb-1">
                    <span class="text-[12px] sm:text-sm font-bold text-white tracking-wider drop-shadow-md">INVENTORY</span>
                </a>
            </div>
        </div>
    </footer>

    <script>
        const userEmail = localStorage.getItem('pocket_diary_user');
        const userRole = localStorage.getItem('pocket_diary_role');

        if (!userEmail) {
            window.location.href = 'index.html';
        }

        document.getElementById('user-email-display').textContent = userEmail;

        if (userRole === 'admin' || userEmail === 'ciiderydem@gmail.com') {
            document.getElementById('role-badge').textContent = 'ผู้ดูแลระบบ (Admin)';
        }

        let gameState = JSON.parse(localStorage.getItem('pocket_game_state')) || {
            money: 1500,
            salt: 50,
            currentBg: 'https://res.cloudinary.com/ncpkgyfz/image/upload/v1789129860/xwcdfvquvalzrhnwjzxo.png',
            currentLobbyChar: { name: 'ไอจัง', title: 'นักเรียนฝึกหัด', avatar: '🌸' }
        };

        function saveGame() {
            localStorage.setItem('pocket_game_state', JSON.stringify(gameState));
            document.getElementById('lobby-char-name').textContent = `${gameState.currentLobbyChar.name} (${gameState.currentLobbyChar.title})`;
            
            const avatarContainer = document.getElementById('lobby-char-avatar');
            const avatarValue = gameState.currentLobbyChar.avatar;
            
            // ตรวจสอบว่า avatar เป็นลิงก์รูปภาพหรือไม่ เพื่อแสดงผลแบบตัวละครเต็มตัว
            if (avatarValue && (avatarValue.startsWith('http://') || avatarValue.startsWith('https://') || avatarValue.startsWith('data:image'))) {
                avatarContainer.innerHTML = `<img src="${avatarValue}" alt="Character" class="w-full h-full object-contain drop-shadow-xl">`;
            } else {
                avatarContainer.innerHTML = avatarValue;
            }

            document.getElementById('lobby-bg').style.backgroundImage = `url('${gameState.currentBg}')`;
        }

        saveGame();

        function openCharacterSelector() {
            window.location.href = 'diary.html';
        }

        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('pocket_diary_user');
            localStorage.removeItem('pocket_diary_role');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
