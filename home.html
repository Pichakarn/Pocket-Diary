<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POCKET DIARY - หน้าหลัก</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fbfbfb; /* โทนสีขาวมุก */
            color: #1a1a1a;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            overscroll-behavior-y: auto; /* อนุญาตให้ Pull-to-refresh ได้ */
        }
        .royal-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .royal-btn {
            background: #111111; /* สีดำพราวราชวงศ์ */
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .royal-btn:hover {
            background: #2d2d2d;
            transform: translateY(-2px);
        }
        .nav-icon-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #e5e7eb;
            transition: all 0.2s ease;
        }
        .nav-icon-btn:hover {
            background: #ffffff;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex flex-col justify-between select-none">

    <!-- Background Layer (แสดงภาพพื้นหลังที่สวมใส่ หรือค่าเริ่มต้น) -->
    <div id="lobby-background" class="absolute inset-0 z-0 bg-cover bg-center transition-all duration-500" style="background-image: url('https://res.cloudinary.com/demo/image/upload/v1312461200/sample.jpg'); filter: brightness(0.95);">
        <div class="absolute inset-0 bg-white/20 backdrop-blur-[2px]"></div>
    </div>

    <!-- Top Bar: แสดงเงิน (เหรียญ) และ คุกกี้ (เกลือ) แบบ Realtime -->
    <div class="relative z-20 p-4 flex justify-between items-center max-w-lg mx-auto w-full">
        <div class="royal-card px-4 py-2 rounded-2xl flex items-center gap-4 shadow-sm">
            <!-- เหรียญทอง -->
            <div class="flex items-center gap-1.5">
                <span class="text-amber-500 text-lg">🪙</span>
                <span id="user-coins" class="font-bold text-sm text-neutral-900">0</span>
            </div>
            <!-- คุกกี้ -->
            <div class="flex items-center gap-1.5 border-l pl-4 border-neutral-200">
                <span class="text-amber-700 text-lg">🍪</span>
                <span id="user-cookies" class="font-bold text-sm text-neutral-900">0</span>
            </div>
        </div>

        <!-- ปุ่มออกจากระบบ / ตั้งค่าเบื้องต้น -->
        <button onclick="handleLogout()" class="royal-card px-3 py-2 rounded-2xl text-xs font-medium text-neutral-600 hover:text-red-600 cursor-pointer shadow-sm transition-colors">
            ออกระบบ
        </button>
    </div>

    <!-- Center Stage: ตัวละคร / สกินตัวละครที่เลือกมาแสดงหน้าล็อบบี้ -->
    <div class="relative z-10 flex-1 flex items-center justify-center p-4">
        <div class="text-center">
            <div id="lobby-character-container" class="relative inline-block">
                <!-- รูปตัวละครเต็มตัว / สกินที่สวมใส่ล่าสุด -->
                <img id="lobby-character-img" src="https://res.cloudinary.com/demo/image/upload/v1312461200/sample.jpg" alt="Character" class="max-h-[50vh] w-auto object-contain drop-shadow-2xl mx-auto transition-all duration-300">
            </div>
            <div id="lobby-character-name" class="mt-4 inline-block royal-card px-6 py-1.5 rounded-full text-sm font-semibold tracking-wide text-neutral-800 shadow-sm">
                กำลังโหลด...
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar: ฟังก์ชันหลักทั้ง 5 (Diary, Gacha, Inventory, Minigame, Phone) -->
    <div class="relative z-20 p-4 pb-6 max-w-lg mx-auto w-full">
        <div class="royal-card rounded-3xl p-3 flex justify-around items-center shadow-lg">
            
            <!-- 1. DIARY (หนังสือ 📖) -->
            <button onclick="navigateTo('diary.html')" class="nav-icon-btn flex flex-col items-center p-3 rounded-2xl cursor-pointer">
                <span class="text-2xl mb-1">📖</span>
                <span class="text-[10px] font-medium text-neutral-700">ไดอารี่</span>
            </button>

            <!-- 2. GACHA (ดาว ⭐) -->
            <button onclick="navigateTo('gacha.html')" class="nav-icon-btn flex flex-col items-center p-3 rounded-2xl cursor-pointer">
                <span class="text-2xl mb-1">⭐</span>
                <span class="text-[10px] font-medium text-neutral-700">กาชา</span>
            </button>

            <!-- 3. INVENTORY (กระเป๋า 🎒) -->
            <button onclick="navigateTo('inventory.html')" class="nav-icon-btn flex flex-col items-center p-3 rounded-2xl cursor-pointer">
                <span class="text-2xl mb-1">🎒</span>
                <span class="text-[10px] font-medium text-neutral-700">คลังเก็บของ</span>
            </button>

            <!-- 4. MINIGAME (จอยเกม 🎮) -->
            <button onclick="navigateTo('minigame.html')" class="nav-icon-btn flex flex-col items-center p-3 rounded-2xl cursor-pointer">
                <span class="text-2xl mb-1">🎮</span>
                <span class="text-[10px] font-medium text-neutral-700">มินิเกม</span>
            </button>

            <!-- 5. PHONE (โทรศัพท์ 📱) -->
            <button onclick="navigateTo('phone.html')" class="nav-icon-btn flex flex-col items-center p-3 rounded-2xl cursor-pointer">
                <span class="text-2xl mb-1">📱</span>
                <span class="text-[10px] font-medium text-neutral-700">โทรศัพท์</span>
            </button>

        </div>
    </div>

    <!-- Supabase & Config Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        // โหลดข้อมูลผู้ใช้และตั้งค่าหน้าล็อบบี้แบบ Realtime
        async function loadLobbyData() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    window.location.href = 'index.html';
                    return;
                }

                const userId = session.user.id;

                // ดึงข้อมูล User จากตาราง users
                const { data: userData, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('id', userId)
                    .single();

                if (error) throw error;

                if (userData) {
                    // แสดงจำนวนเหรียญและคุกกี้
                    document.getElementById('user-coins').innerText = userData.coins || 0;
                    document.getElementById('user-cookies').innerText = userData.cookies || 0;

                    // โหลดข้อมูลสกินที่สวมใส่หน้าล็อบบี้ และ Background (ถ้ามีบันทึกไว้ในโปรไฟล์)
                    if (userData.equipped_skin_image) {
                        document.getElementById('lobby-character-img').src = userData.equipped_skin_image;
                    }
                    if (userData.equipped_skin_name) {
                        document.getElementById('lobby-character-name').innerText = userData.equipped_skin_name;
                    } else {
                        document.getElementById('lobby-character-name').innerText = userData.username || 'นักเดินทาง';
                    }

                    if (userData.equipped_background) {
                        document.getElementById('lobby-background').style.backgroundImage = `url('${userData.equipped_background}')`;
                    }
                }
            } catch (err) {
                console.error('Error loading lobby:', err.message);
            }
        }

        // ฟังก์ชันเปลี่ยนหน้าอย่างไร้รอยต่อ ค้างอยู่หน้าที่กด ไม่กระพริบ
        function navigateTo(page) {
            window.location.href = page;
        }

        // ออกจากระบบ
        async function handleLogout() {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        // ทำงานทันทีเมื่อโหลดหน้าเสร็จ และรองรับ Realtime Subscription
        window.addEventListener('DOMContentLoaded', () => {
            loadLobbyData();

            // สมัครรับการเปลี่ยนแปลงแบบ Realtime จากตาราง users
            supabase
                .channel('public:users')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'users' }, payload => {
                    loadLobbyData();
                })
                .subscribe();
        });
    </script>
</body>
</html>
